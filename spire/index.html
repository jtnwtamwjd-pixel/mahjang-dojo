<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>天穹の塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0e0b16;--bg2:#171226;--panel:#1f1832;--panel2:#2a2142;--line:rgba(255,255,255,.12);
  --text:#f3eefc;--muted:#a99fc0;--gold:#f5c542;--red:#ff5a64;--hp:#e0414f;--blk:#5aa9ff;--green:#4ade80;--poison:#9be15d;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2b1f4a 0%,#0e0b16 60%) fixed}
button{font-family:var(--body);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(180deg,#ffd76a,#e0a51c);color:#2b1a00;border:none}
button.red{background:linear-gradient(180deg,#ff6b74,#c8323d);color:#fff;border:none}
button.ghost{background:transparent}
button.sm{padding:6px 9px;font-size:12px;border-radius:8px}
#app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#app.fixed{height:100vh;height:100dvh;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.muted{color:var(--muted)}
.kw{color:#ffd76a;font-style:normal;font-weight:700}
b.n{color:#fff}b.n.up{color:#7dff9b}b.n.dn{color:#ff8a8a}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top,0px));background:rgba(14,11,22,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:none}
.top .st{display:flex;align-items:center;gap:3px;font-weight:800;white-space:nowrap}
.top .hp{color:#ff8a93}.top .gold{color:var(--gold)}.top .fl{color:var(--muted);font-size:12px}
.top .sp{flex:1}
.pots{display:flex;gap:3px}
.pot{width:30px;height:30px;border-radius:8px;border:1px dashed rgba(255,255,255,.25);display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.04);padding:0}
.pot.has{border-style:solid;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.pot.sel{outline:2px solid var(--gold)}
.relics{display:flex;gap:2px;padding:3px 8px;overflow-x:auto;flex:none;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.2)}
.relics::-webkit-scrollbar{display:none}
.rel{flex:none;width:30px;height:30px;font-size:19px;display:grid;place-items:center;border-radius:50%;position:relative;padding:0;background:radial-gradient(#3a2e58,#1e1730);border:1px solid rgba(255,215,106,.35)}
.rel i{position:absolute;bottom:-3px;right:-3px;font-style:normal;font-size:9px;background:#000a;border-radius:6px;padding:0 3px;color:#fff}

/* cards */
.card{--cw:80px;position:relative;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.11);border:2px solid #8a8399;box-shadow:0 3px 10px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;padding:calc(var(--cw)*.05);font-size:calc(var(--cw)*.118);flex:none;color:#fff;overflow:visible;background:linear-gradient(180deg,#3a3448,#1d1a24)}
.card.atk{background:linear-gradient(180deg,#6a2530 0%,#30131a 60%)}
.card.skl{background:linear-gradient(180deg,#22487a 0%,#121d33 60%)}
.card.pow{background:linear-gradient(180deg,#6b5517 0%,#2b220a 60%)}
.card.sts{background:linear-gradient(180deg,#45454a,#202024)}
.card.cur{background:linear-gradient(180deg,#43234f,#170c1d)}
.card.rU{border-color:#5fa8ff}.card.rR{border-color:#f5c542;box-shadow:0 0 10px rgba(245,197,66,.35),0 3px 10px rgba(0,0,0,.55)}
.card .cost{position:absolute;top:calc(var(--cw)*-.07);left:calc(var(--cw)*-.07);width:calc(var(--cw)*.27);height:calc(var(--cw)*.27);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e08a1e);color:#2a1300;font-weight:800;display:grid;place-items:center;font-size:calc(var(--cw)*.17);border:2px solid rgba(255,255,255,.4);z-index:2;line-height:1}
.card .cost.bad{background:radial-gradient(circle at 35% 30%,#ccc,#777);color:#333}
.card .cost.mod{color:#0a6b25}
.card .nm{font-weight:800;font-size:1em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--cw)*.03);line-height:1.2}
.card.up .nm{color:#7dff9b}
.card .art{font-size:2.3em;line-height:1.25;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.card .ty{font-size:.72em;color:rgba(255,255,255,.6);line-height:1.1}
.card .ds{font-size:.8em;line-height:1.28;text-align:center;margin-top:2px;overflow:hidden;flex:1;word-break:break-all;padding:0 1px}
.card .ds .kw{color:#ffd76a}
.card.dim{filter:brightness(.6)}
.card.pick{outline:3px solid var(--gold);outline-offset:2px}

/* map */
.mapwrap{position:relative;margin:0 auto;width:100%;max-width:520px}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;padding:0;background:#241c38;border:2px solid #4a3f66;z-index:2}
.node.done{background:#3b2f14;border-color:#a08033;opacity:.85}
.node.av{border-color:var(--gold);box-shadow:0 0 0 0 rgba(245,197,66,.7);animation:pulse 1.3s infinite;background:#3a2c5c}
.node.cur{border-color:#fff;background:#5b4a1c}
.node.boss{width:76px;height:76px;font-size:42px;border-width:3px;border-color:#a8323d;background:radial-gradient(#4a1620,#1a0a0e)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,197,66,.7)}70%{box-shadow:0 0 0 12px rgba(245,197,66,0)}100%{box-shadow:0 0 0 0 rgba(245,197,66,0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);padding:8px}

/* combat */
.field{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px 0;min-height:0;position:relative}
.enemies{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:nowrap;padding-top:6px}
.ent{display:flex;flex-direction:column;align-items:center;min-width:0;flex:0 1 120px;border-radius:12px;padding:4px 2px;position:relative;transition:background .2s}
.ent.tgt{background:rgba(245,197,66,.12);outline:2px dashed rgba(245,197,66,.7)}
.ent .spr{font-size:52px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));transition:transform .15s}
.ent.big .spr{font-size:72px}
.ent .enm{font-size:11px;font-weight:700;color:#ddd;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ent.dying{pointer-events:none;animation:die .7s forwards}.ent.gone{visibility:hidden;pointer-events:none}
@keyframes die{0%{opacity:1}100%{opacity:0;filter:blur(3px)}}
.intent{display:flex;align-items:center;gap:2px;font-weight:800;font-size:15px;min-height:24px;background:rgba(0,0,0,.35);border-radius:12px;padding:1px 8px;white-space:nowrap}
.intent .atkn{color:#ff9aa2}
.hpbar{position:relative;width:100%;max-width:110px;height:13px;background:#2a0d12;border-radius:7px;border:1px solid rgba(0,0,0,.6);margin-top:2px}
.hpbar>span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#ff6b74,#c1222f);border-radius:6px;transition:width .25s}
.hpbar.blkd{border-color:var(--blk);box-shadow:0 0 0 1px var(--blk)}
.hpbar.blkd>span{background:linear-gradient(180deg,#8cc6ff,#3b80c9)}
.hpbar.psn>span{background:linear-gradient(180deg,#b6f07a,#5c9d25)}
.hpbar em{position:absolute;inset:0;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;text-shadow:0 1px 2px #000;line-height:1}
.blkb{position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50% 50% 45% 45%;background:linear-gradient(180deg,#8cc6ff,#2a6db5);font-size:10px;font-weight:800;display:grid;place-items:center;border:1px solid #fff6;z-index:2}
.sts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;min-height:16px}
.sts span{font-size:11px;background:rgba(0,0,0,.4);border-radius:6px;padding:0 3px;white-space:nowrap}
.sts span.bad{background:rgba(120,20,40,.55)}
.player{display:flex;align-items:center;gap:10px;padding:4px 6px 6px}
.player .spr{font-size:58px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.player .pinfo{flex:1;min-width:0}
.player .hpbar{max-width:170px;height:15px}
.player .sts{justify-content:flex-start}
.hit .spr{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.lunge .spr{animation:lunge .3s}
@keyframes lunge{50%{transform:translateY(14px) scale(1.1)}}
.ctrl{display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
.energy{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e08a1e 60%,#8a4a08);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#2a1300;border:2px solid rgba(255,255,255,.5);box-shadow:0 0 14px rgba(255,170,40,.5);flex:none}
.energy.zero{filter:grayscale(.9) brightness(.7)}
.piles{display:flex;gap:6px;flex:1}
.pile{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 7px;min-width:44px}
.pile b{font-size:15px}
.endbtn{padding:12px 14px;font-size:15px}
.hand{position:relative;height:138px;flex:none;display:flex;justify-content:center;align-items:flex-end;padding:0 6px calc(8px + env(safe-area-inset-bottom,0px));overflow:visible}
.hand .card{transition:transform .15s,margin .15s;cursor:pointer;transform-origin:50% 120%}
.hand .card.sel{z-index:20!important}
.preview{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.preview .hint{background:rgba(0,0,0,.75);padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-size:28px;text-shadow:0 2px 10px #000;pointer-events:none;z-index:50;animation:ban 1s forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.floater{position:fixed;z-index:200;pointer-events:none;font-family:var(--display);font-size:24px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:float 1s forwards;transform:translate(-50%,-50%)}
.floater.dmg{color:#fff}.floater.blk{color:#8cc6ff;font-size:18px}.floater.heal{color:#7dff9b}.floater.st{color:#ffd76a;font-size:15px}.floater.psn{color:var(--poison)}
@keyframes float{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-56px}}

/* generic screens */
.scr{flex:1;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel{background:rgba(31,24,50,.85);border:1px solid var(--line);border-radius:14px;padding:14px}
.rewards{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;font-size:15px;background:rgba(42,33,66,.9)}
.rw .ic{font-size:24px;width:30px;text-align:center}
.cardrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.cardrow .card{--cw:104px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px;justify-items:center;padding:8px 2px}
.grid .card{--cw:98px;cursor:pointer}
.shopsec{display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:center}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none;padding:4px}
.item .price{color:var(--gold);font-weight:800;font-size:13px}
.item .price.no{color:#ff8a8a}
.item.sold{opacity:.25;pointer-events:none}
.item .card{--cw:96px}
.ricon{width:54px;height:54px;border-radius:50%;font-size:30px;display:grid;place-items:center;background:radial-gradient(#3a2e58,#1e1730);border:2px solid rgba(255,215,106,.45)}
.sale{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 4px;z-index:3}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;padding:12px 14px;line-height:1.45}
.opts button small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.title{align-items:center;text-align:center;justify-content:center}
.title h1{font-size:44px;letter-spacing:.06em;background:linear-gradient(180deg,#fff7d6,#f5c542 60%,#b07a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(245,197,66,.3))}
.chars{display:flex;gap:10px;width:100%}
.charc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;background:rgba(42,33,66,.9);border:2px solid var(--line)}
.charc.on{border-color:var(--gold);background:rgba(80,60,20,.5)}
.charc .ic{font-size:52px}
.charc p{margin:0;font-size:12px;color:var(--muted);font-weight:500;line-height:1.5}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none}
#modal.on{display:flex;flex-direction:column;background:rgba(5,3,10,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.mhead h3{flex:1;font-size:17px}
.mbody{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);justify-content:center;align-items:center;flex-wrap:wrap}
.mcenter{margin:auto;max-width:420px;width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:86vh;overflow-y:auto}
.ilist{display:flex;flex-direction:column;gap:8px}
.ilist div{display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.ilist .ic{font-size:20px;width:26px;text-align:center;flex:none}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:8px 14px;border-radius:12px;z-index:300;font-weight:700;pointer-events:none;animation:toast 1.4s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.upar{display:flex;align-items:center;gap:10px;justify-content:center}
.upar .card{--cw:120px}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;text-align:left}
</style></head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';
const SAVE='tenkyu_save_v1',META='tenkyu_meta_v1';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=arr=>{let t=arr.reduce((s,x)=>s+x[1],0),r=Math.random()*t;for(const[it,w]of arr){if((r-=w)<0)return it}return arr[arr.length-1][0]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const v=(a,u)=>Array.isArray(a)?a[u?1:0]:a;
const kw=s=>`<i class="kw">${s}</i>`;
const esc=s=>String(s);
let S=null,C=null;
const UI={sel:null,pot:null,busy:false,modal:null,fxq:[],charSel:'k',speed:1};
const inC=()=>!!(S&&C&&S.screen==='combat');
const hasR=id=>!!(S&&S.relics.includes(id));

/* ================= ステータス ================= */
const ST={
 str:{n:'筋力',i:'💪',d:'攻撃のダメージが{n}増える。'},
 dex:{n:'敏捷',i:'🦶',d:'カードで得るブロックが{n}増える。'},
 vigor:{n:'活力',i:'🐂',d:'次に使う攻撃カードのダメージが{n}増える。'},
 weak:{n:'弱体',i:'🥀',d:'与える攻撃ダメージが25%減る。残り{n}ターン。',bad:1},
 vuln:{n:'脆弱',i:'💔',d:'受ける攻撃ダメージが50%増える。残り{n}ターン。',bad:1},
 frail:{n:'虚弱',i:'🩹',d:'カードで得るブロックが25%減る。残り{n}ターン。',bad:1},
 poison:{n:'毒',i:'☠️',d:'ターン開始時に{n}ダメージを受け、毒が1減る。',bad:1},
 ritual:{n:'儀式',i:'🕯️',d:'ターン終了時に筋力{n}を得る。'},
 metal:{n:'金属化',i:'⚙️',d:'ターン終了時にブロック{n}を得る。'},
 thorns:{n:'棘',i:'🌵',d:'攻撃を受けるたび、攻撃者に{n}ダメージを返す。'},
 flameb:{n:'炎の障壁',i:'🔥',d:'このターン、攻撃を受けるたび攻撃者に{n}ダメージ。'},
 demon:{n:'悪魔の形',i:'😈',d:'ターン開始時に筋力{n}を得る。'},
 combust:{n:'燃焼',i:'☄️',d:'ターン終了時にHPを1失い、敵全体に{n}ダメージ。'},
 barricade:{n:'鉄城',i:'🏯',d:'ターン開始時にブロックが消えない。'},
 noxious:{n:'毒の結界',i:'🌫️',d:'ターン開始時に敵全体に毒{n}を与える。'},
 blades:{n:'無限の刃',i:'♾️',d:'ターン開始時に刃片を{n}枚手札に加える。'},
 accuracy:{n:'刃研ぎ',i:'🎯',d:'刃片のダメージが{n}増える。'},
 envenom:{n:'毒の王',i:'🐍',d:'攻撃で防がれなかったダメージを与えるたび、毒{n}を与える。'},
 afterimg:{n:'残像',i:'👥',d:'カードを使うたびにブロック{n}を得る。'},
 strDown:{n:'力み',i:'⏬',d:'ターン終了時に筋力を{n}失う。',bad:1},
 nextE:{n:'気力',i:'⚡',d:'次のターン開始時にエネルギー+{n}。'},
 nextDraw:{n:'次の一手',i:'📜',d:'次のターン開始時にカードを{n}枚多く引く。'},
 enrage:{n:'激怒',i:'😡',d:'プレイヤーがスキルを使うたびに筋力{n}を得る。'},
 sleep:{n:'睡眠',i:'💤',d:'眠っている。HPが減ると目を覚ます。'},
 spore:{n:'胞子',i:'🍄',d:'倒れたとき、プレイヤーに脆弱{n}を与える。'},
 artifact:{n:'加護',i:'✨',d:'次に受けるデバフを{n}回無効化する。'},
 angry:{n:'怒り',i:'💢',d:'HPが減るたびに筋力{n}を得る。'},
 intang:{n:'霊体',i:'👻',d:'受けるダメージがすべて1になる。'},

let P={};
function pvD(b,m=1){if(!inC())return b;const s=C.p.st;let d=b+(s.str||0)*m+(s.vigor||0);if(s.weak)d*=.75;return Math.max(0,Math.floor(d))}
function pvB(b){if(!inC())return b;const s=C.p.st;let d=b+(s.dex||0);if(s.frail)d*=.75;return Math.max(0,Math.floor(d))}
const fmtN=(b,x)=>`<b class="n ${x>b?'up':x<b?'dn':''}">${x}</b>`;
P.d=(b,m)=>fmtN(b,pvD(b,m));P.b=b=>fmtN(b,pvB(b));
const shivBase=u=>v([4,6],u)+(inC()?(C.p.st.accuracy||0):0);

/* ================= 共通処理 ================= */
function mk(id,up=0){return {id,up:up?1:0,uid:S?++S.uidc:Math.random()}}
function cardCost(c){const d=CD[c.id];if(d.c==='u')return 'u';let k=v(d.c,c.up);if(c.cc!=null&&k!==-1)k=c.cc;return k}
const canUp=c=>{const d=CD[c.id];return !c.up&&d.t!=='sts'&&d.t!=='cur'};
const cname=c=>CD[c.id].n+(c.up?'+':'');
function isEx(c){return !!v(CD[c.id].ex,c.up)}
function alive(){return C?C.enemies.filter(e=>!e.dead):[]}
function addSt(o,k,n){o.st[k]=(o.st[k]||0)+n;if(o.st[k]===0)delete o.st[k]}
function gainMax(n){S.maxHp+=n;S.hp+=n;if(inC())fx('p','+'+n,'heal')}
function heal(n){const b=S.hp;S.hp=Math.min(S.maxHp,S.hp+n);if(inC()&&S.hp>b)fx('p','+'+(S.hp-b),'heal')}
function gainGold(n){if(hasR('rEcto'))return;S.gold+=n;S.stats.gold+=n}
function baseEnergy(){return 3+S.relics.reduce((s,r)=>s+(RL[r].en||0),0)}

/* ---- 戦闘アクション ---- */
function fx(k,t,cls){UI.fxq.push({k,t,cls})}
function hit(t,base,strMul=1){
  if(!t||t.dead)return 0;
  const s=C.p.st;let d=base+(s.str||0)*strMul+(s.vigor||0);if(s.weak)d*=.75;if(t.st.vuln)d*=1.5;d=Math.floor(d*(C.mul||1));d=Math.max(0,d);
  return dmgE(t,d,true);
}
function hitAll(base){let h=0;for(const e of alive())h+=hit(e,base);return h}
function dmgE(e,d,atk){
  if(e.dead)return 0;
  if(e.st.intang)d=Math.min(d,1);
  const b=Math.min(e.block,d);e.block-=b;const l=d-b;
  fx(e.uid,b&&!l?'ブロック':'-'+d,b&&!l?'blk':'dmg');
  if(l>0){e.hp-=l;S.stats.dmg+=l;
    if(e.st.sleep){delete e.st.sleep;delete e.st.metal;e.intent=M('目覚めた',{t:'stun'});}
    if(e.st.angry)addSt(e,'str',e.st.angry);
    if(atk&&C.p.st.envenom)debE(e,'poison',C.p.st.envenom);
  }
  if(e.hp<=0)killE(e);
  return l;
}
function killE(e){
  const d=EN[e.key];
  if(d.onDeath&&d.onDeath(e)){return}
  e.hp=0;e.dead=true;e.deadT=Date.now();e.block=0;S.stats.kills++;
  if(e.st.spore)debP('vuln',e.st.spore);
  if(e.st.corpse)for(const o of alive())dmgE(o,e.maxHp);
  if(hasR('rHorn')&&alive().length){C.energy++;draw(1)}
  if(d.boss)for(const m of alive().filter(x=>x.minion)){m.dead=true;m.hp=0}
}
function debE(e,k,n){
  if(!e||e.dead)return;
  const bad=(ST[k]&&ST[k].bad)||n<0;
  if(bad&&e.st.artifact){addSt(e,'artifact',-1);fx(e.uid,'無効化','st');return}
  addSt(e,k,n);fx(e.uid,(ST[k]?ST[k].n:k)+(n>0&&k!=='str'?'':' '+(n>0?'+':'')+n),k==='poison'?'psn':'st');
}
function debP(k,n){addSt(C.p,k,n);if(C.phase==='enemy')C.pj[k]=1;fx('p',ST[k].n+(k==='str'||k==='dex'?' '+n:''),'st')}
function blk(base){const s=C.p.st;let d=base+(s.dex||0);if(s.frail)d*=.75;gainBlockRaw(Math.max(0,Math.floor(d)))}
function gainBlockRaw(n){if(n<=0)return;C.p.block+=n;fx('p','+'+n,'blk')}
function loseHP(n){if(hasR('rRod'))n=Math.max(0,n-1);if(n<=0)return;S.hp-=n;S.stats.taken+=n;fx('p','-'+n,'dmg')}
function hitP(e,base){
  let d=base+(e.st.str||0);if(e.st.weak)d*=.75;if(C.p.st.vuln)d*=1.5;d=Math.max(0,Math.floor(d));
  const b=Math.min(C.p.block,d);C.p.block-=b;const l=d-b;
  if(l>0)loseHP(l);else fx('p','ブロック','blk');
  const th=(C.p.st.thorns||0)+(C.p.st.flameb||0);if(th&&!e.dead)dmgE(e,th);
}
function draw(n){
  for(let i=0;i<n;i++){
    if(C.hand.length>=10)break;
    if(!C.draw.length){if(!C.disc.length)break;C.draw=shuffle(C.disc);C.disc=[]}
    C.hand.push(C.draw.pop());
  }
}
function addHand(id,up,n){for(let i=0;i<n;i++){const c=mk(id,up);if(C.hand.length<10)C.hand.push(c);else C.disc.push(c)}}
function rmHand(c){const i=C.hand.indexOf(c);if(i>=0)C.hand.splice(i,1)}
function exhaust(c){C.exh.push(c);if(hasR('rBranch')){const pool=Object.keys(CD).filter(k=>CD[k].cl===S.char&&'CUR'.includes(CD[k].r));addHand(pick(pool),0,1)}}
function discardCard(c){C.disc.push(c)}
async function discardN(n){if(!C.hand.length)return;const xs=await chooseHand(C.hand,Math.min(n,C.hand.length),'捨てるカードを選択');xs.forEach(c=>{rmHand(c);discardCard(c)})}
function chooseHand(list,n,title,mode){
  if(!list.length)return Promise.resolve([]);
  if(list.length<=n&&mode!=='up')return Promise.resolve([...list]);
  return chooseCards(list,{n,title,mode,combat:1});
}

/* ---- 戦闘の流れ ---- */
function spawn(key,ofs){
  const d=EN[key];const sc=1+.45*Math.max(0,S.act-d.act);
  const hp=Math.round(R(d.hp[0],d.hp[1])*sc);
  return {uid:'e'+(++S.uidc),key,n:d.n,ic:d.ic,hp,maxHp:hp,block:0,st:Object.assign({},d.st||{}),intent:null,mv:0,hist:[],sc,ofs:ofs||0,awake:0,minion:!!d.minion,big:!!d.big};
}
function setIntent(e){
  const m=Object.assign({},EN[e.key].ai(e,C));
  if(e.sc>1){if(m.dmg&&m.nm!=='分断')m.dmg=Math.round(m.dmg*e.sc);if(m.blk)m.blk=Math.round(m.blk*e.sc);if(m.allyBlk)m.allyBlk=Math.round(m.allyBlk*e.sc)}
  e.intent=m;e.hist.push(m.nm);e.mv++;
}
function startCombat(groups,kind){
  C=S.combat={kind,turn:1,energy:0,p:{block:0,st:{}},enemies:[],draw:[],hand:[],disc:[],exh:[],phase:'player',mul:1,extraDraw:0,atkT:0,sklT:0,pj:{},start:S.hp};
  C.enemies=groups.map((k,i)=>spawn(k,i));
  const cards=shuffle(S.deck.map(c=>({id:c.id,up:c.up,uid:c.uid})));
  const inn=cards.filter(c=>v(CD[c.id].inn,c.up)),rest=cards.filter(c=>!v(CD[c.id].inn,c.up));
  C.draw=[...rest,...inn];
  if(inn.length>5)C.extraDraw+=inn.length-5;
  S.screen='combat';UI.sel=null;UI.pot=null;
  for(const r of S.relics)RL[r].start&&RL[r].start();
  for(const e of C.enemies)setIntent(e);
  startTurn(true);
}
function startTurn(first){
  C.phase='player';const p=C.p;
  if(!first&&!p.st.barricade){p.block=hasR('rCalipers')?Math.max(0,p.block-15):0}
  C.energy=(hasR('rIce')&&!first?C.energy:0)+baseEnergy();
  if(p.st.nextE){C.energy+=p.st.nextE;delete p.st.nextE}
  C.atkT=0;C.sklT=0;
  if(p.st.demon)addSt(p,'str',p.st.demon);
  if(p.st.noxious)alive().forEach(e=>debE(e,'poison',p.st.noxious));
  for(const r of S.relics)RL[r].turn&&RL[r].turn(C.turn);
  let n=5+(C.turn===1?C.extraDraw:0)+(p.st.nextDraw||0);delete p.st.nextDraw;
  draw(n);
  if(p.st.blades)addHand('mShiv',0,p.st.blades);
  UI.busy=false;
  if(C.turn>1)banner('あなたのターン');
  render();
}
function checkWin(){if(C&&!alive().length&&C.phase!=='done'){winCombat();return true}return false}
function checkLose(){if(S.hp<=0){gameOver(false);return true}return false}

function canPlay(c){
  const k=cardCost(c);if(k==='u')return '使用できないカード';
  if(k!==-1&&k>C.energy)return 'エネルギーが足りない';
  return '';
}
async function playCard(c,t){
  const d=CD[c.id];const k=cardCost(c);let X=0;
  if(k===-1){X=C.energy;C.energy=0}else C.energy-=k;
  rmHand(c);
  if(d.t==='atk'){S.cnt.pen=(S.cnt.pen||0)+1;if(hasR('rPenNib')&&S.cnt.pen>=10){C.mul=2;S.cnt.pen=0;fx('p','羽ペン！','st')}}
  if(d.f)await d.f(c.up,t,X,c);
  C.mul=1;
  if(d.t==='atk'&&C.p.st.vigor)delete C.p.st.vigor;
  if(d.t==='pow'){S.stats.powers=(S.stats.powers||0)+1}
  else if(isEx(c))exhaust(c);else C.disc.push(c);
  S.stats.cards++;
  // 反応
  if(C.p.st.afterimg)gainBlockRaw(C.p.st.afterimg);
  if(d.t==='atk'){C.atkT++;if(C.atkT%3===0){if(hasR('rKunai'))addSt(C.p,'dex',1);if(hasR('rShuriken'))addSt(C.p,'str',1);if(hasR('rFan'))gainBlockRaw(4)}}
  if(d.t==='skl'){C.sklT++;for(const e of alive())if(e.st.enrage){addSt(e,'str',e.st.enrage);fx(e.uid,'筋力+'+e.st.enrage,'st')}if(C.sklT%3===0&&hasR('rLetter'))alive().forEach(e=>dmgE(e,5))}
  if(d.t==='pow')for(const e of alive())if(e.st.curious){addSt(e,'str',e.st.curious);fx(e.uid,'筋力+'+e.st.curious,'st')}
  for(const e of alive())if('timeWarp' in e.st){e.st.timeWarp=(e.st.timeWarp||0)+1;if(e.st.timeWarp>=12){e.st.timeWarp=0;addSt(e,'str',2);C.forceEnd=1}}
  if(hasR('rTop')&&!C.hand.length&&alive().length)draw(1);
}
async function doPlay(c,t){
  UI.busy=true;UI.sel=null;
  await playCard(c,t);
  if(checkLose())return;
  if(checkWin())return;
  UI.busy=false;render();
  if(C.forceEnd){C.forceEnd=0;banner('時が止まった……');await sleep(600);endTurn()}
}
async function endTurn(){
  if(!inC()||C.phase!=='player'||UI.busy)return;
  UI.busy=true;UI.sel=null;UI.pot=null;C.phase='enemy';
  const p=C.p;
  for(const c of [...C.hand]){if(c.id==='sBurn'){const b=Math.min(p.block,2);p.block-=b;if(2-b)loseHP(2-b)}if(c.id==='cDoubt')debP('weak',1)}
  if(p.st.metal)gainBlockRaw(p.st.metal);
  if(p.st.combust){loseHP(1);alive().forEach(e=>dmgE(e,p.st.combust))}
  if(hasR('rOricha')&&p.block===0)gainBlockRaw(6);
  if(p.st.strDown){addSt(p,'str',-p.st.strDown);delete p.st.strDown}
  delete p.st.flameb;
  for(const c of [...C.hand]){rmHand(c);if(v(CD[c.id].eth,c.up))exhaust(c);else C.disc.push(c)}
  render();
  if(checkLose())return;if(checkWin())return;
  await sleep(350/UI.speed);
  C.pj={};
  for(const e of [...C.enemies]){
    if(e.dead)continue;
    if(!S.combat)return;
    e.block=0;
    if(e.st.poison){dmgE(e,e.st.poison);addSt(e,'poison',-1);render();if(checkWin())return;if(e.dead)continue;await sleep(250/UI.speed)}
    await enemyAct(e);
    render();
    if(checkLose())return;if(checkWin())return;
    // ターン終了処理
    if(e.st.ritual&&e.mv>1)addSt(e,'str',e.st.ritual);
    if(e.st.metal)e.block+=e.st.metal;
    if(e.st.sleep){e.st.sleep--;if(!e.st.sleep){delete e.st.sleep;delete e.st.metal}}
    for(const k of ['weak','vuln','frail'])if(e.st[k])addSt(e,k,-1);
    EN[e.key].endT&&EN[e.key].endT(e);
    await sleep(380/UI.speed);
  }
  for(const k of ['weak','vuln','frail'])if(p.st[k]&&!C.pj[k])addSt(p,k,-1);
  C.pj={};
  for(const e of alive())setIntent(e);
  C.turn++;
  startTurn(false);
}
async function enemyAct(e){
  const m=e.intent;if(!m)return;
  if(m.t==='sleep'||m.t==='stun'||m.t==='unknown')return;
  const el=document.querySelector(`[data-ent="${e.uid}"]`);if(el&&m.dmg!=null){el.classList.remove('lunge');void el.offsetWidth;el.classList.add('lunge')}
  if(m.cleanse)for(const k in e.st)if((ST[k]&&ST[k].bad)||e.st[k]<0)delete e.st[k];
  if(m.heal){e.hp=Math.min(e.maxHp,e.hp+m.heal);fx(e.uid,'+'+m.heal,'heal')}
  if(m.blk){e.block+=m.blk;fx(e.uid,'+'+m.blk,'blk')}
  if(m.allyBlk)for(const a of alive()){a.block+=m.allyBlk;fx(a.uid,'+'+m.allyBlk,'blk')}
  if(m.buff)for(const k in m.buff){addSt(e,k,m.buff[k]);fx(e.uid,ST[k].n+'+'+m.buff[k],'st')}
  if(m.allyBuff)for(const a of alive())for(const k in m.allyBuff){addSt(a,k,m.allyBuff[k])}

function rollRar(kind){const w=kind==='boss'?[[ 'R',1]]:kind==='elite'?[['C',50],['U',40],['R',10]]:[['C',60],['U',36],['R',4]];return wpick(w)}
function rollCards(n,kind,cl){
  cl=cl||S.char;const out=[];
  while(out.length<n){
    const r=rollRar(kind);const pool=Object.keys(CD).filter(k=>CD[k].cl===cl&&CD[k].r===r&&!out.some(o=>o.id===k));
    if(!pool.length)continue;
    const up=(S.act>=2&&Math.random()<(S.act===2?.1:.2))?1:0;
    out.push({id:pick(pool),up});
  }
  return out;
}
function rollRelic(rar){
  rar=rar||wpick([['C',50],['U',33],['R',17]]);
  let pool=Object.keys(RL).filter(k=>RL[k].r===rar&&!S.relics.includes(k)&&!(S.seenR||[]).includes(k));
  if(!pool.length)pool=Object.keys(RL).filter(k=>'CUR'.includes(RL[k].r)&&!S.relics.includes(k));
  if(!pool.length)return 'rStrawberry';
  const id=pick(pool);(S.seenR=S.seenR||[]).push(id);return id;
}
function rollPotion(){return pick(Object.keys(PO))}
function gainRelic(id){if(S.relics.includes(id))return;S.relics.push(id);RL[id].pick&&RL[id].pick()}
function gainPotion(id){if(hasR('rSozu'))return false;const i=S.potions.indexOf(null);if(i<0)return false;S.potions[i]=id;return true}

function genMap(){
  const H=15,W=7;const rows=[...Array(H)].map(()=>Array(W).fill(null));
  let first=-1;
  for(let p=0;p<6;p++){
    let c=R(0,W-1);if(p===1)while(c===first)c=R(0,W-1);if(p===0)first=c;
    for(let r=0;r<H;r++){
      if(!rows[r][c])rows[r][c]={t:null,nx:[],jx:R(-8,8),jy:R(-6,6)};
      if(r<H-1){
        let o=[c-1,c,c+1].filter(x=>x>=0&&x<W).filter(nc=>{
          if(nc===c+1&&rows[r][c+1]&&rows[r][c+1].nx.includes(c))return false;
          if(nc===c-1&&rows[r][c-1]&&rows[r][c-1].nx.includes(c))return false;return true});
        const nc=pick(o);if(!rows[r][c].nx.includes(nc))rows[r][c].nx.push(nc);c=nc;
      }
    }
  }
  const parents=(r,c)=>r===0?[]:rows[r-1].map((n,i)=>n&&n.nx.includes(c)?n:null).filter(Boolean);
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const n=rows[r][c];if(!n)continue;
    if(r===0){n.t='M';continue}if(r===8){n.t='T';continue}if(r===H-1){n.t='R';continue}
    let t;for(let k=0;k<8;k++){
      t=wpick([['M',45],['?',22],['E',r>=5?16:0],['R',r>=5&&r!==H-2?12:0],['$',r>=2?6:0]]);
      if('ER$'.includes(t)&&parents(r,c).some(p=>p.t===t))continue;break}
    n.t=t;
  }
  return rows;
}

function availNodes(){
  if(!S.pos)return S.map[0].map((n,c)=>n?[0,c]:null).filter(Boolean);
  if(S.pos.r===14)return [['B',0]];
  return S.map[S.pos.r][S.pos.c].nx.map(c=>[S.pos.r+1,c]);
}
function goNode(r,c){
  if(!availNodes().some(([a,b])=>a===r&&b===c))return;
  S.floor++;
  if(r==='B'){S.pos={r:15,c:0};startCombat([S.boss],'boss');return}
  S.pos={r,c};S.path.push([r,c]);
  const t=S.map[r][c].t;
  if(t==='M')fightNormal();
  else if(t==='E')startCombat(pick(ACTS[S.act].elite),'elite');
  else if(t==='R'){S.screen='rest';S.restDone=0;render()}
  else if(t==='$'){S.shop=genShop();S.screen='shop';render()}
  else if(t==='T'){S.screen='chest';S.chestOpen=0;render()}
  else if(t==='?'){const x=Math.random();if(x<.15)fightNormal();else if(x<.2){S.shop=genShop();S.screen='shop';render()}else startEvent()}
}

function genShop(){
  const cl=S.char,cards=[];
  const types=['atk','atk','skl','skl','pow'];
  for(const t of types){let id;for(let i=0;i<40;i++){const r=wpick([['C',55],['U',37],['R',8]]);const pool=Object.keys(CD).filter(k=>CD[k].cl===cl&&CD[k].t===t&&CD[k].r===r&&!cards.some(c=>c.id===k));if(pool.length){id=pick(pool);break}}if(id)cards.push({id,p:priceOf(CD[id].r)})}
  const xs=Object.keys(CD).filter(k=>CD[k].cl==='x');shuffle(xs);
  for(const id of xs.slice(0,2))cards.push({id,p:Math.round(priceOf(CD[id].r)*1.2)});
  const sale=R(0,Math.min(4,cards.length-1));cards[sale].p=Math.round(cards[sale].p/2);cards[sale].sale=1;
  const relics=[];for(let i=0;i<2;i++){const id=rollRelic();relics.push({id,p:{C:R(143,157),U:R(238,262),R:R(285,315)}[RL[id].r]||150})}
  if(!S.relics.includes('rMember')&&Math.random()<.5)relics.push({id:'rMember',p:R(170,190)});else{const id=rollRelic('C');relics.push({id,p:R(143,157)})}
  const pots=[0,1,2].map(()=>({id:rollPotion(),p:R(48,58)}));
  return {cards,relics,pots,removed:0};
}

function eventHTML(){
  const ev=EV[S.event.k];
  if(S.event.res!=null)return `<div class="scr"><div class="panel" style="text-align:center"><div style="font-size:56px">${ev.ic}</div><h2 style="font-size:20px;margin:6px 0">${ev.t}</h2><p style="line-height:1.8">${S.event.res}</p></div><button class="pri" style="padding:14px" onclick="toMap()">先へ進む</button></div>`;
  return `<div class="scr"><div class="panel" style="text-align:center"><div style="font-size:56px">${ev.ic}</div><h2 style="font-size:20px;margin:6px 0">${ev.t}</h2><p class="muted" style="line-height:1.8">${ev.x}</p></div>
  <div class="opts">${ev.o().map((o,i)=>`<button ${o.dis?'disabled':''} onclick="evChoose(${i})">${o.l}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}</div></div>`;
}
function chestHTML(){
  if(!S.chestOpen)return `<div class="scr" style="justify-content:center;align-items:center"><div style="font-size:90px">🧰</div><button class="pri" style="padding:14px 30px;font-size:16px" onclick="openChest()">宝箱を開ける</button></div>`;
  return `<div class="scr" style="justify-content:center;align-items:center;text-align:center"><div class="ricon" style="width:80px;height:80px;font-size:44px">${RL[S.chestOpen.r].ic}</div><h2 style="font-size:20px">${RL[S.chestOpen.r].n}</h2><p class="muted">${RL[S.chestOpen.r].d}</p>${S.chestOpen.g?`<p>🪙 ${S.chestOpen.g}ゴールドも入っていた！</p>`:''}<button class="pri" style="padding:14px 30px" onclick="toMap()">先へ進む</button></div>`;
}
function openChest(){const r=rollRelic();gainRelic(r);const g=hasR('rEcto')?0:R(20,40);gainGold(g);S.chestOpen={r,g};render()}
function endHTML(win){
  const st=S.stats;
  return `<div class="scr title"><div style="font-size:72px">${win?'🌟':'🪦'}</div><h1 style="font-size:34px">${win?'塔を踏破！':'力尽きた……'}</h1><p class="muted">${win?'星の光があなたを包む。おめでとう！':`${ACTS[S.act].n}・${S.floor}階で倒れた。`}</p>
  <div class="panel stats" style="width:100%"><span>キャラクター</span><b>${CH[S.char].n}</b><span>到達階</span><b>${S.floor}階</b><span>倒した敵</span><b>${st.kills}</b><span>エリート撃破</span><b>${st.elites}</b><span>ボス撃破</span><b>${st.bosses}</b><span>与えたダメージ</span><b>${st.dmg}</b><span>使ったカード</span><b>${st.cards}</b><span>デッキ枚数</span><b>${S.deck.length}</b><span>レリック</span><b>${S.relics.map(r=>RL[r].ic).join('')}</b></div>
  <button class="pri" style="padding:14px 30px;font-size:16px" onclick="S=null;C=null;render()">タイトルへ</button></div>`;
}

/* ================= モーダル ================= */
function openModal(m){UI.modal=m;renderModal()}
function closeModal(){const m=UI.modal;UI.modal=null;renderModal();if(m&&m.onClose)m.onClose()}
function renderModal(){
  const m=UI.modal;if(!m){$modal.className='';$modal.innerHTML='';return}
  $modal.className='on';
  if(m.t==='center')$modal.innerHTML=`<div class="mcenter">${m.html}</div>`;
  else $modal.innerHTML=`<div class="mhead"><h3>${m.title||''}</h3>${m.noClose?'':'<button class="sm" onclick="closeModal()">✕</button>'}</div><div class="mbody">${m.body||''}</div>${m.foot?`<div class="mfoot">${m.foot}</div>`:''}`;
}
$modal.addEventListener('click',e=>{if(e.target===$modal&&UI.modal&&UI.modal.t==='center'&&!UI.modal.noClose)closeModal()});
function sortCards(a){const o={atk:0,skl:1,pow:2,sts:3,cur:4};return [...a].sort((x,y)=>o[CD[x.id].t]-o[CD[y.id].t]||CD[x.id].n.localeCompare(CD[y.id].n,'ja')||y.up-x.up)}
function showDeck(){openModal({t:'full',title:`デッキ（${S.deck.length}枚）`,body:`<div class="grid">${sortCards(S.deck).map(c=>cardHTML(c)).join('')}</div>`})}
function showPile(k){const a=C[k];const nm={draw:'山札（順不同）',disc:'捨て札',exh:'廃棄'}[k];openModal({t:'full',title:`${nm}（${a.length}枚）`,body:a.length?`<div class="grid">${(k==='draw'?sortCards(a):a).map(c=>cardHTML(c)).join('')}</div>`:'<p class="muted" style="text-align:center">カードがありません</p>'})}
function showRelic(id){const r=RL[id];openModal({t:'center',html:`<div style="text-align:center;font-size:44px">${r.ic}</div><h3 style="text-align:center">${r.n}</h3><p style="line-height:1.6;text-align:center">${r.d}${r.cnt?`<br><small class="muted">カウント：${r.cnt()}</small>`:''}</p><button onclick="closeModal()">閉じる</button>`})}
function potMenu(i){
  const id=S.potions[i];if(!id)return;const d=PO[id];
  const can=inC()?(C.phase==='player'&&!UI.busy):!!d.any;
  openModal({t:'center',html:`<div style="text-align:center;font-size:44px">${d.ic}</div><h3 style="text-align:center">${d.n}</h3><p style="text-align:center;line-height:1.6">${d.d}</p><div style="display:flex;gap:8px;justify-content:center"><button onclick="S.potions[${i}]=null;closeModal();render()">捨てる</button><button onclick="closeModal()">閉じる</button><button class="pri" ${can?'':'disabled'} onclick="usePotion(${i})">使う</button></div>`});
}
function stList(st){const ks=Object.keys(st).filter(k=>ST[k]&&(st[k]||k==='timeWarp'));if(!ks.length)return '<p class="muted">状態変化なし</p>';return `<div class="ilist">${ks.map(k=>`<div><span class="ic">${ST[k].i}</span><span><b>${ST[k].n} ${k==='barricade'?'':st[k]}</b><br><small class="muted">${ST[k].d.replace('{n}',st[k])}</small></span></div>`).join('')}</div>`}
function showEnemy(e){openModal({t:'center',html:`<div style="text-align:center;font-size:48px">${e.ic}</div><h3 style="text-align:center">${e.n}</h3><p style="text-align:center">❤️ ${e.hp}/${e.maxHp}${e.block?` 🛡️${e.block}`:''}</p><div class="panel" style="padding:10px"><b>次の行動</b><br>${intentHTML(e)}<br><small>${intentText(e)}</small></div>${stList(e.st)}<button onclick="closeModal()">閉じる</button>`})}
function showPlayer(){if(UI.sel!=null){UI.sel=null;render();return}openModal({t:'center',html:`<div style="text-align:center;font-size:48px">${CH[S.char].ic}</div><h3 style="text-align:center">${CH[S.char].n}</h3><p style="text-align:center">❤️ ${S.hp}/${S.maxHp}${C.p.block?` 🛡️${C.p.block}`:''}</p>${stList(C.p.st)}<button onclick="closeModal()">閉じる</button>`})}
function showMenu(){openModal({t:'center',html:`<h3>メニュー</h3><button onclick="closeModal();showHelp()">遊び方</button><button onclick="UI.speed=UI.speed===1?2:1;closeModal();toast('敵の速度：'+(UI.speed===1?'ふつう':'はやい'))">敵の行動速度：${UI.speed===1?'ふつう':'はやい'}</button><button onclick="closeModal();render();S=null;C=null;render()">タイトルへ（自動保存済み）</button><button class="red" onclick="abandon()">この挑戦を諦める</button><button onclick="closeModal()">閉じる</button>`})}
function abandon(){if(UI.ab){UI.ab=0;closeModal();gameOver(false);return}UI.ab=1;toast('もう一度押すと諦めます');setTimeout(()=>UI.ab=0,2500)}
function showHelp(){openModal({t:'full',title:'遊び方',body:`<div style="line-height:1.8;max-width:520px;margin:0 auto">
<p>🗼 <b>目的</b>：3つの層を登り、各層のボスを倒して塔の頂を目指します。HPが0になると最初からやり直しです。</p>
<p>🗺️ <b>マップ</b>：下から上へ道を選んで進みます。⚔️敵、👹エリート（強いがレリックを落とす）、🔥休憩所、🪙ショップ、❓イベント、💎宝箱。</p>
<p>🃏 <b>戦闘</b>：毎ターン、エネルギー3とカード5枚でスタート。カードを<b>タップで選び、もう一度タップ</b>で使います。敵が複数いるときは、選んだ後に<b>敵をタップ</b>。</p>
<p>🗡️ 敵の頭上には<b>次の行動</b>が表示されます。攻撃が来るならブロックで守り、隙があれば攻めましょう。ブロックは自分のターン開始時に消えます。</p>
<p>📈 <b>デッキ構築</b>：戦闘に勝つとカードを1枚選んで加えられます。強いカードだけを厳選し、弱いカードは削除するのがコツ。</p>
<p>🔍 敵や自分をタップすると、状態や次の行動の詳細が見られます。</p>
<p>💾 進行は自動で保存されます（戦闘中はターン開始時点）。</p>
<p><b>用語</b><br>${kw('廃棄')}：使うとこの戦闘中は戻らない。<br>${kw('儚い')}：ターン終了時に手札にあると廃棄される。<br>${kw('先天')}：戦闘開始時に必ず手札に来る。<br>${kw('強化')}：カードの性能が上がる（名前に＋）。</p></div>`})}
/* カード選択 */
function chooseCards(list,opt){
  return new Promise(res=>{
    UI.ch={list,opt,sel:[],res};
    const prevBusy=UI.busy;
    drawChoose();
  });
}
function drawChoose(){
  const ch=UI.ch;const {list,opt}=ch;
  const shown=opt.combat?list:sortCards(list);ch.shown=shown;
  let foot='';
  if(opt.mode==='up'&&ch.sel.length===1){const c=ch.sel[0];foot=`<div class="upar">${cardHTML(c,{style:'--cw:96px'})}<span style="font-size:22px">➜</span>${cardHTML({...c,up:1},{style:'--cw:96px'})}</div>`}
  foot+=`<div style="display:flex;gap:8px;width:100%;justify-content:center">${opt.cancel?'<button onclick="chooseDone(1)">やめる</button>':''}<button class="pri" ${ch.sel.length===opt.n?'':'disabled'} onclick="chooseDone()">決定${opt.n>1?`（${ch.sel.length}/${opt.n}）`:''}</button></div>`;
  UI.modal={t:'full',title:opt.title,noClose:1,body:`<div class="grid">${shown.map((c,i)=>cardHTML(c,{cls:ch.sel.includes(c)?'pick':'',attr:`onclick="chooseTap(${i})"`})).join('')}</div>`,foot};
  renderModal();
}
function chooseTap(i){const ch=UI.ch;const c=ch.shown[i];const k=ch.sel.indexOf(c);if(k>=0)ch.sel.splice(k,1);else{if(ch.opt.n===1)ch.sel=[c];else if(ch.sel.length<ch.opt.n)ch.sel.push(c)}drawChoose()}
function chooseDone(cancel){const ch=UI.ch;UI.ch=null;UI.modal=null;renderModal();ch.res(cancel?[]:ch.sel)}

/* ================= 保存 ================= */
function save(){if(!S||S.screen==='over'||S.screen==='victory')return;if(S.screen==='combat'&&(!C||C.phase!=='player'||UI.busy))return;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function loadMeta(){try{return Object.assign({runs:0,wins:{},best:0},JSON.parse(localStorage.getItem(META)||'{}'))}catch(e){return {runs:0,wins:{},best:0}}}
function saveMeta(m){try{localStorage.setItem(META,JSON.stringify(m))}catch(e){}}
window.addEventListener('resize',()=>{if(inC())layoutHand()});
render();
</script>
</body></html>
