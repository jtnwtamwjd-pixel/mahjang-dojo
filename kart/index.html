<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d0f1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>ポケットカート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen race canvas; menus float as panels over a blurred attract-mode race. Single arcade look (dark). */
:root{
  --ink:#0d0f1a; --panel:rgba(16,18,34,.86); --line:rgba(255,255,255,.14);
  --text:#f5f3ff; --muted:#b9b6d3; --hot:#ff3d5a; --sun:#ffd23f; --go:#2fe0a0; --sky:#3fb7ff;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden}
#bg,#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- menus ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 120%,rgba(255,61,90,.25),transparent 60%),rgba(8,9,20,.55);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto;touch-action:pan-y}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:18px clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-family:var(--display);font-size:clamp(34px,7vw,64px);line-height:1;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 0 45%,var(--sun) 46% 70%,#ff8a1f 71%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 var(--hot)) drop-shadow(0 6px 10px rgba(0,0,0,.5));transform:skewX(-8deg);text-wrap:balance}
.tag{color:var(--muted);margin:0;font-size:14px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,28px);margin:0;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.lbl{font-size:12px;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:4px}
input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#codeIn{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.btn{font-size:17px;font-weight:800;padding:13px 18px;border-radius:12px;border:0;color:#1a1020;background:var(--sun);
  box-shadow:0 4px 0 #b88a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.btn.red{background:var(--hot);color:#fff;box-shadow:0 4px 0 #a3132c}
.btn.blue{background:var(--sky);color:#06223a;box-shadow:0 4px 0 #1270a8}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:8px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.course{border:2px solid var(--line);border-radius:14px;padding:8px;background:rgba(255,255,255,.04);color:var(--text);text-align:left;display:flex;flex-direction:column;gap:4px}
.course canvas{width:100%;aspect-ratio:1.6;border-radius:8px;display:block;max-width:100%}
.course b{font-size:15px}.course small{color:var(--muted);font-size:12px}
.course[aria-pressed=true]{border-color:var(--sun);background:rgba(255,210,63,.12)}
.course:disabled{opacity:1;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--text);border:0;padding:8px 14px;font-weight:800;font-size:15px}
.seg button[aria-pressed=true]{background:var(--sun);color:#1a1020}
.code{font-family:var(--display);font-size:clamp(36px,8vw,56px);letter-spacing:.18em;color:var(--sun);line-height:1}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.err{color:#ff8fa0;font-size:14px;margin:0;min-height:1em}
.howto{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;color:var(--muted);margin:0}
.howto dt{color:var(--text);font-weight:800}
.howto dd{margin:0}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-start}
#place{font-family:var(--display);font-size:clamp(40px,9vh,72px);line-height:.9;color:#fff;-webkit-text-stroke:2px #1a1020;text-shadow:0 4px 0 var(--hot);font-variant-numeric:tabular-nums}
#place small{font-size:.45em}
.lapbox{display:flex;flex-direction:column;gap:2px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.6);padding-top:4px}
#lap{font-family:var(--display);font-size:20px}
#time{font-size:15px;font-variant-numeric:tabular-nums}
#itemSlot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:14px;
  background:rgba(10,10,25,.6);border:3px solid rgba(255,255,255,.8);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
#itemSlot canvas{width:100%;height:100%}
#mini{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(10px,env(safe-area-inset-right,0px));width:min(22vh,150px);height:min(22vh,150px)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-size:clamp(48px,14vh,120px);color:var(--sun);
  -webkit-text-stroke:3px #1a1020;text-shadow:0 6px 0 var(--hot);transform:skewX(-8deg)}
#subBanner{position:absolute;left:0;right:0;top:20%;text-align:center;font-family:var(--display);font-size:clamp(22px,6vh,40px);color:#fff;-webkit-text-stroke:2px #1a1020}
#topBtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(max(10px,env(safe-area-inset-right,0px)) + min(22vh,150px) + 10px);display:flex;gap:6px;pointer-events:auto}
.mini-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(10,10,25,.55);color:#fff;font-size:16px;font-weight:800}

#controls{position:absolute;inset:0;pointer-events:none}
#pad{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(44vw,300px);height:min(30vh,150px);display:flex;gap:10px;pointer-events:auto;touch-action:none}
.pbtn{flex:1;border-radius:22px;border:3px solid rgba(255,255,255,.55);background:rgba(10,10,25,.38);color:#fff;font-size:34px;
  display:flex;align-items:center;justify-content:center;transition:background .05s}
.pbtn.on{background:rgba(255,210,63,.55);border-color:var(--sun)}
#rbtns{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;pointer-events:auto;align-items:end}
.rbtn{width:min(19vh,96px);height:min(19vh,96px);border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(10,10,25,.38);color:#fff;
  font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;touch-action:none}
.rbtn.on{background:rgba(255,210,63,.55);border-color:var(--sun)}
#bItem{grid-column:2;grid-row:1;background:rgba(255,61,90,.45)}
#bDrift{grid-column:2;grid-row:2;width:min(24vh,118px);height:min(24vh,118px);background:rgba(63,183,255,.4);font-size:16px}
#bBrake{grid-column:1;grid-row:2;width:min(13vh,66px);height:min(13vh,66px);font-size:12px}
#wrong{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--display);font-size:clamp(28px,8vh,56px);color:#ff5b6e;-webkit-text-stroke:2px #1a1020}
#rotHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 45%);transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:44px 14px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800;font-variant-numeric:tabular-nums}
.res.me{background:rgba(255,210,63,.18);outline:1px solid var(--sun)}
.res .p{font-family:var(--display);font-size:20px}
.res i{width:14px;height:14px;border-radius:50%}
/* garage */
.mykart{display:flex;flex-direction:column;align-items:stretch;gap:2px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at 50% 80%,rgba(255,210,63,.18),rgba(255,255,255,.03) 70%);color:var(--text);padding:6px 10px 10px;text-align:left}
.mykart canvas{width:100%;aspect-ratio:300/170;max-width:100%;display:block}
.mykart b{font-size:15px}.mykart small{color:var(--muted);font-size:12px;display:block}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
@media (max-width:640px){.gwrap{grid-template-columns:minmax(0,1fr)}}
.gprev{display:flex;flex-direction:column;gap:8px;min-width:0}
.gprev canvas{width:100%;aspect-ratio:520/320;max-width:100%;border-radius:12px;background:radial-gradient(ellipse at 50% 85%,rgba(255,210,63,.25),rgba(63,183,255,.08) 60%,transparent 75%)}
.gname b{font-family:var(--display);font-weight:400;font-size:18px;display:block}.gname small{color:var(--muted);font-size:13px}
.gpick{display:flex;flex-direction:column;gap:10px;min-width:0}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:700px){.picks{grid-template-columns:repeat(6,minmax(0,1fr))}}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);padding:4px 2px 6px;font-weight:800;font-size:11px;line-height:1.2;text-align:center;min-width:0}
.pick canvas{width:100%;max-width:84px;aspect-ratio:auto;display:block}
.pick[aria-pressed=true]{border-color:var(--sun);background:rgba(255,210,63,.14)}
.stats{display:grid;gap:5px}
.stat{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:8px;font-size:13px;font-weight:800}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bar i{height:10px;border-radius:3px;background:rgba(255,255,255,.12)}
.bar i.on{background:linear-gradient(90deg,var(--sun),#ff8a1f)}
.chip small{color:var(--muted);font-size:11px;margin-left:2px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (max-height:520px){
  .panel{padding:10px 16px;gap:8px;border-radius:14px}
  .logo{font-size:30px}.tag{font-size:12px}
  .card{padding:8px;gap:6px}
  .btn{padding:9px 14px;font-size:15px}
  input[type=text]{padding:7px 10px;font-size:16px}
  .sw{width:28px;height:28px}
  .howto{font-size:11.5px;gap:2px 8px}
  .course{padding:6px}.course canvas{aspect-ratio:2.2}
  .mykart canvas{width:auto;height:min(30vh,120px);align-self:center}
  .gprev canvas{width:auto;height:min(42vh,190px);align-self:center}
  .pick canvas{max-width:60px}
  .stat{font-size:12px}.bar i{height:8px}
}
</style>
</head><body>

<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>

  <div id="hud" hidden>
    <div class="hudTop">
      <div id="place">1<small>位</small></div>
      <div class="lapbox"><span id="lap">LAP 1/3</span><span id="time">0:00.00</span></div>
    </div>
    <div id="itemSlot"><canvas id="itemCv" width="128" height="128"></canvas></div>
    <canvas id="mini" width="300" height="300"></canvas>
    <div id="topBtns"><button class="mini-btn" id="bSound" aria-label="音のオンオフ">♪</button><button class="mini-btn" id="bQuit" aria-label="レースをやめる">✕</button></div>
    <div id="subBanner" hidden></div>
    <div id="banner" hidden></div>
    <div id="wrong" hidden>ぎゃくそう！</div>
    <div id="controls">
      <div id="pad"><div class="pbtn" id="pL">◀</div><div class="pbtn" id="pR">▶</div></div>
      <div id="rbtns">
        <div class="rbtn" id="bItem">アイテム</div>
        <div class="rbtn" id="bBrake">ブレーキ</div>
        <div class="rbtn" id="bDrift">ドリフト</div>
      </div>
    </div>
    <div id="rotHint" hidden>📱 横向きにすると遊びやすいよ</div>
  </div>

  <!-- title -->
  <div class="screen" id="sTitle">
    <div class="panel">
      <div>
        <h1 class="logo">ポケットカート</h1>
        <p class="tag">スマホ1台でレース。部屋コードで友だちと対戦できます。</p>
      </div>
      <div class="grid2">
        <div class="card">
          <div><label class="lbl" for="nameIn">なまえ</label><input type="text" id="nameIn" maxlength="8" value="プレイヤー"></div>
          <button class="mykart" id="bGarage"><canvas id="myCv" width="300" height="170"></canvas><span><b id="myDesc"></b><small>タップしてキャラ・カート・色を変える</small></span></button>
        </div>
        <div class="card">
          <button class="btn wide" id="bSolo">ひとりで走る（CPUと対戦）</button>
          <button class="btn red wide" id="bHost">部屋をつくる</button>
          <div class="row" style="flex-wrap:nowrap">
            <input type="text" id="codeIn" maxlength="4" placeholder="コード" aria-label="部屋コード" autocomplete="off" autocapitalize="characters">
            <button class="btn blue" id="bJoin" style="white-space:nowrap">部屋に入る</button>
          </div>
          <p class="err" id="titleErr"></p>
        </div>
      </div>
      <dl class="howto">
        <dt>◀ ▶</dt><dd>ハンドル（アクセルは自動）</dd>
        <dt>ドリフト</dt><dd>曲がりながら長押し。火花が青→オレンジになって離すとダッシュ</dd>
        <dt>アイテム</dt><dd>？ボックスで拾って使う（キノコ・バナナ・こうら・スター）</dd>
      </dl>
    </div>
  </div>

  <!-- lobby / course select -->
  <div class="screen" id="sLobby" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2 id="lobbyTitle">コースをえらぶ</h2>
        <div class="row"><button class="btn ghost" id="bGarage2">キャラ・カート</button><button class="btn ghost" id="bBack">もどる</button></div>
      </div>
      <div class="card" id="roomCard" hidden>
        <div class="row" style="justify-content:space-between;align-items:flex-end">
          <div><span class="lbl">部屋コード</span><div class="code" id="roomCode">----</div></div>
          <p class="note" id="roomNote">友だちは「部屋に入る」にこのコードを入力</p>
        </div>
        <div class="players" id="players"></div>
      </div>
      <div class="courses" id="courses"></div>
      <div class="row" id="opts">
        <span class="lbl" style="margin:0">周回</span>
        <div class="seg" id="lapSeg"><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div>
        <span class="lbl" style="margin:0 0 0 8px">CPU</span>
        <div class="seg" id="cpuSeg"><button data-v="0">なし</button><button data-v="1">あり</button></div>
      </div>
      <button class="btn red wide" id="bStart">スタート！</button>
      <p class="note" id="waitNote" hidden>ホストがスタートするのを待っています…</p>
      <p class="err" id="lobbyErr"></p>
    </div>
  </div>

  <!-- garage -->
  <div class="screen" id="sGarage" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>キャラとカート</h2><button class="btn" id="bGarageOk">けってい</button></div>
      <div class="gwrap">
        <div class="gprev"><canvas id="prevCv" width="520" height="320"></canvas><div class="gname" id="gName"></div><div class="stats" id="stats"></div></div>
        <div class="gpick">
          <div><span class="lbl">キャラ</span><div class="picks" id="charPick"></div></div>
          <div><span class="lbl">カート</span><div class="picks" id="kartPick"></div></div>
          <div><span class="lbl">カートの色</span><div class="swatches" id="swatches"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- results -->
  <div class="screen" id="sResults" hidden>
    <div class="panel">
      <h2 id="resTitle">けっか</h2>
      <div class="results" id="resList"></div>
      <div class="row">
        <button class="btn red" id="bAgain">もう一度</button>
        <button class="btn ghost" id="bMenu">コース選択へ</button>
      </div>
      <p class="note" id="resNote"></p>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const store={get(k,d){try{const v=localStorage.getItem('pkart.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('pkart.'+k,JSON.stringify(v));}catch(e){}}};
const fmtTime=t=>{if(t==null||!isFinite(t))return'--:--.--';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);};

const COLORS=['#e63946','#2a9df4','#2ec27e','#f6c90e','#9b5de5','#ff7f11','#ff5d8f','#eeeeee'];
const CPU_NAMES=['ハヤテ','モモ','ゴロー','ミント','ジャック','サクラ','トビオ'];
const WORLD=2048;

/* ================= courses ================= */
const THEMES={
  green:{ground:'#4fa64a',ground2:'#5ab554',runoff:'#dcc78e',curbA:'#e8333f',curbB:'#ffffff',road:'#6c6f78',line:'rgba(255,255,255,.85)',
    skyT:'#3d9df2',skyB:'#cfeaff',fog:'#cfeaff',voidC:'#3f8f3c',mtn:['#7fae8c','#5d8f6c'],deco:['tree','tree','bush'],noise:.10,style:'mow'},

function buildTrack(c){
  const P=c.pts,n=P.length,raw=[];
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<24;k++){const t=k/24,t2=t*t,t3=t2*t;const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      raw.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}}
  const cum=[0];let L=0;
  for(let i=1;i<=raw.length;i++){const a=raw[i-1],b=raw[i%raw.length];L+=Math.hypot(b[0]-a[0],b[1]-a[1]);cum.push(L);}
  const N=Math.floor(L/6),xs=new Float32Array(N),ys=new Float32Array(N),tx=new Float32Array(N),ty=new Float32Array(N);
  let j=0;
  for(let i=0;i<N;i++){const d=i*L/N;while(cum[j+1]<d)j++;const a=raw[j],b=raw[(j+1)%raw.length],u=(d-cum[j])/((cum[j+1]-cum[j])||1);
    xs[i]=a[0]+(b[0]-a[0])*u;ys[i]=a[1]+(b[1]-a[1])*u;}
  for(let i=0;i<N;i++){const a=(i+1)%N,b=(i-1+N)%N;let dx=xs[a]-xs[b],dy=ys[a]-ys[b];const l=Math.hypot(dx,dy)||1;tx[i]=dx/l;ty[i]=dy/l;}
  return {N,L,xs,ys,tx,ty,hw:c.hw};
}
// nearest centerline sample; hint narrows search
function nearest(T,x,y,hint){
  let best=-1,bd=1e18;
  if(hint!=null&&hint>=0){for(let o=-30;o<=30;o++){const i=(hint+o+T.N)%T.N,dx=x-T.xs[i],dy=y-T.ys[i],d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}}
  if(best<0||bd>(T.hw*3)*(T.hw*3)){for(let i=0;i<T.N;i+=2){const dx=x-T.xs[i],dy=y-T.ys[i],d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}}
  const i=best,dx=x-T.xs[i],dy=y-T.ys[i];
  const lat=dx*(-T.ty[i])+dy*T.tx[i];
  return {i,d:Math.sqrt(bd),lat};
}

/* ---------- track texture ---------- */
function trackPath(g,T){g.beginPath();g.moveTo(T.xs[0],T.ys[0]);for(let i=1;i<T.N;i++)g.lineTo(T.xs[i],T.ys[i]);g.closePath();}
function blobs(g,R,col,n,rmin,rmax,alpha){g.fillStyle=col;for(let i=0;i<n;i++){g.globalAlpha=alpha[0]+R()*(alpha[1]-alpha[0]);g.beginPath();
  g.ellipse(R()*WORLD,R()*WORLD,rmin+R()*(rmax-rmin),(rmin+R()*(rmax-rmin))*.6,R()*3,0,TAU);g.fill();}g.globalAlpha=1;}
function renderTex(c,T){
  const th=THEMES[c.theme],cv=document.createElement('canvas');cv.width=cv.height=WORLD;
  const g=cv.getContext('2d'),R=rng(c.name.length*97+c.pts.length*13+7);
  g.fillStyle=th.ground;g.fillRect(0,0,WORLD,WORLD);
  g.lineJoin='round';g.lineCap='round';
  const hw=c.hw,st=th.style;
  if(st==='mow'){
    g.save();g.translate(WORLD/2,WORLD/2);g.rotate(.6);g.fillStyle=th.ground2;
    for(let x=-1600;x<1600;x+=90)g.fillRect(x,-1600,45,3200);g.restore();
  } else if(st==='space'){
    for(let i=0;i<2600;i++){const r=R();g.fillStyle=`rgba(255,255,255,${.2+R()*.8})`;const s=r<.95?1.5:3;g.fillRect(R()*WORLD,R()*WORLD,s,s);}
    for(let i=0;i<14;i++){const x=R()*WORLD,y=R()*WORLD,r=60+R()*160,gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,`hsla(${R()*360},80%,60%,.18)`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  } else if(st==='island'){

function drawModel(g,M,pal,X,Y,Z,ang,cam,sc=1){
  const c=Math.cos(ang)*sc,s=Math.sin(ang)*sc,cc=Math.cos(cam.a),cs=Math.sin(cam.a),out=[];
  for(const F of M){
    const nx=(F.n[0]*c-F.n[1]*s)/sc,ny=(F.n[0]*s+F.n[1]*c)/sc,nz=F.n[2];
    const wx=X+F.c[0]*c-F.c[1]*s,wy=Y+F.c[0]*s+F.c[1]*c,wz=Z+F.c[2]*sc;
    if(nx*(wx-cam.x)+ny*(wy-cam.y)+nz*(wz-cam.h)>=0)continue;
    const pts=[];let depth=0,bad=false;
    for(const v of F.p){const dx=X+v[0]*c-v[1]*s-cam.x,dy=Y+v[0]*s+v[1]*c-cam.y,f=dx*cc+dy*cs;if(f<.5){bad=true;break;}
      pts.push(cam.cx+(-dx*cs+dy*cc)*cam.foc/f,cam.hor+(cam.h-Z-v[2]*sc)*cam.foc/f);depth+=f;}
    if(bad)continue;
    const lv=Math.round(10*Math.max(0,nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2]));
    out.push([depth/F.p.length,pts,shadeCol(pal[F.k],lv)]);}

}

void main(){vec2 d=p.xy-uCam;float f=dot(d,uDir);float s=-d.x*uDir.y+d.y*uDir.x;float u=p.z-uCamZ;vW=p.xy;vF=f;vS=p.w;
 gl_Position=vec4(s*uFoc/uHalf.x,uHorN*f+u*uFoc/uHalf.y,f*1.0002-2.0002,f);}`;
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;uniform float uWorld,uFogN,uFogF,uNoise;uniform vec3 uVoid,uFog;varying vec2 vW;varying float vF,vS;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 uv=vW/uWorld;vec3 c;
 if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.)c=uVoid;else c=texture2D(uTex,uv).rgb;

function initGL(){

const hex3=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};

/* ---------- height field ---------- */
const HM_N=257,HM_S=WORLD/(HM_N-1);
function groundH(x,y){const H=G.HM;if(!H)return 0;
  const fx=clamp(x/HM_S,0,HM_N-1.001),fy=clamp(y/HM_S,0,HM_N-1.001),ix=fx|0,iy=fy|0,ux=fx-ix,uy=fy-iy,i=iy*HM_N+ix;
  return (H[i]*(1-ux)+H[i+1]*ux)*(1-uy)+(H[i+HM_N]*(1-ux)+H[i+HM_N+1]*ux)*uy;}
// elevation along the centerline from keypoints + ramps
function trackElev(c,T){
  const E=new Float32Array(T.N);if(!c.elev&&!c.ramps)return E;
  const K0=(c.elev||[[0,0]]).slice().sort((a,b)=>a[0]-b[0]),K=[[K0[K0.length-1][0]-1,K0[K0.length-1][1]],...K0,[K0[0][0]+1,K0[0][1]]];
  for(let i=0,j=0;i<T.N;i++){const t=i/T.N;while(K[j+1][0]<=t)j++;const a=K[j],b=K[j+1],u=clamp((t-a[0])/((b[0]-a[0])||1),0,1),s=u*u*(3-2*u);E[i]=a[1]+(b[1]-a[1])*s;}
  for(const r of c.ramps||[]){const end=Math.floor(r.t*T.N),n=Math.max(2,Math.round(r.len/(T.L/T.N)));
    for(let q=0;q<n;q++){const i=(end-n+1+q+T.N)%T.N;E[i]+=r.h*(q+1)/n;}}
  return E;
}
function buildHeights(c,T){
  if(!c.elev&&!c.ramps&&!c.hills)return null;
  const E=trackElev(c,T),H=new Float32Array(HM_N*HM_N),R=rng(c.pts.length*31+7),bumps=[];
  for(let i=0;i<40&&c.hills;i++)bumps.push([R()*WORLD,R()*WORLD,120+R()*260,(R()*.7+.3)*c.hills]);
  for(let gy=0;gy<HM_N;gy++)for(let gx=0;gx<HM_N;gx++){const x=gx*HM_S,y=gy*HM_S;const n=nearest(T,x,y,null);
    let bgv=0;for(const [bx,by,br,bh] of bumps){const d2=((x-bx)**2+(y-by)**2)/(br*br);if(d2<4)bgv+=bh*Math.exp(-d2*2);}
    const w=clamp(1-(n.d-(c.hw+16))/110,0,1),ws=w*w*(3-2*w);
    H[gy*HM_N+gx]=E[n.i]*ws+(E[n.i]*.6+bgv)*(1-ws);}
  // keep the world border at ground level
  for(let i=0;i<HM_N;i++)for(const j of[0,HM_N-1]){H[i*HM_N+j]=0;H[j*HM_N+i]=0;}
  return H;
}
function buildMesh(){
  const cs=[-9000,-5000,-2500,-1200,-500,-160];for(let x=0;x<=WORLD;x+=16)cs.push(x);cs.push(WORLD+160,WORLD+500,WORLD+1200,WORLD+2500,WORLD+5000,WORLD+9000);
  const n=cs.length,V=new Float32Array(n*n*4),L=LIGHT;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=cs[i],y=cs[j],k=(j*n+i)*4,inW=x>=0&&x<=WORLD&&y>=0&&y<=WORLD;
    const h=inW?groundH(x,y):0;let sh=1;
    if(inW&&G.HM){const gx=(groundH(x+6,y)-groundH(x-6,y))/12,gy=(groundH(x,y+6)-groundH(x,y-6))/12,l=Math.hypot(gx,gy,1);
      sh=clamp(((-gx)*L[0]+(-gy)*L[1]+L[2])/l/L[2],.55,1.3);}
    V[k]=x;V[k+1]=y;V[k+2]=h;V[k+3]=sh;}
  const I=new Uint16Array((n-1)*(n-1)*6);let q=0;
  for(let j=0;j<n-1;j++)for(let i=0;i<n-1;i++){const a=j*n+i,b=a+1,c=a+n,d=c+1;I[q++]=a;I[q++]=b;I[q++]=d;I[q++]=a;I[q++]=d;I[q++]=c;}
  gl.bindBuffer(gl.ARRAY_BUFFER,MESH.vb);gl.bufferData(gl.ARRAY_BUFFER,V,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,MESH.ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,I,gl.STATIC_DRAW);MESH.n=I.length;
}

    const kk=kinds[Math.floor(R()*kinds.length)],mind=c.hw+(kk.startsWith('bldg')?90:kk==='cloud'?60:32);if(n.d>mind&&n.d<c.hw+300)G.deco.push({x,y,k:kk,s:.8+R()*.5});}}
  G.boxes=[];for(const f of c.boxes){const i=Math.floor(f*T.N);for(const o of[-.6,-.2,.2,.6])G.boxes.push({x:T.xs[i]-T.ty[i]*o*c.hw,y:T.ys[i]+T.tx[i]*o*c.hw,t:0});}

  el.addEventListener('contextmenu',e=>e.preventDefault());}

(function(){const pad=$('#pad'),pl=$('#pL'),pr=$('#pR'),act=new Map();
  const upd=()=>{input.l=input.r=false;if(act.size){const x=[...act.values()].pop(),b=pad.getBoundingClientRect();if(x<b.left+b.width/2)input.l=true;else input.r=true;}

function audioInit(){if(AC||!settings.sound)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),gn=AC.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=600;gn.gain.value=0;

function beep(fr,dur,type='square',vol=.08,slide=0){if(!AC||!settings.sound)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,fr+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}

/* ================= simulation ================= */
const MAXSP=150,GRAV=380;
// item odds shift from defensive (front) to catch-up items (back)
const ITEM_W={banana:[4,1],oil:[2,.5],fake:[2,.5],shell:[3,3],bomb:[1,2],mush:[1,3],tri:[0,3],star:[0,2.5],thunder:[0,1.2]};
function itemFor(place,n){const r=n>1?(place-1)/(n-1):0;let s=0;const w={};
  for(const k in ITEM_W){let v=lerp(ITEM_W[k][0],ITEM_W[k][1],r);if((k==='star'&&r<.35)||(k==='thunder'&&r<.6))v=0;w[k]=v;s+=v;}
  let x=Math.random()*s;for(const k in w){x-=w[k];if(x<=0)return k;}return 'mush';}

function useItem(k){
  if(!k.item||k.roll>0)return;const it=k.item,dx=Math.cos(k.a),dy=Math.sin(k.a);
  if(it==='tri'){k.itemN=(k.itemN||3)-1;if(k.itemN<=0){k.item=null;k.itemN=0;}}else k.item=null;
  if(it==='mush'||it==='tri'){k.boost=Math.max(k.boost,1.3);k.boostKind=2;if(k===G.me)beep(300,.4,'sawtooth',.06,500);}
  else if(it==='star'){k.star=6;if(k===G.me)beep(700,.6,'triangle',.08,400);}
  else if(it==='banana'||it==='oil'||it==='fake'){spawnObj({kind:it,x:k.x-dx*12,y:k.y-dy*12,a:k.a,owner:k.id});}
  else if(it==='shell'){const o=nearest(G.T,k.x,k.y,k.idx);spawnObj({kind:'shell',x:k.x+dx*12,y:k.y+dy*12,a:k.a,owner:k.id,idx:o.i,target:targetAhead(k)});if(k===G.me)beep(500,.15,'square',.06,-200);}
  else if(it==='bomb'){spawnObj({kind:'bomb',x:k.x+dx*12,y:k.y+dy*12,a:k.a,owner:k.id});if(k===G.me)beep(260,.2,'square',.06,-80);}
  else if(it==='thunder'){applyThunder(k.id);netEvent({e:'thunder',by:k.id});}
}
function applyThunder(by){
  G.flash=.35;beep(90,.6,'sawtooth',.1,-40);
  for(const k of G.karts){if(k.id===by||k.remote||k.fin!=null)continue;if(k.star>0)continue;
    k.shrink=4;k.sp*=.5;k.drift=0;k.charge=0;if(k.item&&k.roll<=0&&Math.random()<.5){k.item=null;k.itemN=0;}spinOut(k,true);}
}
function targetAhead(k){let best=null,bp=1e9;for(const o of G.karts){if(o===k||o.fin!=null)continue;if(o.place<k.place&&k.place-o.place<bp){bp=k.place-o.place;best=o;}}return best?best.id:null;}
function spawnObj(o,remote){o.id=o.id||(NET.myId||'L')+'-'+(++G.objSeq);o.born=remote&&o.age!=null?G.raceT-o.age:G.raceT;
  o.life=o.kind==='shell'?6:o.kind==='bomb'?9:9999;o.sp=o.kind==='shell'?265:o.kind==='bomb'?190:0;G.objs.push(o);
  if(!remote)netEvent({e:'obj',o:{id:o.id,kind:o.kind,x:o.x,y:o.y,a:o.a,owner:o.owner,idx:o.idx,target:o.target}});}
function removeObj(id,remote){const i=G.objs.findIndex(o=>o.id===id);if(i>=0)G.objs.splice(i,1);if(!remote)netEvent({e:'rm',id});}
function spinOut(k,force){if(k.star>0||(k.spin>0&&!force))return;k.spin=1.3;k.sp*=.35;k.drift=0;k.charge=0;k.boost=0;if(k===G.me){beep(200,.5,'sawtooth',.08,-150);navigator.vibrate&&navigator.vibrate(120);}}
const OBJ_R={banana:7.5,oil:10,fake:8,shell:7.5,bomb:0};

function stepKart(k,dt,inp){
  const T=G.T,c=G.C,racing=G.mode==='race'||G.mode==='attract';
  if(k.fall>0){k.fall-=dt;if(k.fall<=0){const i=k.lastSafe;k.x=T.xs[i];k.y=T.ys[i];k.a=k.ma=Math.atan2(T.ty[i],T.tx[i]);k.sp=0;k.idx=i;k.spin=0;k.z=groundH(k.x,k.y);k.vz=0;k.air=false;}return;}
  if(!racing){inp={steer:0,drift:false,brake:true};}
  const near=nearest(T,k.x,k.y,k.idx);
  const off=near.d>c.hw+(c.fall?4:6);
  if(c.fall&&near.d>c.hw+6&&k.hop<=0&&!k.air){k.fall=1.2;k.sp=0;k.drift=0;k.charge=0;if(k===G.me)beep(400,.9,'triangle',.07,-350);return;}
  if(!off&&near.d<c.hw-4)k.lastSafe=near.i;
  // lap counting
  const prev=k.idx,ni=near.i,N=T.N;
  if(prev>N*.75&&ni<N*.25){k.lap++;if(k.lap>G.laps&&k.fin==null){k.fin=G.raceT;onFinish(k);}else if(k===G.me&&k.lap>1){beep(880,.15);beep(1320,.3,'square',.06);showSub(k.lap===G.laps?'ファイナルラップ！':'LAP '+k.lap);}}
  else if(prev<N*.25&&ni>N*.75)k.lap--;
  k.idx=ni;
  // timers
  k.boost=Math.max(0,k.boost-dt);k.star=Math.max(0,k.star-dt);k.hop=Math.max(0,k.hop-dt);k.shrink=Math.max(0,(k.shrink||0)-dt);
  let maxSp=MAXSP*k.spMul*k.sf;
  if(off&&!k.air&&k.boost<=0&&k.star<=0)maxSp*=k.offF;
  for(const o of G.obst)if(o.k==='mud'&&k.boost<=0&&k.star<=0&&(k.x-o.x)**2+(k.y-o.y)**2<o.r*o.r)maxSp*=.5;
  if(k.shrink>0)maxSp*=.72;

}

function cpuInput(k,dt){
  const T=G.T,c=G.C;k.laneT-=dt;if(k.laneT<=0){k.laneT=1.5+Math.random()*2.5;k.lane=(Math.random()*2-1)*.45;}

  let tx=T.xs[i]-T.ty[i]*k.lane*c.hw,ty=T.ys[i]+T.tx[i]*k.lane*c.hw;
  // steer around hazards ahead
  const ca=Math.cos(k.a),sa=Math.sin(k.a),avoid=(ox,oy,r)=>{const dx=ox-k.x,dy=oy-k.y,d=Math.hypot(dx,dy);if(d>80||d<3)return;
    const fwd=(dx*ca+dy*sa),side=-dx*sa+dy*ca;if(fwd<0||Math.abs(side)>r+8)return;const push=(side>0?-1:1)*(r+12);tx+=-sa*push;ty+=ca*push;};
  for(const o of G.objs)if(o.kind!=='shell'&&o.kind!=='bomb')avoid(o.x,o.y,6);
  for(const o of G.obst)if(o.k!=='mushroom')avoid(o.x,o.y,o.r);
  const want=Math.atan2(ty-k.y,tx-k.x),d=angDiff(want,k.a);

  const humans=G.karts.filter(o=>!o.cpu);let bestHuman=Math.min(...humans.map(o=>o.place));
  const base=k.cpuBase||(k.cpuBase=k.spMul);
  k.spMul=k.place<bestHuman?base*.95:(k.place>bestHuman+2?base*1.07:base);

    if((k.item!=='shell'&&k.item!=='bomb')||targetAhead(k)){useItem(k);k.itemT=0;}}}

function explode(o){

}
function stepObjs(dt){
  const T=G.T;
  for(const o of G.objs.slice()){
    const age=G.raceT-o.born;
    if(o.kind==='shell'){o.life-=dt;if(o.life<=0){G.objs.splice(G.objs.indexOf(o),1);continue;}
      const n=nearest(T,o.x,o.y,o.idx);o.idx=n.i;let tx=T.xs[(n.i+10)%T.N],ty=T.ys[(n.i+10)%T.N];
      const tk=o.target&&G.karts.find(k=>k.id===o.target);if(tk&&Math.hypot(tk.x-o.x,tk.y-o.y)<140){tx=tk.x;ty=tk.y;}
      const want=Math.atan2(ty-o.y,tx-o.x);o.a+=clamp(angDiff(want,o.a),-4*dt,4*dt);o.x+=Math.cos(o.a)*o.sp*dt;o.y+=Math.sin(o.a)*o.sp*dt;
      if(G.C.fall&&n.d>G.C.hw+20){G.objs.splice(G.objs.indexOf(o),1);continue;}
      if(G.obst.some(b=>b.k!=='mud'&&b.k!=='mushroom'&&(b.x-o.x)**2+(b.y-o.y)**2<(b.r+3)**2)){G.objs.splice(G.objs.indexOf(o),1);continue;}}
    else if(o.kind==='bomb'){const v=Math.max(0,o.sp*(1-age/.8));o.x+=Math.cos(o.a)*v*dt;o.y+=Math.sin(o.a)*v*dt;
      if(age>=1.6){G.objs.splice(G.objs.indexOf(o),1);explode(o);}continue;}
    // hits: only karts this client owns decide
    for(const k of G.karts){if(k.remote||k.fall>0)continue;if(o.owner===k.id&&age<.9)continue;
      const r=OBJ_R[o.kind]||7.5;if((k.x-o.x)**2+(k.y-o.y)**2<r*r&&k.z-groundH(o.x,o.y)<8){if(k.star<=0)spinOut(k);removeObj(o.id);break;}}
  }
  for(const b of G.boxes)if(b.t>0)b.t-=dt;
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<.7);
  // star bumps & kart-kart push
  const ks=G.karts;
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=ks[i],b=ks[j];if(a.fall>0||b.fall>0||Math.abs(a.z-b.z)>8)continue;

}
// moving obstacles follow the race clock so every phone sees them in the same place
function stepObst(){const t=G.mode==='race'?G.raceT:G.clock;

/* ================= remote karts ================= */
function stepRemote(k,dt){
  // extrapolate target then ease toward it
  k.tx+=Math.cos(k.ta)*k.sp*dt;k.ty+=Math.sin(k.ta)*k.sp*dt;
  const f=clamp(dt*10,0,1);k.x=lerp(k.x,k.tx,f);k.y=lerp(k.y,k.ty,f);k.a+=angDiff(k.ta,k.a)*f;
  k.z=k.tz!=null?lerp(k.z,Math.max(k.tz,groundH(k.x,k.y)),f):groundH(k.x,k.y);
  if(k.spin>0)k.spinVis+=dt*16;
}

function drawBox(g,p,o,fake){const s=7*p.sc,y=p.y-s*1.1-Math.sin(G.clock*3+o.x)*s*.08;g.save();g.translate(p.x,y);g.rotate(Math.sin(G.clock*2+o.y)*.25);
  g.fillStyle=fake?`hsl(${(G.clock*120+o.x)%360},70%,52%)`:`hsl(${(G.clock*120+o.x)%360},85%,60%)`;g.globalAlpha=.85;g.beginPath();g.roundRect(-s/2,-s/2,s,s,s*.18);g.fill();g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=Math.max(1,s*.06);g.stroke();g.fillStyle='#fff';g.font=`900 ${s*.7}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(fake?'¿':'?',0,s*.04);g.restore();g.textBaseline='alphabetic';}

function drawWorldSprites(g){
  const list=[];
  for(const d of G.deco){const p=project(d.x,d.y,d.z);if(p&&p.f<1100&&visible(d.x,d.y,d.z+10))list.push([p.f,0,d,p]);}
  for(const b of G.boxes){if(b.t>0)continue;const p=project(b.x,b.y,b.z);if(p&&p.f<900&&visible(b.x,b.y,b.z))list.push([p.f,1,b,p]);}
  for(const o of G.objs){const z=groundH(o.x,o.y),p=project(o.x,o.y,z);if(p&&p.f<900&&visible(o.x,o.y,z))list.push([p.f,2,o,p]);}
  for(const o of G.obst){if(o.k==='mud')continue;const p=project(o.x,o.y,o.z);if(p&&p.f<1000&&visible(o.x,o.y,o.z+o.hgt*.5))list.push([p.f,4,o,p]);}
  for(const k of G.karts){const p=project(k.x,k.y,k.z||0);if(p&&p.f<1200&&(k===G.me||visible(k.x,k.y,(k.z||0)+4)))list.push([p.f,3,k,p]);}
  for(const f of G.fx){const p=project(f.x,f.y,f.z);if(p)list.push([p.f,5,f,p]);}
  list.sort((a,b)=>b[0]-a[0]);
  for(const [f,t,o,p] of list){
    if(t===0){const sp=SPRITES[o.k],h=SPRITE_H[o.k]*o.s*p.sc,w=h*sp.width/sp.height;if(h<1)continue;g.drawImage(sp,p.x-w/2,p.y-h,w,h);}
    else if(t===1)drawBox(g,p,o,false);
    else if(t===2){const s=8*p.sc;
      if(o.kind==='oil'){g.fillStyle='rgba(20,16,30,.85)';g.beginPath();g.ellipse(p.x,p.y,9*p.sc,2.6*p.sc,0,0,TAU);g.fill();g.fillStyle='rgba(140,120,255,.35)';g.beginPath();g.ellipse(p.x-2*p.sc,p.y-.6*p.sc,4*p.sc,1*p.sc,0,0,TAU);g.fill();}
      else if(o.kind==='fake')drawBox(g,p,o,true);
      else{const blink=o.kind==='bomb'&&G.raceT-o.born>1.1&&Math.floor(G.clock*12)%2;drawIcon(g,o.kind,p.x,p.y-s*.45,s);if(blink){g.fillStyle='rgba(255,60,60,.6)';g.beginPath();g.arc(p.x,p.y-s*.45,s*.42,0,TAU);g.fill();}}}
    else if(t===4){const ang=o.k==='boulder'?o.rot:o.k==='mushroom'?0:o.ang||0;drawModel(g,obstMesh(o.k),OBST_PAL,o.x,o.y,o.z,ang,G.cam,o.k==='mushroom'?1+Math.sin(G.clock*4+o.x)*.03:1);}
    else if(t===5){const r=(10+o.t*60)*p.sc,a=1-o.t/.7;g.fillStyle=`rgba(255,${150+Math.round(o.t*100)},40,${a*.8})`;g.beginPath();g.arc(p.x,p.y-r*.3,r,0,TAU);g.fill();
      g.fillStyle=`rgba(255,255,220,${a})`;g.beginPath();g.arc(p.x,p.y-r*.3,r*.45,0,TAU);g.fill();}
    else drawKart(g,o,p,G.cam);
  }
}

function drawMini(){

let bannerT=0,subT=0;

/* ================= main loop ================= */
let lastT=performance.now();G.clock=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=clamp((now-lastT)/1000,0,.05);lastT=now;G.clock+=dt;
  if(!G.T)return;
  G.hor=VH*.36;
  if(G.mode==='countdown'){G.countT-=dt;const n=Math.ceil(G.countT);
    if(n!==G.lastCount){G.lastCount=n;if(n>0){showBanner(String(n),1);beep(440,.18,'square',.07);}}
    if(G.countT<=0){G.mode='race';G.raceT=0;showBanner('GO!',1);beep(880,.4,'square',.08);}}
  if(G.mode==='race'||G.mode==='countdown'||G.mode==='attract'){
    if(G.mode==='race')G.raceT+=dt;
    for(const k of G.karts){
      if(k.remote){stepRemote(k,dt);continue;}
      let inp=(k.cpu||G.mode==='attract')?cpuInput(k,dt):readInput();
      if(G.mode==='attract'&&G.attractStart){}
      stepKart(k,dt,G.mode==='attract'?inp:inp);
      if(k===G.me&&!k.cpu&&input.item){useItem(k);}
    }
    input.item=false;
    stepObst();stepObjs(dt);computePlaces();
    if(G.mode!=='attract'){netTick(now);checkRaceEnd();}
  }
  // camera
  const me=G.me||G.karts[0];
  if(me){const tgtA=me.a;G.camA+=angDiff(tgtA,G.camA)*clamp(dt*(me.drift?4:7),0,1);
    G.camX=me.x-Math.cos(G.camA)*CAM.dist;G.camY=me.y-Math.sin(G.camA)*CAM.dist;
    const tz=Math.max((me.z||0)+CAM.h,groundH(G.camX,G.camY)+5);G.camZ=G.camZ==null||Math.abs(G.camZ-tz)>200?tz:clamp(lerp(G.camZ,tz,clamp(dt*(me.air?10:6),0,1)),tz-6,tz+6);}
  // engine sound
  if(eng&&AC){const on=settings.sound&&me&&G.mode!=='menu'&&G.mode!=='attract'&&G.mode!=='results';eng.gn.gain.setTargetAtTime(on?.025:0,AC.currentTime,.05);
    if(me)eng.o.frequency.setTargetAtTime(55+me.sp*.75+(me.boost>0?30:0),AC.currentTime,.05);}
  // draw
  G.cam={x:G.camX,y:G.camY,a:G.camA,h:G.camZ,foc:VH*1.55,hor:G.hor,cx:VW/2};
  const bs=bgc.width/VW;bgx.setTransform(bs,0,0,bs,0,0);drawBackdrop(bgx);
  drawGround();
  ov.setTransform(DPR,0,0,DPR,0,0);ov.clearRect(0,0,VW,VH);
  drawWorldSprites(ov);
  if(G.flash>0){ov.fillStyle=`rgba(255,255,230,${G.flash*1.6})`;ov.fillRect(0,0,VW,VH);G.flash-=dt;}
  if(me&&me.boost>0&&G.mode!=='attract'){ov.strokeStyle='rgba(255,255,255,.35)';ov.lineWidth=2;for(let i=0;i<14;i++){const a=Math.random()*TAU,r1=VH*.35+Math.random()*VH*.2;
    ov.beginPath();ov.moveTo(VW/2+Math.cos(a)*r1,G.hor+Math.sin(a)*r1*.6);ov.lineTo(VW/2+Math.cos(a)*(r1+VH*.3),G.hor+Math.sin(a)*(r1+VH*.3)*.6);ov.stroke();}}
  if(G.mode!=='attract'&&G.mode!=='menu')drawHud();
  if(G.mode==='attract'||G.mode==='menu')drawMenuPreviews();
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('#banner').hidden=true;}
  if(subT>0){subT-=dt;if(subT<=0)$('#subBanner').hidden=true;}
}

  G.karts=COLORS.slice(0,6).map((c,i)=>{const e=cpuEntry(i,c);return mkKart(e.id,e.name,c,true,e.ch,e.kt);});placeGrid();G.me=G.karts[5];G.objs=[];G.mode='attract';

  prepareCourse(ci);G.miniPath=null;G.laps=laps;G.objs=[];G.objSeq=0;lastHud={};
  G.karts=grid.map(p=>{const k=mkKart(p.id,p.name,p.color,!!p.cpu,p.ch,p.kt);k.remote=G.online&&(NET.isHost?(!p.cpu&&p.id!==NET.myId):p.id!==NET.myId);return k;});
  placeGrid();G.me=G.karts.find(k=>k.id===(NET.myId||'me'));G.me.cpu=false;

  showScreen(null);$('#hud').hidden=false;$('#banner').hidden=true;resize();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>G.wake=l).catch(()=>{});}catch(e){}
}

  bcast(m,except){for(const [id,c] of this.conns)if(id!==except&&c.open)try{c.send(m);}catch(e){}},
  sendLobby(){this.bcast({t:'lobby',players:this.players,course:G.selCourse,laps:G.selLaps,cpu:G.selCpu});refreshLobby();},
  startRace(){if(!this.isHost)return;const humans=this.players.slice();for(let i=humans.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[humans[i],humans[j]]=[humans[j],humans[i]];}
    const used=new Set(humans.map(p=>p.color));const cpus=[];if(G.selCpu){let n=Math.max(0,6-humans.length),ci=0;for(const c of COLORS){if(cpus.length>=n)break;if(!used.has(c)){cpus.push(cpuEntry(ci,c));ci++;}}}
    const grid=[...cpus,...humans];this.bcast({t:'start',grid,course:G.selCourse,laps:G.selLaps});beginRace(grid,G.selCourse,G.selLaps);},
  toLobby(){this.bcast({t:'lobby',players:this.players,course:G.selCourse,laps:G.selLaps,cpu:G.selCpu,back:true});G.mode='menu';showScreen('#sLobby');refreshLobby();startAttract();},
};
function loadPeerJS(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>window.Peer?res():rej(new Error('load'));s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
function canRTC(){return !!(window.RTCPeerConnection||window.webkitRTCPeerConnection);}
function netErr(msg){$('#titleErr').textContent=msg;$('#lobbyErr').textContent=msg;}
function mkCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function hostRoom(){
  netErr('');if(!canRTC()){netErr('このページではオンライン対戦が使えません。公開版のURLから開いてください。');return;}
  $('#bHost').disabled=true;$('#bHost').textContent='接続中…';
  try{await loadPeerJS();}catch(e){netErr('通信ライブラリを読み込めませんでした。ネット接続を確認してください。');$('#bHost').disabled=false;$('#bHost').textContent='部屋をつくる';return;}
  const tryOpen=(left)=>{const code=mkCode(),peer=new Peer(PREFIX+code);
    peer.on('open',id=>{NET.peer=peer;NET.isHost=true;NET.code=code;NET.myId=id;G.online=true;
      NET.players=[{id,name:settings.name,color:COLORS[settings.color],ch:settings.ch,kt:settings.kt}];$('#bHost').disabled=false;$('#bHost').textContent='部屋をつくる';showScreen('#sLobby');refreshLobby();});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&left>0){peer.destroy();tryOpen(left-1);return;}
      $('#bHost').disabled=false;$('#bHost').textContent='部屋をつくる';netErr('部屋をつくれませんでした（'+e.type+'）。通信が制限された画面では使えないので、公開版のURLから開いてください。');});
    peer.on('connection',conn=>{
      conn.on('data',d=>hostRecv(conn,d));
      conn.on('close',()=>{NET.conns.delete(conn.peer);NET.players=NET.players.filter(p=>p.id!==conn.peer);const k=G.karts.find(k=>k.id===conn.peer);
        if(k&&G.mode!=='menu'){G.karts.splice(G.karts.indexOf(k),1);}NET.sendLobby();});
    });
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  };tryOpen(3);
}
function hostRecv(conn,d){
  if(d.t==='hello'){if(NET.players.length>=8||G.mode==='race'||G.mode==='countdown'){conn.send({t:'full',busy:G.mode!=='menu'&&G.mode!=='attract'});setTimeout(()=>conn.close(),300);return;}
    let color=d.color;if(NET.players.some(p=>p.color===color))color=COLORS.find(c=>!NET.players.some(p=>p.color===c))||color;
    NET.conns.set(conn.peer,conn);NET.players.push({id:conn.peer,name:String(d.name).slice(0,8),color,ch:charById(d.ch).id,kt:kartById(d.kt).id});NET.sendLobby();}
  else if(d.t==='s'){applyStates([d.k]);}
  else if(d.t==='e'){applyEvent(d.ev);NET.bcast({t:'e',ev:d.ev},conn.peer);}
}
async function joinRoom(){
  netErr('');const code=$('#codeIn').value.trim().toUpperCase();if(code.length!==4){netErr('4文字の部屋コードを入れてください。');return;}
  if(!canRTC()){netErr('このページではオンライン対戦が使えません。公開版のURLから開いてください。');return;}
  $('#bJoin').disabled=true;$('#bJoin').textContent='接続中…';
  const done=()=>{$('#bJoin').disabled=false;$('#bJoin').textContent='部屋に入る';};
  try{await loadPeerJS();}catch(e){netErr('通信ライブラリを読み込めませんでした。ネット接続を確認してください。');done();return;}
  const peer=new Peer();let joined=false;
  peer.on('open',id=>{NET.peer=peer;NET.myId=id;NET.isHost=false;NET.code=code;
    const conn=peer.connect(PREFIX+code,{reliable:true});NET.hostConn=conn;
    const to=setTimeout(()=>{if(!joined){netErr('部屋に接続できませんでした。コードを確かめてください。');done();NET.close();}},12000);
    conn.on('open',()=>{conn.send({t:'hello',name:settings.name,color:COLORS[settings.color],ch:settings.ch,kt:settings.kt});});
    conn.on('data',d=>{if(!joined&&d.t==='lobby'){joined=true;clearTimeout(to);done();G.online=true;}guestRecv(d);});
    conn.on('close',()=>{if(joined){quitToTitle();netErr('ホストとの接続が切れました。');}});
  });
  peer.on('error',e=>{done();netErr(e.type==='peer-unavailable'?'その部屋は見つかりません。コードを確かめてください。':'接続できませんでした（'+e.type+'）。公開版のURLから開いてください。');try{peer.destroy();}catch(_){} });
}
function guestRecv(d){
  if(d.t==='lobby'){NET.players=d.players;G.selCourse=d.course;G.selLaps=d.laps;G.selCpu=d.cpu;
    if(d.back||!$('#sTitle').hidden){showScreen('#sLobby');if(d.back){$('#hud').hidden=true;startAttract();}}
    refreshLobby();}
  else if(d.t==='full'){netErr(d.busy?'レース中の部屋です。終わってから入ってください。':'部屋がいっぱいです（最大8人）。');NET.close();}
  else if(d.t==='start'){beginRace(d.grid,d.course,d.laps);}
  else if(d.t==='s'){applyStates(d.k);}
  else if(d.t==='e'){applyEvent(d.ev);}
}
function packKart(k){return{id:k.id,x:Math.round(k.x*10)/10,y:Math.round(k.y*10)/10,a:Math.round(k.a*1000)/1000,sp:Math.round(k.sp),lap:k.lap,idx:k.idx,
  fin:k.fin,sp2:k.spin>0?1:0,st:k.star>0?1:0,b:k.boost>0?k.boostKind:0,dr:k.drift,ch:Math.round(k.charge*10)/10,fa:k.fall>0?Math.round(k.fall*100)/100:0,h:k.hop>0?1:0,z:Math.round((k.z||0)*10)/10,sh:k.shrink>0?1:0};}
function applyStates(list){
  for(const s of list){if(!s||s.id===NET.myId)continue;const k=G.karts.find(k=>k.id===s.id);if(!k||!k.remote)continue;
    if(Math.hypot(s.x-k.x,s.y-k.y)>80){k.x=s.x;k.y=s.y;}
    k.tx=s.x;k.ty=s.y;k.ta=s.a;k.sp=s.sp;k.lap=s.lap;k.idx=s.idx;if(s.fin!=null&&k.fin==null)k.fin=s.fin;
    if(s.sp2&&k.spin<=0)k.spinVis=0;k.spin=s.sp2?1:0;k.star=s.st?1:0;k.boost=s.b?1:0;k.boostKind=s.b;k.drift=s.dr;k.charge=s.ch;k.fall=s.fa;k.hop=s.h?.1:0;k.tz=s.z;k.shrink=s.sh?1:0;}
}
function netTick(now){
  if(!G.online||now-G.lastStateSend<66)return;G.lastStateSend=now;
  if(NET.isHost){const mine=G.karts.filter(k=>!k.remote).map(packKart);const all=mine.concat(G.karts.filter(k=>k.remote).map(k=>({...packKart(k),x:k.tx,y:k.ty,a:k.ta,z:k.tz})));
    NET.bcast({t:'s',k:all});}
  else if(NET.hostConn&&NET.hostConn.open&&G.me){try{NET.hostConn.send({t:'s',k:packKart(G.me)});}catch(e){}}
}
function netEvent(ev){if(!G.online)return;if(NET.isHost)NET.bcast({t:'e',ev});else if(NET.hostConn&&NET.hostConn.open)try{NET.hostConn.send({t:'e',ev});}catch(e){}}
function applyEvent(ev){
  if(ev.e==='obj'){if(!G.objs.some(o=>o.id===ev.o.id))spawnObj(ev.o,true);}
  else if(ev.e==='rm'){removeObj(ev.id,true);}
  else if(ev.e==='box'){const b=G.boxes[ev.i];if(b)b.t=4;}
  else if(ev.e==='thunder'){applyThunder(ev.by);}
}
$('#bHost').onclick=()=>{audioInit();hostRoom();};
$('#bJoin').onclick=()=>{audioInit();joinRoom();};
$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});

/* ================= boot ================= */
try{if(!initGL())throw new Error('nogl');}catch(e){console.warn(e);document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;bottom:8px;left:16px;right:16px;color:#fff;background:#a3132c;padding:8px;border-radius:8px">この端末ではWebGLが使えないため描画できません。</p>');}
$('#bSound').style.opacity=settings.sound?1:.4;
resize();startAttract();showScreen('#sTitle');requestAnimationFrame(frame);
window.__pk={G,NET,beginRace,soloGrid,input,keys};
</script>
