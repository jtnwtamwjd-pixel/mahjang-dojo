<style>

.ic{font-size:12px}

.pitch:before{content:"";position:absolute;left:50%;top:0;width:40%;height:15%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.3);border-top:none}
.pitch:after{content:"";position:absolute;left:50%;bottom:0;width:40%;height:15%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.3);border-bottom:none}

/* ================= lineup helpers ================= */
function fixUserLineup(){
 const tc=S.tactics,roles=FORMS[tc.form].map(f=>f[0]);const changes=[];
 const ok=id=>{const p=P(id);return p&&p.tid===S.team&&avail(p);};
 if(!Array.isArray(tc.lineup)||tc.lineup.length!==roles.length)tc.lineup=Array(roles.length).fill(null);
 tc.bench=(tc.bench||[]).filter(ok);
 const used=new Set();
 tc.lineup=tc.lineup.map(id=>{if(ok(id)&&!used.has(id)){used.add(id);return id;}return null;});
 tc.bench=tc.bench.filter(id=>!used.has(id));
 roles.forEach((r,i)=>{if(tc.lineup[i]!=null)return;
  const cand=teamPlayers(S.team).filter(p=>avail(p)&&!used.has(p.id)).sort((a,b)=>effOvr(b,r)-effOvr(a,r))[0];
  if(cand){tc.lineup[i]=cand.id;used.add(cand.id);tc.bench=tc.bench.filter(x=>x!==cand.id);changes.push(cand.short+' → '+r);}});
 const rest=teamPlayers(S.team).filter(p=>avail(p)&&!used.has(p.id)&&!tc.bench.includes(p.id)).sort((a,b)=>b.ovr-a.ovr);
 if(!tc.bench.some(id=>P(id).pos==='GK')){const g=rest.find(p=>p.pos==='GK');if(g&&tc.bench.length<7)tc.bench.push(g.id);}
 for(const p of rest){if(tc.bench.length>=7)break;if(!tc.bench.includes(p.id))tc.bench.push(p.id);}
 if(fLim()){let fc=foreignCount();
  while(fc>FOREIGN_MAX){const bi=tc.bench.findIndex(id=>isF(P(id)));if(bi>=0){tc.bench.splice(bi,1);fc--;continue;}
   let wi=-1,wv=999;tc.lineup.forEach((id,i)=>{const q=P(id);if(q&&isF(q)){const v=effOvr(q,roles[i]);if(v<wv){wv=v;wi=i;}}});
   const ua=new Set([...tc.lineup,...tc.bench]);const rp=teamPlayers(S.team).filter(q=>avail(q)&&!isF(q)&&!ua.has(q.id)).sort((a,b)=>effOvr(b,roles[wi])-effOvr(a,roles[wi]))[0];
   changes.push('外国籍枠のため '+P(tc.lineup[wi]).short+' を外しました');tc.lineup[wi]=rp?rp.id:null;fc--;}
  const ua=new Set([...tc.lineup,...tc.bench]);for(const q of teamPlayers(S.team).filter(q=>avail(q)&&!ua.has(q.id)).sort((a,b)=>b.ovr-a.ovr)){if(tc.bench.length>=7)break;if(isF(q)){if(fc>=FOREIGN_MAX)continue;fc++;}tc.bench.push(q.id);}}
 return changes;
}
const fLim=()=>ULG()==='jp';
function foreignCount(){const tc=S.tactics;return[...tc.lineup,...tc.bench].filter(id=>id!=null&&P(id)&&isF(P(id))).length;}
function foreignBlocked(newId,outId){if(!fLim())return false;const np=P(newId),op=outId!=null?P(outId):null;const tc=S.tactics;
 if(!isF(np)||tc.lineup.includes(newId)||tc.bench.includes(newId))return false;if(op&&isF(op))return false;
 if(foreignCount()>=FOREIGN_MAX){toast('日本リーグの外国籍選手は試合登録'+FOREIGN_MAX+'人までです');return true;}return false;}
function lineupIssues(){const tc=S.tactics,out=[];
 tc.lineup.forEach(id=>{const p=P(id);if(!p||p.tid!==S.team)out.push('先発に空きがあります');else if(p.inj)out.push(`${p.name} は負傷中（残り${p.inj}試合）`);else if(p.susp)out.push(`${p.name} は出場停止（残り${p.susp}試合）`);else if(p.fit<55)out.push(`${p.name} の体力が低下（${Math.round(p.fit)}%）`);});
 if(fLim()&&foreignCount()>FOREIGN_MAX)out.push(`外国籍選手が登録枠（${FOREIGN_MAX}人）を超えています（${foreignCount()}人）`);
 return[...new Set(out)];}
function hardIssues(){return S.tactics.lineup.some(id=>{const p=P(id);return!p||p.tid!==S.team||!avail(p);})||(fLim()&&foreignCount()>FOREIGN_MAX);}
function changeFormation(form){const tc=S.tactics;const old=tc.lineup.filter(id=>id!=null);tc.form=form;
 const roles=FORMS[form].map(f=>f[0]);const pool=old.map(P).filter(Boolean);const pairs=[];
 roles.forEach((r,i)=>pool.forEach(p=>pairs.push([effOvr(p,r),i,p.id])));pairs.sort((a,b)=>b[0]-a[0]);
 const l=Array(roles.length).fill(null),used=new Set();for(const[s,i,id]of pairs){if(l[i]==null&&!used.has(id)){l[i]=id;used.add(id);}}
 tc.lineup=l;fixUserLineup();}

/* ================= match engine ================= */
function makeSide(tid,auto){
 const isU=tid===S.team;let form,lineup,bench,style;
 if(isU){fixUserLineup();form=S.tactics.form;lineup=FORMS[form].map((f,i)=>({role:f[0],pid:S.tactics.lineup[i]}));bench=S.tactics.bench.slice();style=S.tactics.style;}
 else{const t=T(tid);form=t.form;const a=autoPick(tid,form);lineup=FORMS[form].map((f,i)=>({role:f[0],pid:a.lineup[i]}));bench=a.bench;style=t.style;}
 const s={tid,form,lineup,bench,style,auto:auto||!isU,subs:5,energy:{},goals:0,shots:0,sot:0,ycl:[],reds:[],injs:[],played:[],rating:{},isU};
 lineup.forEach(sl=>{if(sl.pid!=null)enter(s,sl.pid,sl.role);});
 bench.forEach(id=>{s.energy[id]=P(id).fit;});
 return s;
}
function enter(s,pid,role){const p=P(pid);s.energy[pid]=p.fit;if(!s.played.includes(pid))s.played.push(pid);s.rating[pid]=6.1+rnd(-.4,.5)+(effOvr(p,role)-70)*.015;}
function newMatch(h,a,auto,cup){return{cup:!!cup,h:makeSide(h,auto),a:makeSide(a,auto),min:0,half:1,add1:ri(1,4),add2:ri(2,6),log:[],gl:[],done:false,possSum:0,possN:0,poss:.5,ht:false};}
function moraleF(p){return .97+.06*(p.mor/100);}
function sideStr(s){let sa=0,sm=0,sd=0,wa=0,wm=0,wd=0,miss=0;
 for(const sl of s.lineup){if(sl.pid==null){miss++;continue;}const p=P(sl.pid),w=ROLEW[sl.role];
  const e=effOvr(p,sl.role)*(.8+.2*clamp(s.energy[sl.pid],0,100)/100)*moraleF(p);
  sa+=e*w[0];wa+=w[0];sm+=e*w[1];wm+=w[1];sd+=e*w[2];wd+=w[2];}
 const f=(x,w,r)=>w>0?x/w+12*(w/r-1):40;
 const eb=s.isU&&coachSp('euro')?1.5:0;
 return{a:f(sa,wa,REF[0])-miss*4+eb,m:f(sm,wm,REF[1])-miss*4+eb,d:f(sd,wd,REF[2])-miss*4+eb};}
function dispMin(M){return M.half===1?(M.min<=45?M.min+"'":"45+"+(M.min-45)+"'"):(M.min<=90?M.min+"'":"90+"+(M.min-90)+"'");}
function lg(M,side,txt,cls){M.log.push({t:M.min?dispMin(M):'',s:side,txt,cls:cls||''});}
const nm=pid=>{const p=P(pid);return p?p.short:'?';};
function onPitch(s){return s.lineup.filter(sl=>sl.pid!=null);}
function stepMinute(M){
 if(M.done)return;
 M.min++;
 const hs=sideStr(M.h),as=sideStr(M.a),sh=STY[M.h.style],sa=STY[M.a.style];
 let poss=sig((hs.m+1.5-as.m)/12)+sh.p-sa.p;poss=clamp(poss,.3,.7);M.poss=poss;M.possSum+=poss;M.possN++;
 const pcH=.115*poss*2*sh.own*sa.opp,pcA=.115*(1-poss)*2*sa.own*sh.opp;
 if(Math.random()<pcH)chance(M,'h',hs,as,poss);
 if(Math.random()<pcA)chance(M,'a',as,hs,1-poss);
 for(const k of['h','a']){const s=M[k];
  const dr=.22*STY[s.style].drain;onPitch(s).forEach(sl=>{const p=P(sl.pid);s.energy[sl.pid]-=dr*(p.age>31?1.12:1)*rnd(.7,1.3);});
  if(Math.random()<.017*(s.style==='ハイプレス'?1.3:1))card(M,k,false);
  if(Math.random()<.0004)card(M,k,true);
  if(Math.random()<.0013)injury(M,k);
  if(s.auto)aiManage(M,k);
 }
 if(Math.random()<.06)flavor(M);
 if(M.half===1&&M.min>=45+M.add1){lg(M,null,'⏸ 前半終了 '+M.h.goals+' - '+M.a.goals,'bold');M.half=2;M.min=45;M.ht=true;}
 else if(M.half===2&&M.min>=90+M.add2){lg(M,null,'🏁 試合終了 '+M.h.goals+' - '+M.a.goals,'bold');M.done=true;finalizeRatings(M);if(M.cup)cupPK(M);}
}
function shooterOf(s){return wpick(onPitch(s),sl=>{const g=POS_GROUP[sl.role];const p=P(sl.pid);return({GK:.01,DF:.8,MF:sl.role==='CAM'?3.5:2.2,FW:6})[g]*Math.pow(effOvr(p,sl.role)/70,3);}).pid;}
function chance(M,k,As,Ds,poss){
 const s=M[k],o=M[k==='h'?'a':'h'];const st=STY[s.style];
 let conv=.14*2*sig((As.a-Ds.d+(k==="h"?1:0))/12)*(st.ctr?(poss<.5?st.conv:1):st.conv);conv=clamp(conv,.04,.33);
 const sp=shooterOf(s);if(sp==null)return;s.shots++;
 const gkSl=o.lineup.find(sl=>sl.role==='GK'&&sl.pid!=null);const gk=gkSl?gkSl.pid:null;
 if(Math.random()<conv){
  s.goals++;s.sot++;s.rating[sp]+=1.05;let ast=null;
  if(Math.random()<.75){const c=onPitch(s).filter(sl=>sl.pid!==sp);if(c.length){ast=wpick(c,sl=>({GK:.05,DF:1.2,MF:sl.role==='CAM'?5:3.6,FW:3})[POS_GROUP[sl.role]]).pid;s.rating[ast]+=.6;}}
  if(gk)o.rating[gk]-=.3;onPitch(o).forEach(sl=>{if(POS_GROUP[sl.role]==='DF')o.rating[sl.pid]-=.12;});
  M.gl.push({min:dispMin(M),k,pid:sp,ast});
  lg(M,k,pick(['⚽ ゴール！ '+nm(sp)+'が決めた！','⚽ '+nm(sp)+'のシュートがネットを揺らす！','⚽ '+nm(sp)+'、見事なフィニッシュ！','⚽ ゴーーール！ '+nm(sp)+'！'])+(ast?'（アシスト: '+nm(ast)+'）':'')+'　'+M.h.goals+'-'+M.a.goals,'goal');
 }else{const r=Math.random();s.rating[sp]-=.04;
  if(r<.38){s.sot++;if(gk)o.rating[gk]+=.18;lg(M,k,pick([nm(sp)+'のシュートはGK'+(gk?nm(gk):'')+'がセーブ',(gk?nm(gk):'GK')+'がファインセーブ！ '+nm(sp)+'の決定機を阻止',nm(sp)+'の強烈なミドル！ しかしGKが弾く']));}
  else if(r<.48)lg(M,k,pick([nm(sp)+'のシュートはポストに嫌われる！','クロスバー直撃！ '+nm(sp)+'、惜しい！']));
  else lg(M,k,pick([nm(sp)+'のシュートは枠の外',nm(sp)+'、ふかしてしまった',nm(sp)+'のヘディングはわずかに外れる',nm(sp)+'が狙うも枠を捉えられず']));
 }
}
function card(M,k,straight){const s=M[k];const c=onPitch(s);if(!c.length)return;
 const sl=wpick(c,x=>({GK:.2,DF:3,MF:2,FW:1})[POS_GROUP[x.role]]);const pid=sl.pid;
 if(straight||s.ycl.includes(pid)){s.reds.push({pid,two:!straight});s.rating[pid]-=1.5;sl.pid=null;lg(M,k,(straight?'🟥 ':'🟨🟥 ')+nm(pid)+(straight?'が一発退場！':'、2枚目のイエローで退場！'),'bold');}
 else{s.ycl.push(pid);s.rating[pid]-=.3;lg(M,k,'🟨 '+nm(pid)+'にイエローカード');}}
function bestBench(s,role){let best=null,bv=-1;s.bench.forEach(id=>{const p=P(id);if(!p)return;const v=effOvr(p,role)*(.8+.2*s.energy[id]/100);if(v>bv){bv=v;best=id;}});return best;}
function doSub(M,k,slotIdx,inPid,why){const s=M[k];const sl=s.lineup[slotIdx];const out=sl.pid;sl.pid=inPid;s.bench=s.bench.filter(x=>x!==inPid);s.subs--;enter(s,inPid,sl.role);s.energy[inPid]=P(inPid).fit;
 lg(M,k,'🔄 '+(why||'選手交代')+'：'+nm(inPid)+' IN ⇄ '+(out!=null?nm(out):'')+' OUT');}
function injury(M,k){const s=M[k];const c=onPitch(s);if(!c.length)return;const sl=pick(c);const pid=sl.pid;const len=wpick([1,1,1,2,2,3,4,6,8],()=>1);s.injs.push([pid,len]);
 lg(M,k,'🚑 '+nm(pid)+'が負傷… プレー続行は難しそうだ','bold');
 const idx=s.lineup.indexOf(sl);const b=s.subs>0?bestBench(s,sl.role):null;if(b!=null)doSub(M,k,idx,b,'負傷交代');else{sl.pid=null;lg(M,k,'交代枠がなく、数的不利に…');}}
function aiManage(M,k){const s=M[k],o=M[k==='h'?'a':'h'];
 if([58,66,74,82].includes(M.min)&&M.half===2&&s.subs>0){
  let worst=null,wi=-1;s.lineup.forEach((sl,i)=>{if(sl.pid==null||sl.role==='GK')return;const e=s.energy[sl.pid];if(e<72&&(worst==null||e<s.energy[worst])){worst=sl.pid;wi=i;}});
  if(wi>=0){const b=bestBench(s,s.lineup[wi].role);if(b!=null&&P(b).pos!=='GK')doSub(M,k,wi,b);}}
 if(M.half===2&&M.min===70&&s.goals<o.goals&&s.style!=='攻撃的'){s.style='攻撃的';lg(M,k,'📣 '+T(s.tid).name+'が攻撃的な布陣にシフト');}

 h+=`<p class="muted" style="font-size:11px">引退した選手がコーチ候補になります。海外リーグでプレーした日本人選手は、日本リーグのクラブで特殊能力を発揮します。</p><button style="width:100%" onclick="coachMarket()">コーチ候補を見る（${(S.cpool||[]).length}人）</button></div>`;return h;}
function coachMarket(){const L=(S.cpool||[]).slice().sort((a,b)=>(b.sp?1:0)-(a.sp?1:0)||b.pk-a.pk);
 openModal(`<button class="x" onclick="closeModal()">×</button><h2>コーチ候補</h2><p class="muted" style="font-size:12px">同じ担当のコーチがいる場合は入れ替わります。年俸は毎節の人件費に含まれます。</p>${L.map(c=>coachRow(c,`<button class="sm pri" onclick="hireCoach('${c.id}')">招聘</button>`)).join('')||'<p class="muted">候補がいません。選手が引退すると候補に加わります。</p>'}`);}

 const from=p.tid;markMove(p,from,S.team);if(from)T(from).budget+=fee;me.budget-=fee;S.fin.tout+=fee;

 S.tactics.lineup=S.tactics.lineup.map(id=>id===p.id?null:id);S.tactics.bench=S.tactics.bench.filter(id=>id!==p.id);fixUserLineup();
 S.offers=S.offers.filter(o=>{if(o.pid===p.id){const m=S.inbox.find(x=>x.offer===o.id);if(m&&!m.done)m.done='無効';return false;}return true;});
 inbox('売却完了: '+p.name,`${p.name}が${t.name}へ移籍しました。移籍金 ${fmtM(fee)}`);save();}

function table(lg){lg=lg||ULG();return tally(S.L[lg].res,teamsOf(lg).map(t=>t.id));}
function scorers(n,lg){lg=lg||ULG();return Object.values(S.players).filter(p=>p.st.g>0&&p.tid>0&&T(p.tid).lg===lg).sort((a,b)=>b.st.g-a.st.g||b.st.as-a.st.as).slice(0,n);}
function seasonEnd(){
 S.lastRanks={};const champs={};
 for(const lg of LG_ORDER){const tl=table(lg);S.lastRanks[lg]=tl.map(r=>r.id);champs[lg]=tl[0].id;const mul=LG_DEF[lg].tv/1500;
  tl.forEach((r,i)=>{const t=T(r.id);const prize=Math.round((13-(i+1))*8000*Math.sqrt(mul));t.budget+=prize;if(r.id===S.team)S.fin.prize+=prize;t.rep=clamp(t.rep+(6.5-(i+1))*.7,35,99);});}
 const tb=table();const pos=tb.findIndex(r=>r.id===S.team)+1;const row=tb[pos-1];const champ=tb[0].id;
 const tgt=S.obj.target;let dc=pos<=tgt?15+(tgt-pos)*4:-(pos-tgt)*9;if(pos===1)dc+=10;S.board=clamp(S.board+dc,0,100);
 const fired=S.board<25;
 const best=Object.values(S.players).filter(p=>p.st.a>=8&&p.tid>0&&T(p.tid).lg===ULG()).sort((a,b)=>b.st.r/b.st.a-a.st.r/a.st.a)[0];
 const ts=scorers(1)[0];
 if(pos===1)S.mgr.trophies++;
 S.hist.push({s:S.season,tid:S.team,pos,w:row.w,d:row.d,l:row.l,pts:row.pts,obj:S.obj.text,ok:pos<=tgt,cup:S.cup?(S.cup.out||'-'):'-',intl:S.intl&&S.intl.ids.includes(S.team)?(S.intl.out||'-'):null});
 const myRep=myTeam().rep;let offers=[];
 if(fired)offers=shuffle(S.teams.filter(t=>t.id!==S.team&&t.rep<myRep)).slice(0,3).map(t=>t.id);
 else if(pos<=Math.max(1,tgt-2)||pos===1)offers=shuffle(S.teams.filter(t=>t.id!==S.team&&t.rep>myRep+3)).slice(0,2).map(t=>t.id);
 if(fired&&offers.length<2)offers=shuffle(S.teams.filter(t=>t.id!==S.team)).slice(-3).map(t=>t.id);
 S.endInfo={pos,champ,ok:pos<=tgt,fired,offers,ts:ts?[ts.name,ts.tid,ts.st.g]:null,mvp:best?[best.name,best.tid,Math.round(best.st.r/best.st.a*100)/100]:null,pts:row.pts,champs,intlW:S.intl&&S.intl.winner};
 abroadCheck();
 S.phase='end';
 inbox('シーズン'+S.season+' 終了',`最終順位: ${pos}位（勝点${row.pts}）\n目標「${S.obj.text}」: ${pos<=tgt?'達成 ✅':'未達成 ❌'}\n${fired?'理事会はあなたの解任を決定しました…':'理事会の信頼度: '+Math.round(S.board)+'%'}`);
}

   inbox('買取オプション行使: '+p.name,`${t.name}がレンタル中の${p.name}の買取オプションを行使しました。移籍金 ${fmtM(c)} を受け取りました。`);return;}

  if(from===S.team)back.push(`${p.name}（${T(p.tid).ab}で${p.st.a}試合${p.st.g}得点、総合 ${R(o0)}→${R(p.ovr)}）`);
  else if(p.tid===S.team)inbox('レンタル終了',p.name+'がレンタル期間を終えて'+T(from).name+'へ戻りました。');
  p.tid=from;delete p.loan;});
 if(back.length)inbox('レンタル選手が復帰',back.join('\n'));
 Object.values(S.players).forEach(p=>{
  p.age++;

  p.st={a:0,g:0,as:0,r:0};p.yc=0;p.susp=0;p.fit=100;p.mor=clamp(p.mor*.5+33,30,90);
 });
 if(retired.length)inbox('現役引退',retired.join('、')+' が現役を引退しました。コーチ候補に加わりました。');
 goAbroad();
 youthSeasonEnd();
 S.teams.forEach(t=>{const b=teamBase(t);
  if(t.id!==S.team)for(let i=0;i<2;i++){const p=genPlayer(pick(SQUAD_ROLES),b-17+gauss()*3.5,ri(16,18),t.id);p.con=3;p.wage=calcWage(p);}
  if(t.id!==S.team){let sq=teamPlayers(t.id);
   while(sq.length>28){const w=sq.sort((a,b)=>a.ovr-b.ovr)[0];w.tid=0;sq=teamPlayers(t.id);}
   const need={GK:3,DF:8,MF:8,FW:4};
   for(const g of Object.keys(need)){let c=sq.filter(p=>POS_GROUP[p.pos]===g).length;while(c<need[g]){const roles=SQUAD_ROLES.filter(r=>POS_GROUP[r]===g);genPlayer(pick(roles),b-4+gauss()*4,ri(21,30),t.id);c++;}sq=teamPlayers(t.id);}
   t.budget+=Math.round(t.rep*t.rep*20*lgMul(t.lg));}
 });
 genFreeAgents(Math.max(0,30-teamPlayers(0).length));
 {const sq=teamPlayers(S.team);const need={GK:2,DF:6,MF:6,FW:3};const add=[];for(const g of Object.keys(need)){let c=sq.filter(p=>POS_GROUP[p.pos]===g).length;while(c<need[g]){const fa=teamPlayers(0).filter(p=>POS_GROUP[p.pos]===g).sort((a,b)=>a.ovr-b.ovr)[0]||genPlayer(pick(SQUAD_ROLES.filter(r=>POS_GROUP[r]===g)),55,ri(24,30),0);fa.tid=S.team;fa.con=1;fa.wage=calcWage(fa);add.push(fa.name);c++;}}
  if(add.length)inbox('緊急補強','選手が不足したため、理事会がフリーの '+add.join('、')+' と1年契約を結びました。');}
 S.season++;startSeasonCommon();fixUserLineup();
 inbox('シーズン'+S.season+' 開幕',`理事会の今季目標は「${S.obj.text}」です。（戦力評価 ${S.obj.exp}位）`);
 save();}

const YOUTH_MAX=14;
const SCOUT_REG={jp:{n:'国内',nat:['jp'],cost:2000},sa:{n:'南米',nat:['br','ar'],cost:4000},eu:{n:'ヨーロッパ',nat:['en','es','de','it','fr','nl'],cost:5000},af:{n:'アフリカ',nat:['af'],cost:3500},as:{n:'アジア',nat:['kr','jp'],cost:2500}};
const yMult=()=>1+.15*S.youth.lvl;
const upCost=l=>[0,20000,40000,70000,110000][l];
function genYouth(nat,qual){const age=ri(15,17);const p=genPlayer(pick(SQUAD_ROLES),rnd(38,50)+qual*.6,age,-1,nat);
 p.pot=Math.round(clamp(p.ovr+rnd(14,30)+qual*1.2,p.ovr+8,95));if(ULG()==='jp'){const lim=jpLim(S.youth.lvl*.03);if(p.pot>lim)p.pot=lim;}const w=Math.max(2,8-S.youth.lvl);p.pl=p.pot-ri(1,w);p.ph=Math.min(99,p.pot+ri(1,w));p.con=0;p.wage=0;return p;}
function youthIntake(){const n=ri(2,3)+(S.youth.lvl>=4?1:0);const ys=[];for(let i=0;i<n;i++){const nat=ULG()==='jp'?'jp':(Math.random()<.6?ULG():'jp');const p=genYouth(nat,S.youth.lvl*2+rnd(-2,4));ys.push(p);}
 trimYouth();inbox('🌱 ユース新入団','アカデミーに新入生が加わりました：'+ys.map(p=>`${p.name}（${POS_JP[p.pos]}・${p.age}歳・潜在${p.pl}-${p.ph}）`).join('、'));}
function trimYouth(){let y=teamPlayers(-1);while(y.length>YOUTH_MAX){const w=y.sort((a,b)=>a.pot-b.pot)[0];delete S.players[w.id];y=teamPlayers(-1);}}
function youthSeasonEnd(){if(!S.youth)S.youth={lvl:1,scout:null,reports:[]};const out=[],up=[];
 teamPlayers(-1).forEach(p=>{if(p.age>=19){const avg=teamPlayers(S.team).reduce((a,q)=>a+q.ovr,0)/Math.max(1,teamPlayers(S.team).length);
   if(p.pot>=avg-3&&teamPlayers(S.team).length<32){promoteYouth(p.id,true);up.push(p.name);}else{out.push(p.name);delete S.players[p.id];}}});
 if(up.length)inbox('ユース卒業','19歳になった '+up.join('、')+' をトップチームに昇格させました。');
 if(out.length)inbox('ユース卒業','19歳になった '+out.join('、')+' はトップ昇格の基準に届かず、アカデミーを卒業しました。');
 youthIntake();}
function promoteYouth(id,silent){const p=P(id);if(!silent&&teamPlayers(S.team).length>=32){toast('トップチームが満員です（最大32人）');return;}
 if(!silent&&p.age<16){toast('16歳から昇格できます');return;}
 p.tid=S.team;p.con=3;p.wage=calcWage(p);p.mor=80;if(!silent){inbox('トップ昇格: '+p.name,`${p.name}（${p.age}歳）をトップチームに昇格させました。`);fixUserLineup();save();closeModal();toast(p.name+'をトップに昇格させました');render();}}
function releaseYouth(id){const p=P(id);if(!confirm(p.name+'をアカデミーから放出しますか？'))return;delete S.players[id];save();closeModal();render();}
function upgradeYouth(){const l=S.youth.lvl;if(l>=5)return;const c=upCost(l);const me=myTeam();if(me.budget<c){toast('資金が足りません');return;}
 if(!confirm(`ユース施設をLv${l+1}に改修しますか？（${fmtM(c)}）`))return;me.budget-=c;S.fin.tout+=c;S.youth.lvl++;save();toast('ユース施設をLv'+S.youth.lvl+'に改修しました');render();}
function sendScout(k){const r=SCOUT_REG[k];const me=myTeam();if(S.youth.scout){toast('スカウトはすでに派遣中です');return;}if(me.budget<r.cost){toast('資金が足りません');return;}
 me.budget-=r.cost;S.fin.tout+=r.cost;S.youth.scout={k,back:S.md+3,season:S.season};save();toast(r.n+'へスカウトを派遣しました（3節後に報告）');render();}
function scoutTick(){const sc=S.youth&&S.youth.scout;if(!sc)return;if(sc.season===S.season&&S.md+1<sc.back)return;
 const r=SCOUT_REG[sc.k];const n=ri(2,3);const reps=[];for(let i=0;i<n;i++){const p=genYouth(pick(r.nat),S.youth.lvl*2+rnd(0,10));p.tid=-2;reps.push(p.id);}
 S.youth.reports=reps;S.youth.scout=null;inbox('🔍 スカウト報告（'+r.n+'）',reps.map(id=>{const p=P(id);return`${p.name}（${POS_JP[p.pos]}・${p.age}歳・総合${R(p.ovr)}・潜在${p.pl}-${p.ph}）`;}).join('\n')+'\nクラブ画面の「ユース」から契約できます。');}
function signProspect(id){const p=P(id);if(teamPlayers(-1).length>=YOUTH_MAX){toast('ユースは最大'+YOUTH_MAX+'人です');return;}const fee=500;const me=myTeam();if(me.budget<fee){toast('資金が足りません');return;}
 me.budget-=fee;S.fin.tout+=fee;p.tid=-1;S.youth.reports=S.youth.reports.filter(x=>x!==id);inbox('ユース加入: '+p.name,`${p.name}（${p.age}歳）がアカデミーに加入しました。`);save();toast(p.name+'がユースに加入しました');render();}
function clearReports(){(S.youth.reports||[]).forEach(id=>delete S.players[id]);S.youth.reports=[];save();render();}
function takeJob(tid){teamPlayers(S.team).forEach(p=>{p.list=false;p.focus=false;});const yc=teamPlayers(-1).length;teamPlayers(-1).forEach(p=>delete S.players[p.id]);if(yc)inbox('ユース','前クラブのユース選手'+yc+'人とはお別れです。新しいクラブでユースを一から育てましょう。');S.youth={lvl:1,scout:null,reports:[]};const old=myTeam().name;S.team=tid;S.board=55;S.tactics=defaultTactics(tid);if(!S.mgr.clubs.includes(tid))S.mgr.clubs.push(tid);

const oc=o=>o>=80?'o4':o>=73?'o3':o>=66?'o2':'o1';
const R=o=>Math.round(o);
const stars=r=>{const n=clamp(Math.round((r-35)/11),1,5);return'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span>';};

function rankOf(tid){return table(T(tid).lg).findIndex(r=>r.id===tid)+1;}
const flag=p=>p.nat==='jp'?'🇯🇵':(p.nat&&NAT[p.nat]?NAT[p.nat].f:'');

 <span class="potv">${potHTML(p)}</span>
 <div class="mini"><div class="bar"><i style="width:${p.fit}%;background:${fitColor(p.fit)}"></i></div><small class="muted" style="font-size:10px">${morIcon(p.mor)} ${R(p.fit)}%</small></div></div>`;}

function showHelp(){openModal(`<button class="x" onclick="closeModal()">×</button><h2>遊び方</h2><div class="help">
 <p>あなたは監督として、日本と海外5カ国（イングランド・スペイン・ドイツ・イタリア・フランス）のリーグから1クラブを選び、12クラブで争うリーグを全22節（ホーム＆アウェイ）戦います。</p>
 <p><b>🏆 カップ戦・国際大会</b>：国内カップに加え、各国リーグ上位クラブが集まる国際大会（グループステージ→決勝トーナメント）があります。前季の順位で出場権が決まります。</p>
 <p><b>🌏 外国人枠</b>：日本リーグでは先発＋控えに入れる外国籍選手は最大${FOREIGN_MAX}人までです。</p>
 <p><b>🌱 ユース</b>：選手タブの「ユース」で下部組織を管理。毎季新入団があり、施設強化やスカウト派遣で有望株を発掘、トップチームへ昇格させられます。</p>
 <p><b>📋 作戦</b>：フォーメーションと先発・控えを決め、戦術スタイルとトレーニング強度を選びます。本職以外のポジションに置くと能力が下がります。</p>
 <p><b>▶ 試合</b>：実況つきで試合が進みます。一時停止して戦術変更や選手交代（最大5人）ができます。疲れた選手は能力が落ちるので交代で活性化しましょう。</p>
 <p><b>🔁 移籍</b>：他クラブの選手にオファーを出して獲得。相手の要求額は主力ほど高くなります。売却リストに登録するとオファーが届きます。先方の希望額や届いたオファーには、金額を返答して最大3回まで交渉できます。レンタルは買取オプション付きにすると、期間中に決まった金額で完全移籍へ切り替えられます。</p>
 <p><b>🌐 代表戦</b>：4年に一度、${WC_NAME}が開催されます（リーグ画面の「代表」）。操作はできませんが、各国代表はその時点で能力が高く負傷していない選手から選ばれ、代表戦で疲労や負傷を負うことも。優勝国のリーグの全クラブに賞金が入ります。</p>
 <p><b>🧑‍🏫 コーチ</b>：クラブ画面でコーチを招聘できます。候補は引退した選手で、現役時代の実力が高いほど育成効果が大きくなります。海外リーグでプレーした日本人選手は、日本リーグのクラブで特殊能力を発揮します。</p>
 <p><b>🌏 海外組</b>：日本人選手が日本のクラブから海外へ移籍して活躍すると、その古巣の若手が刺激を受けて必ず覚醒します。</p>
 <p><b>💴 資金と能力</b>：海外クラブは日本より資金が潤沢です。日本リーグの選手は能力75前後が上限で、80に届く選手はごく稀です（若手の覚醒は例外）。</p>
 <p><b>📈 育成</b>：若手は試合に出るほど成長。潜在能力が高い選手を「重点育成」に指定すると伸びが速くなります。30歳を過ぎると衰えます。</p>
 <p><b>🏢 理事会</b>：目標を達成すると信頼度が上がり、上位クラブからオファーが届くことも。信頼度が25%未満でシーズンを終えると解任です。</p>
 <p><b>💴 財政</b>：収入は入場料・放映権・賞金。人件費に注意して資金をマイナスにしないように。</p></div>`);}

/* ===== player modal ===== */
function openPlayer(id){const p=P(id);if(!p)return;const own=p.tid===S.team;const t=p.tid?T(p.tid):null;const v=valueOf(p);const st=p.st;
 let h=`<button class="x" onclick="closeModal()">×</button><div class="pcard"><div class="big ${oc(p.ovr)}">${R(p.ovr)}<small>${p.pos}</small></div><div style="flex:1;min-width:0"><h2 style="margin:0 0 3px">${esc(p.name)}</h2><div class="muted" style="font-size:12px">${flag(p)} ${p.age}歳 · ${({GK:'ゴールキーパー',DF:'ディフェンダー',MF:'ミッドフィルダー',FW:'フォワード'})[POS_GROUP[p.pos]]}</div><div class="row" style="margin-top:4px;font-size:12px">${t?badge(t,'s')+' '+esc(t.name):'<span class="muted">フリー（所属なし）</span>'}</div></div></div>
 <div class="kv"><div><small>潜在能力</small><b>${own?p.pot:p.pl+'-'+p.ph}</b></div><div><small>市場価値</small><b>${fmtM(v)}</b></div><div><small>年俸</small><b>${fmtM(p.wage)}</b></div><div><small>契約残り</small><b>${p.tid?p.con+'年':'-'}</b></div><div><small>体力</small><b style="color:${fitColor(p.fit)}">${R(p.fit)}%</b></div><div><small>士気</small><b>${morIcon(p.mor)} ${R(p.mor)}</b></div>
 <div><small>今季 出場/得点/A</small><b>${st.a} / ${st.g} / ${st.as}</b></div><div><small>平均評価</small><b>${st.a?(st.r/st.a).toFixed(2):'-'}</b></div></div>
 ${p.inj?`<div class="warn">🚑 負傷中：残り${p.inj}試合</div>`:''}${p.susp?`<div class="warn">🟥 出場停止：残り${p.susp}試合</div>`:''}`;
 if(p.loan){h+=`<div class="warn" style="background:#10283a;border-color:#1f5a7a;color:#bfe6ff">🔁 ${p.loan.from===S.team?T(p.tid).name+'へレンタル中（シーズン終了後に復帰）':T(p.loan.from).name+'からレンタル'+(own?'加入':'')+'中（シーズン終了まで）'}${p.loan.opt?'<br>買取オプション: '+fmtM(p.loan.opt):''}</div>`;}
 if(own&&p.loan){h+=`<div class="row wrap" style="gap:6px">${p.loan.opt?`<button class="gold" onclick="exerciseOpt(${id})">💴 買取オプション行使（${fmtM(p.loan.opt)}）</button>`:''}${p.age<=23?`<button onclick="toggleFocus(${id})">${p.focus?'重点育成を解除':'📈 重点育成に指定'}</button>`:''}</div>`;}
 else if(p.loan){}
 else if(own){h+=`<div class="row wrap" style="gap:6px">
  <button onclick="toggleList(${id})">${p.list?'売却リストから外す':'💰 売却リストに登録'}</button>
  ${p.age<=23?`<button onclick="toggleFocus(${id})">${p.focus?'重点育成を解除':'📈 重点育成に指定'}</button>`:''}
  <button onclick="renewUI(${id})">📝 契約延長</button>
  ${S.phase==='season'?`<button onclick="loanOutUI(${id})">🔁 レンタルに出す</button>`:''}
  <button class="danger" onclick="releaseP(${id})">即時放出（${fmtM(Math.round(v*.6/100)*100)}）</button></div><div id="pact"></div>`;}
 else{const blocked=S.neg[id]===S.md;h+=`<div id="pact">${blocked?'<div class="warn">この節は交渉を拒否されています。次節以降に再挑戦しましょう。</div>':`<button class="pri" style="width:100%;padding:12px" onclick="offerUI(${id})">${p.tid?'💼 移籍オファーを出す':'✍️ 契約を提示する'}</button>${p.tid&&S.phase==='season'?`<button style="width:100%;padding:11px;margin-top:6px" onclick="loanInUI(${id})">🔁 レンタル移籍を打診</button>`:''}`}</div>`;}
 openModal(h);}
function loanOutUI(id){const p=P(id);if(teamPlayers(S.team).length<=18){$('#pact').innerHTML='<div class="warn">スカッドが18人以下のため、これ以上レンタルに出せません。</div>';return;}
 const cl=loanTargets(p);const opt=Math.round(valueOf(p)*1.2/100)*100;$('#pact').innerHTML=`<div class="card" style="margin-top:10px"><div class="lbl">レンタル先を選択（今季終了まで。年俸は先方が負担）</div><label class="row" style="gap:8px;margin:4px 0 10px;font-size:13px"><input type="checkbox" ${U.lopt?'checked':''} onchange="U.lopt=this.checked"> 買取オプションを付ける（${fmtM(opt)}）</label><p class="muted" style="font-size:12px;margin:-4px 0 8px">付けると、活躍した場合に先方がシーズン終了時に買い取ることがあります。</p>${cl.map(([t,start])=>`<div class="tpick" onclick="doLoanOut(${id},${t.id})">${badge(t)}<div class="nm"><b>${esc(t.name)}</b><small>${start?'<span class="green">先発で起用される見込み</span>':'控えになる可能性あり'}</small></div><span class="stars">${stars(t.rep)}</span></div>`).join('')}</div>`;}
function loanTargets(p){return S.teams.filter(t=>t.id!==S.team).map(t=>{const roles=FORMS[t.form].map(f=>f[0]);const l=autoPick(t.id,t.form).lineup;
 const start=roles.some((r,i)=>{const q=P(l[i]);return!q||effOvr(p,r)>effOvr(q,r);});return[t,start];}).sort((a,b)=>(b[1]-a[1])||(a[0].rep-b[0].rep)).slice(0,4);}
function doLoanOut(id,tid){const p=P(id);p.loan={from:S.team,o0:p.ovr};if(U.lopt)p.loan.opt=Math.round(valueOf(p)*1.2/100)*100;p.tid=tid;p.list=false;p.st={a:p.st.a,g:p.st.g,as:p.st.as,r:p.st.r};
 S.tactics.lineup=S.tactics.lineup.map(x=>x===id?null:x);S.tactics.bench=S.tactics.bench.filter(x=>x!==id);fixUserLineup();
 S.offers=S.offers.filter(o=>o.pid!==id);inbox('レンタル放出: '+p.name,`${p.name}を${T(tid).name}へ今季終了までレンタルに出しました。${p.loan.opt?'買取オプション '+fmtM(p.loan.opt)+' 付き。':''}`);save();closeModal();toast(p.name+'をレンタルに出しました');render();}
function loanInUI(id){const p=P(id);const t=T(p.tid);const fee=Math.max(100,Math.round(valueOf(p)*.08/100)*100);const wd=p.wage;
 if(autoPick(p.tid,t.form).lineup.includes(id)){$('#pact').innerHTML=`<div class="warn">${esc(t.name)}「主力選手なのでレンタルには出せない」</div>`;return;}
 if(teamPlayers(p.tid).length<=18){$('#pact').innerHTML=`<div class="warn">${esc(t.name)}は選手層が薄いためレンタルを拒否しました。</div>`;return;}
 const fee2=Math.round(fee*1.5/100)*100,opt=optPrice(p);
 $('#pact').innerHTML=`<div class="card" style="margin-top:10px"><div class="lbl">${esc(t.name)}がレンタルに応じる条件</div><p>年俸はこちらが全額負担（${fmtM(wd)}）<br><small class="muted">期間は今季終了まで。シーズン後に${esc(t.name)}へ戻ります。</small></p>
 <button class="pri" style="width:100%;margin-bottom:8px" onclick="doLoanIn(${id},${fee},0)">通常レンタル（レンタル料 ${fmtM(fee)}）</button>
 <button class="gold" style="width:100%" onclick="doLoanIn(${id},${fee2},${opt})">買取オプション付き（レンタル料 ${fmtM(fee2)}）</button>
 <p class="muted" style="font-size:12px;margin-top:6px">買取オプション付きなら、レンタル期間中（シーズン終了画面まで）いつでも ${fmtM(opt)} で完全移籍に切り替えられます。</p></div>`;}
const optPrice=p=>Math.round(valueOf(p)*1.1/100)*100;
function exerciseOpt(id){const p=P(id);const me=myTeam();if(!p||!p.loan||!p.loan.opt||p.tid!==S.team)return;const c=p.loan.opt;if(me.budget<c){toast('資金が足りません');return;}
 if(!confirm(fmtM(c)+'で'+p.name+'を完全移籍で獲得しますか？'))return;
 const from=p.loan.from;markMove(p,from,S.team);T(from).budget+=c;me.budget-=c;S.fin.tout+=c;delete p.loan;p.con=p.age<30?4:2;p.wage=wageDemand(p);p.mor=clamp(p.mor+10,0,100);
 inbox('買取オプション行使: '+p.name,`${p.name}を${T(from).name}から完全移籍で獲得しました。移籍金 ${fmtM(c)} / 年俸 ${fmtM(p.wage)}`);save();closeModal();toast(p.name+'を完全移籍で獲得しました');render();}
function doLoanIn(id,fee,opt){const p=P(id);const me=myTeam();if(me.budget<fee){toast('資金が足りません');return;}if(teamPlayers(S.team).length>=32){toast('スカッドが満員です');return;}
 const from=p.tid;T(from).budget+=fee;me.budget-=fee;S.fin.tout+=fee;p.loan={from,o0:p.ovr};if(opt)p.loan.opt=opt;p.tid=S.team;p.mor=75;
 inbox('レンタル加入: '+p.name,`${p.name}が${T(from).name}からレンタルで加入しました（今季終了まで）。レンタル料 ${fmtM(fee)}${opt?'\n買取オプション: '+fmtM(opt)+'（選手画面から行使できます）':''}`);fixUserLineup();save();closeModal();toast(p.name+'をレンタルで獲得しました');render();}
function toggleList(id){const p=P(id);p.list=!p.list;save();openPlayer(id);render();}
function toggleFocus(id){const p=P(id);if(!p.focus&&teamPlayers(S.team).filter(x=>x.focus).length>=3){toast('重点育成は最大3人までです');return;}p.focus=!p.focus;save();openPlayer(id);render();}
function releaseP(id){const p=P(id);if(teamPlayers(S.team).length<=16){toast('スカッドが16人を下回るため放出できません');return;}const fee=Math.round(valueOf(p)*.6/100)*100;
 if(!confirm(p.name+'を'+fmtM(fee)+'で即時売却しますか？'))return;const buyers=S.teams.filter(t=>t.id!==S.team);const b=buyers.filter(t=>t.budget>=fee);sellPlayer(p,pick(b.length?b:buyers).id,fee);closeModal();toast(p.name+'を放出しました');render();}
function renewUI(id){const p=P(id);const w=Math.round(calcWage(p)*1.1/10)*10;
 if(p.mor<30){$('#pact').innerHTML='<div class="warn">士気が低く、延長交渉に応じてくれません。</div>';return;}
 if(p.con>=4){$('#pact').innerHTML='<div class="warn">契約は十分に残っています。</div>';return;}
 $('#pact').innerHTML=`<div class="card" style="margin-top:10px"><div class="lbl">要求年俸 <b class="gold">${fmtM(w)}</b>（現在 ${fmtM(p.wage)}）</div><div class="chips">${[1,2,3,4,5].filter(y=>y>p.con).map(y=>`<button onclick="renew(${id},${y},${w})">${y}年契約</button>`).join('')}</div></div>`;}
function renew(id,y,w){const p=P(id);p.con=y;p.wage=w;p.mor=clamp(p.mor+8,0,100);save();toast(p.name+'と'+y+'年契約を結びました');openPlayer(id);render();}
function offerUI(id){const p=P(id);const v=valueOf(p);const wd=wageDemand(p);const me=myTeam();
 if(p.tid===0){$('#pact').innerHTML=`<div class="card"><div class="lbl">フリーの選手です。移籍金は不要です。</div><p>要求年俸 <b class="gold">${fmtM(wd)}</b> · 契約 ${p.age<30?4:2}年</p><button class="pri" style="width:100%" onclick="doBuy(${id},0)">契約する</button></div>`;return;}
 const mx=Math.max(v*2.5,100);U.offer=Math.round(v/100)*100;
 $('#pact').innerHTML=`<div class="card"><div class="lbl">提示する移籍金</div><div style="font-family:var(--display);font-size:24px;text-align:center" id="ofv">${fmtM(U.offer)}</div>
 <input type="range" min="${Math.round(v*.4/100)*100}" max="${Math.round(mx/100)*100}" step="100" value="${U.offer}" oninput="U.offer=+this.value;$('#ofv').textContent=fmtM(U.offer)">
 <p class="muted" style="font-size:12px">市場価値 ${fmtM(v)} · 予算 ${fmtM(me.budget)} · 獲得後の年俸 ${fmtM(wd)}</p><button class="pri" style="width:100%" onclick="sendOffer(${id})">オファー送信</button><div id="ores"></div></div>`;}
function sendOffer(id){const p=P(id);const fee=U.offer;const me=myTeam();if(me.budget<fee){$('#ores').innerHTML='<div class="warn">資金が足りません</div>';return;}
 if(teamPlayers(p.tid).length<=18){$('#ores').innerHTML='<div class="warn">'+esc(T(p.tid).name)+'は選手層が薄いため放出を拒否しました。</div>';S.neg[id]=S.md;save();return;}
 const ask=askPrice(p);
 if(fee>=ask){$('#ores').innerHTML=`<div class="warn" style="background:#123b25;border-color:var(--acc);color:#c9ffe0">${esc(T(p.tid).name)}がオファーを受諾！ 選手も個人合意しました。</div><button class="pri" style="width:100%" onclick="doBuy(${id},${fee})">契約を完了する</button>`;}
 else if(fee>=ask*.82){U.ng={id,ask,last:fee,r:0};negUI(`${esc(T(p.tid).name)}からカウンターオファー：<b>${fmtM(ask)}</b> なら応じるとのこと。`);}
 else{S.neg[id]=S.md;save();$('#ores').innerHTML=`<div class="warn" style="background:#3a1519;border-color:#7a2630;color:#ffc2c8">${esc(T(p.tid).name)}はオファーを一蹴しました。この節はもう交渉できません。</div>`;}}
function negUI(msg){const n=U.ng;U.offer2=Math.round((n.last+n.ask)/2/100)*100;
 $('#ores').innerHTML=`<div class="warn">${msg}</div><button class="gold" style="width:100%;margin-bottom:8px" onclick="doBuy(${n.id},${n.ask})">${fmtM(n.ask)}で合意する</button>
 <div class="card" style="margin:0"><div class="lbl">金額を返答する（交渉 ${n.r+1}/3回目）</div><div style="font-family:var(--display);font-size:20px;text-align:center" id="ngv">${fmtM(U.offer2)}</div>
 <input type="range" min="${n.last}" max="${n.ask}" step="100" value="${U.offer2}" oninput="U.offer2=+this.value;$('#ngv').textContent=fmtM(U.offer2)">
 <button style="width:100%" onclick="replyOffer()">この金額で返答</button></div>`;}
function replyOffer(){const n=U.ng;if(!n)return;const p=P(n.id);const v=U.offer2;const me=myTeam();const tn=esc(T(p.tid).name);
 if(me.budget<v){toast('資金が足りません');return;}
 n.r++;const gap=(n.ask-v)/n.ask;
 if(v>=n.ask||gap<=.03||(gap<=.06&&Math.random()<.5)){$('#ores').innerHTML=`<div class="warn" style="background:#123b25;border-color:var(--acc);color:#c9ffe0">${tn}が ${fmtM(v)} で合意！ 選手も個人合意しました。</div><button class="pri" style="width:100%" onclick="doBuy(${n.id},${v})">契約を完了する</button>`;U.ng=null;return;}
 if(n.r>=3||gap>.18){S.neg[n.id]=S.md;save();U.ng=null;$('#ores').innerHTML=`<div class="warn" style="background:#3a1519;border-color:#7a2630;color:#ffc2c8">${tn}「これ以上は話にならない」交渉は決裂しました。この節はもう交渉できません。</div>`;return;}
 n.ask=Math.max(v+100,Math.round((n.ask-(n.ask-v)*rnd(.3,.55))/100)*100);n.last=v;
 negUI(`${tn}「${fmtM(v)}では足りない。${fmtM(n.ask)}までなら下げよう」`);}
function sellNegUI(oid){const o=S.offers.find(x=>x.id===oid);if(!o)return;const p=P(o.pid);U.sv=Math.round(o.fee*1.15/100)*100;
 openModal(`<button class="x" onclick="closeModal()">×</button><h2>${esc(p.name)} の移籍金交渉</h2><p>${esc(T(o.tid).name)}の提示額 <b class="gold">${fmtM(o.fee)}</b>（市場価値 ${fmtM(valueOf(p))}）</p>
 <div class="lbl">希望する移籍金を返答（交渉 ${(o.r||0)+1}/3回目）</div><div style="font-family:var(--display);font-size:22px;text-align:center" id="svv">${fmtM(U.sv)}</div>
 <input type="range" min="${o.fee+100}" max="${Math.round(o.fee*1.8/100)*100}" step="100" value="${U.sv}" oninput="U.sv=+this.value;$('#svv').textContent=fmtM(U.sv)">
 <button class="pri" style="width:100%" onclick="sellReply(${oid})">この金額で返答</button><div id="sres"></div>`);}
function sellReply(oid){const o=S.offers.find(x=>x.id===oid);if(!o)return;const p=P(o.pid);const t=T(o.tid);const v=U.sv;const m=S.inbox.find(x=>x.offer===oid);
 if(!o.max)o.max=Math.round(Math.min(t.budget,o.fee*rnd(1.05,1.35))/100)*100;o.r=(o.r||0)+1;
 if(v<=o.max){if(teamPlayers(S.team).length<=16){toast('スカッドが16人を下回るため売却できません');return;}sellPlayer(p,o.tid,v);if(m)m.done='受諾（'+fmtM(v)+'）';closeModal();toast(t.name+'が'+fmtM(v)+'で合意しました');render();return;}
 if(o.r>=3||v>o.max*1.3){S.offers=S.offers.filter(x=>x.id!==oid);if(m)m.done='決裂';save();closeModal();toast(t.name+'はオファーを取り下げました');render();return;}
 const nf=Math.round(Math.min(o.max,o.fee+(v-o.fee)*rnd(.3,.6))/100)*100;const up=nf>o.fee;o.fee=Math.max(o.fee,nf);save();
 $('#sres').innerHTML=`<div class="warn">${esc(t.name)}「${fmtM(v)}は高すぎる。${up?fmtM(o.fee)+'まで引き上げよう':'今の提示額が限界だ'}」</div><div class="row" style="gap:6px"><button class="sm pri" onclick="acceptOffer(${oid});closeModal()">${fmtM(o.fee)}で受諾</button><button class="sm" onclick="sellNegUI(${oid})">さらに交渉</button></div>`;render();}
function doBuy(id,fee){const p=P(id);const err=buyPlayer(p,fee);if(err){toast(err);return;}closeModal();toast(p.name+'を獲得しました！');render();}

function openModal(h){const m=$('#modal');m.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${h}</div>`;m.hidden=false;m.onclick=closeModal;}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';}

/* ===== live match ===== */
let LM=null;
function startLive(){const c=hardIssues()?fixUserLineup():[];if(c.length)toast('出場できない選手を自動で入れ替えました');
 const ev=userEvent();const[h,a]=ev?ev.tie:myFixture();const M=newMatch(h,a,false,!!(ev&&ev.ko));M.ev=ev?ev.kind:null;M.uk=h===S.team?'h':'a';LM={M,speed:1,paused:false,timer:null,selOut:null,selIn:null};
 lg(M,null,(ev?ev.label+' ':'🏟️ ')+'キックオフ！ '+T(h).name+' vs '+T(a).name,'bold');$('#match').hidden=false;document.body.style.overflow='hidden';renderMatch();tick();}
function tick(){clearTimeout(LM.timer);if(LM.paused||LM.M.done)return;LM.timer=setTimeout(()=>{const M=LM.M;const g=M.h.goals+M.a.goals;stepMinute(M);
 if(M.ht){M.ht=false;LM.paused=true;renderMatch();matchTactics(true);return;}
 renderMatch(M.h.goals+M.a.goals>g);if(M.done){renderMatch();return;}tick();},[320,150,55][LM.speed]);}
function renderMatch(flash){const M=LM.M,H=T(M.h.tid),A=T(M.a.tid);const pos=M.possN?M.possSum/M.possN:.5;
 const feed=M.log.slice().reverse().slice(0,80).map(e=>`<div class="ev ${e.cls}"><span class="t">${e.t}</span><span class="d" style="background:${e.s?T(M[e.s].tid).c1:'transparent'}"></span><span>${esc(e.txt)}</span></div>`).join('');
 let ctl;if(M.done)ctl=`<button class="pri" onclick="matchSummary()">試合結果へ ▶</button>`;
 else ctl=`<button onclick="LM.paused=!LM.paused;renderMatch();tick()">${LM.paused?'▶ 再開':'⏸ 一時停止'}</button><button onclick="LM.speed=(LM.speed+1)%3;renderMatch()">速度 ×${[1,2,4][LM.speed]}</button><button onclick="LM.paused=true;renderMatch();matchTactics(false)">🔄 作戦</button><button onclick="skipMatch()">⏭</button>`;
 $('#match').innerHTML=`<div class="sb ${flash?'flash':''}"><div class="sbr"><div class="sbt">${badge(H,'l')}<span>${esc(H.name)}</span></div><div class="score">${M.h.goals} - ${M.a.goals}<span class="clock">${M.done?'試合終了':M.min?dispMin(M):'0\''}${LM.paused&&!M.done?' ⏸':''}</span></div><div class="sbt">${badge(A,'l')}<span>${esc(A.name)}</span></div></div>
 <div class="possb"><i style="width:${pos*100}%;background:${H.c1}"></i><i style="flex:1;background:${A.c1}"></i></div>
 <div class="mstat"><span>支配率 ${R(pos*100)}% · シュート ${M.h.shots}（枠内${M.h.sot}）</span><span>${M.a.shots}（${M.a.sot}） · ${R(100-pos*100)}%</span></div></div>
 <div class="feed">${feed}</div><div class="mctl">${ctl}</div>`;}
function skipMatch(){const M=LM.M;clearTimeout(LM.timer);LM.paused=false;let g=0;while(!M.done&&g++<200){stepMinute(M);M.ht=false;}renderMatch();}
function matchTactics(isHT){const M=LM.M,k=M.uk,s=M[k];LM.selOut=null;LM.selIn=null;
 const draw=()=>{const pitch=s.lineup.map((sl,i)=>{if(sl.pid==null)return`<div class="subrow" style="opacity:.4"><span class="pos g${POS_GROUP[sl.role]}">${sl.role}</span><span class="nm">（退場/不在）</span></div>`;const p=P(sl.pid);const e=R(s.energy[sl.pid]);
   return`<div class="subrow ${LM.selOut===i?'sel':''}" onclick="LM.selOut=${i};matchTactics.d()"><span class="pos g${POS_GROUP[sl.role]}">${sl.role}</span><span class="nm">${esc(p.short)} ${s.ycl.includes(sl.pid)?'🟨':''}</span><span class="rt ${s.rating[sl.pid]>=7?'hi':s.rating[sl.pid]<5.8?'lo':''}">${s.rating[sl.pid].toFixed(1)}</span><div style="width:46px"><div class="bar"><i style="width:${e}%;background:${fitColor(e)}"></i></div></div></div>`;}).join('');
  const bench=s.bench.map(id=>{const p=P(id);const role=LM.selOut!=null?s.lineup[LM.selOut].role:p.pos;return`<div class="subrow ${LM.selIn===id?'sel':''}" onclick="LM.selIn=${id};matchTactics.d()"><span class="pos g${POS_GROUP[p.pos]}">${p.pos}</span><span class="nm">${esc(p.short)}</span><span class="ovr ${oc(effOvr(p,role))}" style="height:24px;width:30px;font-size:12px">${R(effOvr(p,role))}</span></div>`;}).join('')||'<p class="muted">控えがいません</p>';
  openModal(`<h2>${isHT?'ハーフタイム':'作戦ボード'} <small class="muted" style="font-size:12px">交代枠 残り${s.subs}</small></h2>
  <div class="lbl">戦術スタイル</div><div class="chips" style="margin-bottom:12px">${Object.keys(STY).map(x=>`<button class="${s.style===x?'on':''}" onclick="LM.M['${k}'].style='${x}';lg(LM.M,'${k}','📣 戦術を「${x}」に変更');matchTactics.d()">${x}</button>`).join('')}</div>
  <div class="row" style="align-items:flex-start;gap:8px"><div style="flex:1.2;min-width:0"><div class="lbl">ピッチ（OUT）</div>${pitch}</div><div style="flex:1;min-width:0"><div class="lbl">ベンチ（IN）</div>${bench}</div></div>
  <button class="gold" style="width:100%;margin:8px 0" ${LM.selOut!=null&&LM.selIn!=null&&s.subs>0?'':'disabled'} onclick="userSub()">🔄 交代する</button>
  <button class="pri" style="width:100%;padding:12px" onclick="closeModal();LM.paused=false;renderMatch();tick()">▶ ${isHT?'後半開始':'試合再開'}</button>`);
  $('#modal').onclick=null;};
 matchTactics.d=draw;draw();}
function userSub(){const M=LM.M,k=M.uk,s=M[k];if(LM.selOut==null||LM.selIn==null||s.subs<=0)return;doSub(M,k,LM.selOut,LM.selIn);LM.selOut=null;LM.selIn=null;renderMatch();matchTactics.d();}
function matchSummary(){const M=LM.M;const k=M.uk,s=M[k];const ids=s.played.slice().sort((a,b)=>s.rating[b]-s.rating[a]);
 const all=[...M.h.played.map(id=>[id,M.h.rating[id]]),...M.a.played.map(id=>[id,M.a.rating[id]])].sort((a,b)=>b[1]-a[1]);const motm=all[0];
 const gf=s.goals,ga=M[k==='h'?'a':'h'].goals;
 $('#match').innerHTML=`<div class="sb"><div class="sbr"><div class="sbt">${badge(T(M.h.tid),'l')}<span>${esc(T(M.h.tid).name)}</span></div><div class="score">${M.h.goals} - ${M.a.goals}<span class="clock">${M.pk?`PK ${M.pk[0]}-${M.pk[1]} `+((M.pk[0]>M.pk[1])===(k==='h')?'🎉 勝ち上がり！':'敗退…'):gf>ga?'🎉 勝利！':gf<ga?'敗戦…':'引き分け'}</span></div><div class="sbt">${badge(T(M.a.tid),'l')}<span>${esc(T(M.a.tid).name)}</span></div></div></div>
 <div class="feed"><div class="card"><div class="lbl">得点</div>${M.gl.map(g=>`<div class="row" style="justify-content:${g.k==='h'?'flex-start':'flex-end'}">⚽ ${esc(P(g.pid).name)} <span class="muted">${g.min}</span></div>`).join('')||'<span class="muted">なし</span>'}</div>
 <div class="card"><div class="lbl">⭐ マン・オブ・ザ・マッチ</div><b>${esc(P(motm[0]).name)}</b> <span class="muted">${esc(T(P(motm[0]).tid)?.ab||'')}</span> <span class="rt hi">${motm[1].toFixed(1)}</span></div>
 <div class="card"><div class="lbl">選手評価</div>${ids.map(id=>{const p=P(id);return`<div class="row" style="padding:4px 0;border-top:1px solid var(--line)"><span class="pos g${POS_GROUP[p.pos]}">${p.pos}</span><b style="flex:1">${esc(p.name)}</b>${M.gl.filter(g=>g.pid===id).map(()=>'⚽').join('')}${M.gl.filter(g=>g.ast===id).map(()=>'🅰️').join('')}${s.ycl.includes(id)?'🟨':''}${s.reds.some(r=>r.pid===id)?'🟥':''}${s.injs.some(r=>r[0]===id)?'🚑':''}<span class="rt ${s.rating[id]>=7?'hi':s.rating[id]<5.8?'lo':''}">${s.rating[id].toFixed(1)}</span></div>`;}).join('')}</div></div>
 <div class="mctl"><button class="pri" onclick="finishLive()">続ける ▶</button></div>`;}
function finishLive(){const M=LM.M;LM=null;$('#match').hidden=true;document.body.style.overflow='';if(M.ev){const out=playEvent(M.ev,M);showCupResults(out,false);render();return;}const md=S.md;const out=processMatchday(M);showRoundResults(md,out);render();}
function quickSim(){if(hardIssues()){fixUserLineup();}{const ev=userEvent();if(ev){const out=playEvent(ev.kind,null);showCupResults(out,true);render();return;}}const md=S.md;const out=processMatchday(null);showRoundResults(md,out,true);render();}
function showRoundResults(md,out,showMine){const mr=out.myRes&&out.myRes.r;
 let h=`<button class="x" onclick="closeModal()">×</button><h2>第${md+1}節 結果</h2>`;
 if(S.events&&S.events.length){h+=`<div class="warn" style="background:#2b2410;border-color:var(--gold);color:#ffe9a8;font-weight:700">${S.events.map(esc).join('<br>')}</div>`;S.events=[];save();}
 if(showMine&&mr){const me=mr.h===S.team;const gf=me?mr.hg:mr.ag,ga=me?mr.ag:mr.hg;h+=`<div class="card" style="text-align:center"><div style="font-family:var(--display);font-size:20px">${gf>ga?'🎉 勝利！':gf<ga?'敗戦…':'引き分け'}</div><div class="vs"><div class="side">${badge(T(mr.h))}<span>${esc(T(mr.h).city)}</span></div><div class="score" style="font-size:30px">${mr.hg} - ${mr.ag}</div><div class="side">${badge(T(mr.a))}<span>${esc(T(mr.a).city)}</span></div></div>${mr.gl.map(([m,k,pid])=>`<div style="font-size:12px;text-align:${k==='h'?'left':'right'}">⚽ ${esc(P(pid)?.name||'')} ${m}</div>`).join('')}</div>`;}
 h+=out.res.map(r=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line);${r.h===S.team||r.a===S.team?'background:rgba(61,220,132,.1)':''}"><span style="flex:1;text-align:right;font-size:12px;font-weight:700">${esc(T(r.h).city)}</span>${badge(T(r.h),'s')}<b style="width:52px;text-align:center">${r.hg} - ${r.ag}</b>${badge(T(r.a),'s')}<span style="flex:1;font-size:12px;font-weight:700">${esc(T(r.a).city)}</span></div>`).join('');
 (out.evOut||[]).forEach(o=>{h+=`<div class="lbl" style="margin-top:12px">${evTitle(o)}</div>`+cupResRows(o.res);});
 const tb=table();const pos=tb.findIndex(r=>r.id===S.team)+1;h+=`<p style="text-align:center;margin-top:12px">現在 <b class="gold">${pos}位</b>（勝点${tb[pos-1].pts}）</p><button class="pri" style="width:100%;padding:12px" onclick="closeModal()">${S.phase==='end'?'シーズン総括へ':'OK'}</button>`;
 openModal(h);}

/* ===== init ===== */
load();if(S&&!S.v)S=null;if(S)migrate();render();
</script></body></html>
