<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>全固体への道 〜O西 5ねん戦記〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#000;--fg:#fcfcfc;--dim:#a0a0a0;--y:#f8b800;--r:#f85858;--g:#58d854;--b:#3cbcfc;--p:#f878f8;--o:#fca044;
 --font:"DotGothic16","Hiragino Kaku Gothic StdN","Yu Gothic",monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;image-rendering:pixelated}
body{min-height:100vh;background:#000}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.win{background:#000;border:3px solid #fcfcfc;border-radius:8px;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #000;padding:10px 12px;margin:0 0 12px;position:relative}
.wt{display:inline-block;background:#000;color:var(--fg);padding:0 6px;margin:-22px 0 6px -4px;position:relative;top:-2px;font-size:15px}
button{font-family:var(--font);font-size:15px;cursor:pointer;background:#000;color:var(--fg);border:2px solid #fcfcfc;border-radius:6px;padding:8px 10px;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:#fcfcfc;color:#000;border-color:#fcfcfc}
button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
button.wide{width:100%;margin:6px 0}
.small{font-size:12.5px}.dim{color:var(--dim)}.y{color:var(--y)}.r{color:var(--r)}.g{color:var(--g)}.b{color:var(--b)}.p{color:var(--p)}.o{color:var(--o)}
main{display:block}
.face{width:64px;height:64px;image-rendering:pixelated;border:2px solid #fcfcfc;border-radius:4px;flex:none;background:#203878}
.face.big{width:120px;height:120px}
.status .srow{display:flex;gap:10px;align-items:flex-start}
.nmrow{display:flex;align-items:center;gap:6px}
.nmrow button{padding:0 4px}
.wkrow{display:flex;gap:3px;margin-top:4px}
.wkrow span{flex:1;text-align:center;font-size:11px;border:1px solid #555;padding:1px 0;color:var(--dim)}
.wkrow span.past{opacity:.35}
.wkrow span.now{background:var(--fg);color:#000;border-color:var(--fg)}
.bars{margin-top:8px;font-size:12.5px;line-height:1.9;white-space:nowrap}
.pbar{display:inline-flex;gap:2px;vertical-align:middle;margin:0 4px}
.pbar i{display:inline-block;width:9px;height:10px}
.kv{display:flex;gap:16px;margin-top:4px}
.team{margin-top:4px;line-height:1.6}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;font-size:11px;color:var(--dim)}
.skills b{color:var(--fg)}
.mini{height:5px;background:#222;margin-top:2px}.mini i{display:block;height:100%}
.badge{display:inline-block;font-size:11px;padding:0 5px;border:1px solid currentColor;border-radius:3px;vertical-align:middle}
.badge.o{color:var(--o)}.badge.b{color:var(--b)}.badge.y{color:var(--y)}.badge.r{color:var(--r)}.badge.g{color:var(--g)}
.thead{display:flex;gap:8px;align-items:center}
.sq{display:inline-block;width:12px;height:12px;flex:none;vertical-align:middle}
.thead .sq{width:20px;height:20px}
.targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tbox{flex:1;min-width:120px;border:2px solid #555;border-radius:4px;padding:6px 8px}
.tbox .v{font-size:19px}
.prog{display:flex;gap:4px;margin:8px 0 3px}
.prog span{flex:1;height:8px;background:#333}
.prog span.c{background:var(--fg)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmds .cmd:last-child:nth-child(odd){grid-column:span 2}
.cmd{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:7px 10px 7px 22px;position:relative;border-width:2px}
.cmd:before{content:"▶";position:absolute;left:6px;top:8px;font-size:11px;opacity:0}
.cmd:not(:disabled):hover:before,.cmd:not(:disabled):active:before{opacity:1}
.cmd .ct{font-size:16px}.cmd .cc{font-size:11px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 3px;border-bottom:1px dashed #444;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400}
.num{text-align:right;white-space:nowrap}
.logwrap{max-height:260px;overflow:auto}
.hint{font-size:13px;line-height:1.6;padding:5px 0;border-bottom:1px dashed #444}
.hint:last-child{border-bottom:none}
.hbar{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.hbar .hn{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ht{flex:1;height:9px;background:#222}.hbar .ht i{display:block;height:100%;background:var(--b)}
.hbar .hv{width:34px;text-align:right;color:var(--dim)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:620px;max-height:90vh;max-height:90dvh;overflow:auto;margin:0;padding-top:16px}
.btnrow{display:flex;gap:8px;margin-top:12px}.btnrow button{flex:1}
.sample{border:2px solid #555;border-radius:4px;padding:8px;margin-bottom:8px}
.sample .hd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.prm{margin:5px 0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.seg button{padding:5px 8px;font-size:13px;border-color:#777}
.seg button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;line-height:1.6}
.qopt.right{border-color:var(--g);color:var(--g)}
.qopt.wrong{border-color:var(--r);color:var(--r)}
.tfrow{display:flex;gap:8px}.tfrow .qopt{text-align:center;font-size:17px}
.expl{border:2px dashed #555;border-radius:4px;padding:8px 10px;margin-top:8px;line-height:1.75;font-size:13px}
.res{border:2px solid #555;border-radius:4px;padding:8px 10px;margin-bottom:8px;line-height:1.7}
.big{font-size:22px}
.pill{display:inline-block;padding:0 5px;margin:2px 2px 0 0;border:1px solid #666;font-size:11px}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk .tb{flex:1;min-width:0}
.talk .nm{display:inline-block;border:2px solid var(--fg);padding:0 6px;margin-bottom:4px;font-size:13px}
.talk .tx{line-height:1.9;min-height:3.8em}
.cur{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.oui{font-size:40px;text-align:center;color:var(--y);letter-spacing:4px;animation:shake .4s steps(4) 2;text-shadow:3px 3px 0 #a81000}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;font-size:13px;max-width:92vw;text-align:center}
.title{text-align:center;padding:14px 4px}
.logo{font-size:34px;color:var(--y);text-shadow:4px 4px 0 #a81000;letter-spacing:2px;margin-top:6px}
.sublogo{color:var(--b);margin:4px 0 12px}
.duo{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0 14px}
.vs{color:var(--dim)}
.lead{line-height:1.9;text-align:center}
.bgsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.bgsel button{text-align:left;font-size:13px;line-height:1.5}
.bgsel button.on{background:var(--fg);color:#000}
.bgsel button.on .dim{color:#333}
.endrank{font-size:22px;color:var(--y);margin:6px 0}
svg text{font-family:var(--font)}
@media (max-width:380px){.bars{font-size:11px}.pbar i{width:7px}}
.trow{border-bottom:1px dashed #333;padding:3px 0}
.trow .l1{display:flex;align-items:center;gap:6px}
.trow .l2{display:flex;gap:10px;font-size:12px;padding-left:1.9em;color:#bcbcbc;flex-wrap:wrap}
.trow .rk{width:1.3em;text-align:right;color:#888}
.trow .tname{flex:1;min-width:0;text-align:left;border:none;background:none;padding:4px 2px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.focus .tname{color:#f8b800}
.trow .mem i{font-style:normal}
.trow .up{padding:2px 10px}
.seg button.fit{border-color:#f8b800}
.seg button.fit.on{background:#f8b800;color:#000}
.seg button.task{border-color:#888;border-style:dashed}
</style>

 {f:"denki",q:"Si 負極の 初回 不可逆容量が 大きい 主な 原因は？",c:["表面での 界面相形成と Li の 捕捉","集電箔の 酸化","正極の 溶解","電圧の 低さ"],a:0,e:"体積変化で 新しい表面が出るたびに 界面相ができ、Li が 消費される。SiOx は Li₂O・ケイ酸 Li の生成でも Li を失う。"},
 {f:"denki",t:"tf",q:"直列に つないだ セルの 電圧は 足し算、容量（Ah）は 1 セルと 同じである。",a:true,e:"直列は 電圧が加算、容量は 同じ。並列は 容量が加算、電圧は 同じ。"},
 {f:"denki",t:"tf",q:"Wh は 電荷量の 単位である。",a:false,e:"Wh は エネルギーの単位。電荷量は Ah（または C）。Wh ≈ Ah × 平均電圧。"},
 {f:"denki",t:"tf",q:"低温では 一般に イオン伝導度が 下がり、出力が 低下する。",a:true,e:"イオン伝導は 熱活性化過程なので、温度が下がると 伝導度・反応速度が 落ちる。"},
 {f:"denki",t:"tf",q:"Li 金属負極を 使うと、黒鉛負極より セルの エネルギー密度を 上げられる 可能性がある。",a:true,e:"Li 金属の 理論容量は 約 3860 mAh/g で 黒鉛の 約 10 倍。全固体化の 大きな 動機の 一つ。"},
 {f:"denki",t:"tf",q:"自己放電は 電池を 使わずに 置いておいても 容量が 減っていく 現象である。",a:true,e:"副反応や 微小短絡で 少しずつ 放電が進む。"},
 // 合成・プロセス
 {f:"gosei",q:"Li₃PS₄ ガラスを 熱処理して 得られる 高伝導相は？",c:["β-Li₃PS₄","γ-Li₃PS₄","Li₂S","P₂S₅"],a:0,e:"液相法や ボールミルで 作った 前駆体を 熱処理すると β 相が 得られ、室温で 約 10⁻⁴ S/cm。"},
 {f:"gosei",q:"硫化物電解質の 液相合成で よく 使われる 溶媒は？",c:["THF・アセトニトリル・エタノールなど","水","濃硫酸","液体窒素"],a:0,e:"溶媒の 選択で 中間体の 構造や 粒径が 変わる。水は 加水分解して H₂S が出るので 使えない。"},
 {f:"gosei",q:"湿式スラリー塗工で 硫化物電解質を 使うときの 制約は？",c:["極性の 高い 溶媒・バインダーが 使いにくい","温度を 上げられない","アルミ箔が 使えない","乾燥が 不要"],a:0,e:"硫化物は 極性溶媒と 反応しやすい。トルエン・キシレンなど 低極性溶媒と、それに 溶けるバインダーを 選ぶ。"},
 {f:"gosei",q:"乾式（ドライ）電極プロセスの 主な 利点は？",c:["溶媒の 乾燥工程が 不要で 省エネ・省スペース","膜厚ムラが ゼロに なる","バインダーが 一切 不要","真空が 不要"],a:0,e:"PTFE の フィブリル化などで 結着する。乾燥炉が 要らず、溶媒との 反応も 避けられる。"},
 {f:"gosei",q:"固相反応で 粉末を 粉砕・混合する 主な 目的は？",c:["反応界面を 増やし 拡散距離を 短くする","色を そろえる","重さを 減らす","結晶を 大きくする"],a:0,e:"固相反応は 拡散律速なので、粒子を 細かくし よく混ぜるほど 低温・短時間で 反応が進む。"},
 {f:"gosei",q:"LLZO の 焼結で Li が 揮発すると 生じやすい 相は？",c:["La₂Zr₂O₇（パイロクロア）","Li₂CO₃","LiCl","Li₂S"],a:0,e:"Li 不足で パイロクロア相が 出て 伝導度が 落ちる。Li 過剰仕込みや マザーパウダーで 防ぐ。"},
 {f:"gosei",q:"ホットプレスで 焼結する 利点は？",c:["加圧で 低温でも 高密度に できる","真空が いらない","原料が いらない","結晶が 溶ける"],a:0,e:"加熱と 加圧を 同時に かけて 緻密化を 促す。SPS（放電プラズマ焼結）も 同じ 狙い。"},
 {f:"gosei",q:"ボールミルの 回転数を 上げすぎると 起きやすいのは？",c:["発熱・ポットや ボールからの 不純物混入","反応が まったく 進まない","粉が 大きくなる","Li が 増える"],a:0,e:"エネルギーが 大きすぎると 温度上昇で 分解したり、ZrO₂ などが 摩耗して 混入する。"},
 {f:"gosei",q:"NCM 前駆体の 共沈法で 主に 制御する 条件は？",c:["pH・アンモニア濃度・撹拌","磁場","光の 波長","気圧だけ"],a:0,e:"水酸化物の 共沈で 組成の 均一な 球状 二次粒子を 作る。pH と 錯化剤濃度で 粒径・密度が 決まる。"},
 {f:"gosei",q:"Si ナノ粒子を 炭素で 被覆する 主な 目的は？",c:["電子伝導性の 付与と 体積膨張の 緩和","容量を 下げる","Li を 通さなくする","融点を 下げる"],a:0,e:"炭素層が 導電パスを 保ち、膨張時の 応力や 新生面の 露出を 抑える。"},
 {f:"gosei",q:"SiOx（一酸化ケイ素）負極の 特徴は？",c:["Si より 膨張が 小さいが 初回効率が 低い","Si より 容量が 大きい","Li と 反応しない","作動電圧が 3 V 以上"],a:0,e:"不均化で ナノ Si が SiO₂ マトリクスに 分散し 膨張を 緩和。一方、Li ケイ酸塩の 生成で 初回効率が 下がる。"},
 {f:"gosei",q:"電極の カレンダー（ロールプレス）工程の 目的は？",c:["電極を 圧密して 密度と 接触を 上げる","電極を 乾燥させる","電極を 切断する","電極に 電解液を 入れる"],a:0,e:"空隙を 減らして 体積エネルギー密度と 粒子間接触を 上げる。押しすぎると 粒子割れの 原因。"},
 {f:"gosei",q:"全固体電池の 積層工程で 注意すべき 不良は？",c:["電極の 位置ずれ・端部の 欠け・異物混入","電解液の 液漏れ","ガス発生による 膨れだけ","集電箔の 溶解"],a:0,e:"位置ずれや 端部の 欠けは 短絡の 起点になる。異物は 固体電解質層を 突き破って 短絡を 起こす。"},
 {f:"gosei",q:"量産ラインの 「タクトタイム」とは？",c:["1 個を 生産するのに 割り当てられる 時間","設備の 寿命","材料の 保管期間","検査の 回数"],a:0,e:"需要に 合わせて 何秒に 1 個 作るか。最も遅い 工程（ボトルネック）が ライン全体を 律速する。"},
 {f:"gosei",q:"歩留まり 90 % の 工程を 3 つ 直列に 通すと、全体の 歩留まりは？",c:["約 73 %","90 %","約 81 %","270 %"],a:0,e:"0.9 × 0.9 × 0.9 ≈ 0.729。工程が 増えるほど 各工程の 歩留まりが 効いてくる。"},
 {f:"gosei",t:"tf",q:"硫化物固体電解質は ドライルームでも 取り扱いに 注意が いる。",a:true,e:"露点 −40 ℃ 程度でも わずかに H₂S が出る。より 低露点や 不活性雰囲気が 望ましい。"},
 {f:"gosei",t:"tf",q:"焼成温度は 高ければ 高いほど 良い 材料が できる。",a:false,e:"高すぎると Li の 揮発、粒成長、分解、異相生成が 起きる。最適温度が ある。"},
 {f:"gosei",t:"tf",q:"PTFE は 乾式電極で フィブリル化して バインダーとして 働く。",a:true,e:"せん断で 繊維状に 伸び、粒子を 絡めとって 結着する。"},
 {f:"gosei",t:"tf",q:"ラボで 1 g 作れた 材料は、同じ 条件で そのまま 100 kg 作れる。",a:false,e:"スケールアップでは 熱・物質移動、混合の 均一性、雰囲気管理が 変わるので、条件の 最適化が 必要。"},
 {f:"gosei",t:"tf",q:"SPS（放電プラズマ焼結）は 短時間で 緻密な 焼結体を 得やすい。",a:true,e:"パルス通電と 加圧で 急速に 加熱し、粒成長を 抑えつつ 緻密化できる。"},
 // 計算科学
 {f:"keisan",q:"DFT の 基礎と なる 定理は？",c:["Hohenberg–Kohn 定理","Nernst の 式","Bragg の 法則","Fick の 法則"],a:0,e:"基底状態の 性質は 電子密度で 決まる という 定理。Kohn–Sham 方程式で 実際に 計算する。"},
 {f:"keisan",q:"平面波 DFT で 「カットオフエネルギー」を 上げると？",c:["精度が 上がるが 計算が 重くなる","精度が 下がる","原子が 減る","温度が 上がる"],a:0,e:"基底関数（平面波）の 数が 増える。収束を 確認して 十分な 値を 選ぶ。"},
 {f:"keisan",q:"k 点 サンプリングを 粗くしすぎると？",c:["全エネルギーや 物性が 収束しない","計算が 必ず 止まる","原子が 動かない","温度が 下がる"],a:0,e:"Brillouin ゾーンの 積分が 不正確になる。特に 金属では 細かい メッシュが 必要。"},
 {f:"keisan",q:"MD で 温度を 一定に 保つ 仕組みは？",c:["サーモスタット（Nosé–Hoover など）","バロスタットのみ","k 点","擬ポテンシャル"],a:0,e:"NVT アンサンブルでは サーモスタットで 温度を 制御する。圧力制御は バロスタット。"},
 {f:"keisan",q:"MSD（平均二乗変位）の 時間変化の 傾きから 得られるのは？",c:["拡散係数","バンドギャップ","格子定数","生成熱"],a:0,e:"3 次元では MSD = 6Dt。D から Nernst–Einstein の 式で 伝導度を 見積もる。"},
 {f:"keisan",q:"Nernst–Einstein の 式で 伝導度を 求めるとき 無視されがちな 効果は？",c:["イオン間の 相関（協奏的な 動き）","温度","電荷","濃度"],a:0,e:"トレーサー拡散から 求めた 値は 相関を 含まない。Haven 比で 補正する ことがある。"},
 {f:"keisan",q:"機械学習で 材料を 探索する とき 「能動学習」とは？",c:["不確かな 候補を 優先して 計算・実験し モデルを 更新する","データを 全部 消す","人が すべて 手で 選ぶ","乱数だけで 選ぶ"],a:0,e:"予測の 不確かさが 大きい 点を 狙って 追加データを 取ると、少ない 試行で モデルが 賢くなる。"},
 {f:"keisan",q:"ベイズ最適化で 次の 実験条件を 選ぶ ときに 使う 関数は？",c:["獲得関数（期待改善量など）","損失関数のみ","波動関数","分配関数"],a:0,e:"予測平均と 不確かさの バランスで 「次に 試す 価値」を 評価する。EI・UCB などが 代表的。"},
 {f:"keisan",q:"工程の ボトルネックを 調べる シミュレーションとして 適切なのは？",c:["離散事象シミュレーション","DFT","NEB","XRD 解析"],a:0,e:"ライン上の 部品の 流れ・待ち・設備停止を モデル化し、タクトや 稼働率を 予測する。"},
 {f:"keisan",q:"FEM（有限要素法）で 電池の 拘束治具を 解析すると 分かるのは？",c:["セル面内の 応力・圧力分布","バンドギャップ","イオン伝導度の 温度依存性","結晶構造"],a:0,e:"治具の 剛性や ボルト配置で 面圧に ムラが出る。ムラは 接触不良や 短絡の 原因。"},
 {f:"keisan",q:"「工程能力指数 Cpk」が 示すのは？",c:["規格幅に 対して ばらつきが どれだけ 小さいか","設備の 価格","作業者の 人数","材料の 純度"],a:0,e:"Cpk = min(上限−平均, 平均−下限)/(3σ)。1.33 以上が 目安と されることが 多い。"},
 {f:"keisan",q:"実験計画法（DOE）の 直交表を 使う 利点は？",c:["少ない 実験数で 複数因子の 効果を 評価できる","実験が 不要になる","必ず 最適解が 出る","誤差が ゼロになる"],a:0,e:"因子の 組み合わせを バランスよく 割り付け、主効果を 効率よく 推定する。"},
 {f:"keisan",q:"Li 金属に 対する 電解質の 還元安定性を 計算で 調べる 方法は？",c:["Li と 電解質の 反応エネルギー（相図）を 計算する","XRD を 測る","温度を 下げる","密度を 測る"],a:0,e:"Li と 電解質を 混ぜた ときの 生成物と 反応エネルギーを 相図から 求める。生成物が 電子伝導体なら 分解が 続く。"},
 {f:"keisan",q:"van der Waals 補正（DFT-D など）が 重要な 系は？",c:["層状物質や 分子結晶","単体金属","イオン結晶だけ","気体の 単原子"],a:0,e:"通常の GGA は 分散力を うまく 表せない。黒鉛の 層間距離などで 補正が 効く。"},
 {f:"keisan",q:"計算で 得た 拡散障壁 0.2 eV と 0.4 eV、室温での 跳躍頻度の 比は おおよそ？",c:["約 2400 倍","2 倍","約 10 倍","同じ"],a:0,e:"exp(0.2/0.0257) ≈ 2400。障壁 0.2 eV の 差で 桁違いに 変わる。"},
 {f:"keisan",t:"tf",q:"擬ポテンシャルは 内殻電子の 効果を まとめて 扱い、計算を 軽くする。",a:true,e:"化学結合に 関わる 価電子だけを 明示的に 扱う。PAW 法も 同じ 考え方。"},
 {f:"keisan",t:"tf",q:"シミュレーションの 予測は 実験で 検証しなくても よい。",a:false,e:"モデルには 近似や 前提が ある。予測は 実験で 確かめ、ずれを モデルに フィードバックする。"},
 {f:"keisan",t:"tf",q:"MD の 時間刻みを 大きくしすぎると、エネルギーが 保存されず 計算が 破綻しやすい。",a:true,e:"最も 速い 振動（軽い 原子）を 解像できる 刻みが 必要。Li を 含む 系では 1〜2 fs 程度が 一般的。"},
 {f:"keisan",t:"tf",q:"機械学習モデルは 学習データが 多ければ、偏りが あっても 正しく 外挿できる。",a:false,e:"偏った データで 学習すると 未知の 領域で 予測が 大きく 外れる。外挿には 特に 注意。"},
 {f:"keisan",t:"tf",q:"スーパーセルを 大きくすると、周期境界条件による 欠陥どうしの 相互作用を 減らせる。",a:true,e:"欠陥計算や 拡散計算では、セルサイズの 収束も 確認する。"},

 {f:"hyoka",q:"dQ/dV 解析で 分かることは？",c:["相転移や 反応が 起きる 電位と その 変化","粒径","密度","熱伝導率"],a:0,e:"電圧プラトーが ピークとして 現れ、劣化による ピークの 移動・減少を 追える。"},
 {f:"hyoka",q:"GITT（定電流間欠滴定法）で 主に 求めるのは？",c:["拡散係数と 平衡電位","バンドギャップ","粒径","結晶子サイズ"],a:0,e:"短い パルスと 休止を 繰り返し、電圧の 緩和から 化学拡散係数を 見積もる。"},
 {f:"hyoka",q:"レーザー回折式 粒度分布計で 得られる 代表値 D50 とは？",c:["体積基準で 累積 50 % の 粒径","最大粒径","最小粒径","平均密度"],a:0,e:"メジアン径。凝集体を 測ってしまう ことが あるので 分散条件に 注意。"},
 {f:"hyoka",q:"BET 法で 測るのは？",c:["比表面積","イオン伝導度","結晶構造","電子状態"],a:0,e:"窒素などの ガス吸着量から 表面積を 求める。比表面積が 大きいほど 副反応も 増えやすい。"},

 {f:"hyoka",q:"量産ラインで 全数検査に X 線 CT を 使う 主な 目的は？",c:["内部の 位置ずれ・異物・空隙を 非破壊で 見つける","重さを 測る","電圧を 測る","色を 見る"],a:0,e:"積層の ずれや 異物は 短絡の 原因。抜き取りでは 見逃しが 出る。"},

function sig(v){if(v===0)return"0";const a=Math.abs(v);return a>=100?String(Math.round(v)):a>=10?v.toFixed(1).replace(/\.0$/,""):a>=1?v.toFixed(2).replace(/0$/,"").replace(/\.$/,""):v.toPrecision(2);}
function numChoices(ans,unit){
  const mults=[.5,2,.75,1.33,.1,10,1.5,.67].sort(()=>Math.random()-.5);
  const vals=[ans];
  for(const m of mults){const v=ans*m;if(vals.every(x=>Math.abs(x-v)/Math.max(Math.abs(x),1e-9)>.12))vals.push(v);if(vals.length===4)break;}
  return {c:vals.map(v=>`${sig(v)} ${unit}`),a:0};
}

   const ans=L[2]*96485/(3.6*L[1]);

 {f:"denki",g(){
   const cap=rnd([2,3,4,5,50]),I=rnd([.5,1,1.5,2,6,10]),ans=I/cap;

 {f:"denki",g(){
   const V=rnd([3.2,3.6,3.7,3.85]),Ah=rnd([2.5,3,5,20,50]),ans=V*Ah;

 {f:"keisan",g(){
   const r=rnd([3,5,10,20,50]),ans=8.617e-5*Math.log(r)/(1/298.15-1/358.15);

 {f:"gosei",g(){

   if(k===1){const x=rnd([1.25,1.5,1.75]),ans=7-x;return {q:`計算問題：Li₇₋ₓPS₆₋ₓClₓ で x = ${x} のとき、Li 量は？`,...numChoices(ans,""),e:`S²⁻ を Cl⁻ に置き換えた分だけ Li⁺ が減る。Li = 7 − ${x} = ${ans}。`};}
   const x=rnd([.3,.5,.7]),ans=3-x;return {q:`計算問題：Li₃YCl₆ の Y³⁺ を Zr⁴⁺ で x = ${x} 置換した Li₃₋ₓY₁₋ₓZrₓCl₆ の Li 量は？`,...numChoices(ans,""),e:`Zr⁴⁺ は Y³⁺ より 1 価多いので、その分 Li⁺ が減って空孔になる。Li = 3 − ${x} = ${ans}。`};}},

function addFavor(v){S.favor=clamp(Math.round(S.favor+v),0,100);}

function normPrio(){
  const live=PROJ.filter(p=>unlocked(p)&&!S.P[p.idx].done).map(p=>p.idx);
  S.prio=S.prio.filter(i=>live.includes(i));
  live.forEach(i=>{if(!S.prio.includes(i))S.prio.push(i);});
  if(S.kTheme!==null&&!live.includes(S.kTheme))S.kTheme=null;
  if(S.kTheme!==null)S.prio=[S.kTheme,...S.prio.filter(i=>i!==S.kTheme)];
  S.team.forEach(m=>{if(m.th>=0&&m.th<TASK_BASE&&!live.includes(m.th))m.th=-1;if(m.th>=TASK_BASE&&!S.tasks.some(t=>t.id===m.th))m.th=-1;});
}

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

  if(p.id==="equip")return p.params.map((x,i)=>i===0?{...x,o:doneMaterials().map(id=>PB[id].short)}:x);

function unlocked(p){
  if(p.id==="equip")return S.equipOpen&&doneMaterials().length>0;
  if(p.id==="cequip")return S.P[PB.cell.idx].done;
  if(p.id==="proto")return S.equipIn;

function score(p,v){return v.reduce((a,x,j)=>a*Math.min(1.4,x/p.metrics[j].t),1);}
function bestOf(p){
  const ps=params(p);let best=null,bs=-1;
  const rec=(k,c)=>{if(k===ps.length){const s=score(p,p.calc(c).v);if(s>bs){bs=s;best=c.slice();}return;}for(let i=0;i<ps[k].o.length;i++){c[k]=i;rec(k+1,c);}};
  rec(0,[]);return best;
}
function failProb(ms){
  let pf=.24*(1-(ms?ms.s:S.sk.gosei)/110)+Math.max(0,60-(ms?ms.mot:avgMot()))/120;
  if(S.flags.wet)pf+=.25;
  return clamp(pf,.02,.9);
}
// テーマごとの 必要な 知見（ノウハウ）。たまるほど 性能が 出るようになる
const XP_NEED={se:100,cat:160,an:160,sheet:140,cell:260,equip:140,proto:280};
function know(pi){return Math.min(1,(S.P[pi].xp||0)/XP_NEED[PROJ[pi].kind]);}
function measure(pi,c,ms){
  const p=PROJ[pi], r=p.calc(c), s=ms?ms.s:skillAvg(p), kn=know(pi);
  const mA=.9+.12*s/100, mB=.95+.06*s/100;
  const sd=.12*(1-(ms?ms.s:S.sk.hyoka)/130);
  const fail=Math.random()<failProb(ms);
  const notes=r.n.slice();
  const v=r.v.map((x,i)=>{
    let y=x*(i===0?mA:mB)*(1+gauss()*(i===0?sd:sd/3));
    y*=i===0?.7+.3*kn:.85+.15*kn;
    if(fail)y*=i===0?.5:.85;
    const mx=p.metrics[i].max; if(mx)y=Math.min(mx,y);
    return Math.max(0,y);
  });
  if(fail)notes.unshift((ms?ms.mot:avgMot())<50?rnd(["部下の秤量ミス","手順の抜け漏れ","サンプルの取り違え"]):rnd(["合成失敗: 未知の不純物相","ペレットに割れ","雰囲気リークで劣化"]));
  const ok=v.every((x,i)=>x>=p.metrics[i].t);
  S.P[pi].xp=(S.P[pi].xp||0)+(.4+.6*s/100)*(fail?.5:1);
  return {c:c.slice(),v,notes,ok,fail,w:S.w};
}
function ratio(pi){
  const p=PROJ[pi], L=S.P[pi].log; if(!L.length)return 0;
  return Math.max(...L.map(e=>Math.min(...e.v.map((x,i)=>x/p.metrics[i].t))));
}

let AC=null,MUTE=false;

const BGM_SRC={opening:"bgm/opening.mp3",dev:"bgm/dev.mp3",proto:"bgm/proto.mp3",late:"bgm/late.mp3"};
let BGM_EL=null,BGM_KEY=null;
function bgmKey(){if(!S||S.over)return "opening";if(S.w>48*3)return "late";if(S.equipIn||S.cEquipIn)return "proto";return "dev";}
function bgmApply(key){
  if(key)BGM_KEY=key;if(!BGM_KEY)return;
  try{
    if(!BGM_EL){BGM_EL=new Audio();BGM_EL.loop=true;BGM_EL.volume=.35;}
    const src=BGM_SRC[BGM_KEY];
    if(!BGM_EL.src.endsWith(src))BGM_EL.src=src;
    if(MUTE){BGM_EL.pause();return;}
    if(BGM_EL.paused){const p=BGM_EL.play();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}

function tone(f,d,t0,type,vol){
  if(MUTE)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;
    g.gain.value=vol||.04;o.connect(g);g.connect(AC.destination);
    const s=AC.currentTime+(t0||0);o.start(s);g.gain.setValueAtTime(vol||.04,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.stop(s+d+.02);
  }catch(e){}
}

function typeIn(root){
  root.querySelectorAll(".tw").forEach(el=>{
    const html=el.innerHTML;const parts=html.split(/(<[^>]+>)/);let out="",pi=0,ci=0,done=false;
    const step=()=>{if(done)return;let n=2;while(n-->0&&pi<parts.length){const p=parts[pi];if(p.startsWith("<")){out+=p;pi++;continue;}if(ci<p.length){out+=p[ci++];}else{pi++;ci=0;}}el.innerHTML=out+(pi<parts.length?'<span class="cur">▼</span>':"");if(pi<parts.length)setTimeout(step,22);else done=true;};
    el.innerHTML="";step();
    el.closest(".sheet").addEventListener("pointerdown",()=>{if(!done){done=true;el.innerHTML=html;}},{once:true});
  });
}

function autoAssign(){
  normPrio();const top=S.prio.filter(runnable).slice(0,8),cnt={};top.forEach(t=>cnt[t]=0);
  S.team.forEach(m=>{if(!m.rookie)m.th=-1;});
  // 雑務・量産課題に 必要なぶんだけ 先に 人を まわす
  const pool=workers().sort((a,b)=>a.lv-b.lv);
  S.tasks.forEach(t=>{const left=t.need-t.done,wk=Math.max(1,t.due-S.w);let k=Math.min(pool.length,Math.ceil(left/wk*1.3));
    if(t.kind==="issue"){const f=pool.filter(m=>m.sp===t.sp);f.slice(0,k).forEach(m=>{m.th=t.id;pool.splice(pool.indexOf(m),1);k--;});}
    k=Math.max(0,k);pool.slice(0,k).forEach(m=>m.th=t.id);pool.splice(0,k);});
  if(!top.length)return;
  pool.sort((a,b)=>b.lv-a.lv).forEach(m=>{
    let best=top[0],bs=-99;
    top.forEach((t,i)=>{const s=(fits(m,PROJ[t])?2:0)-cnt[t]*.9+(t===S.kTheme?1.5:0)+(top.length-i)*.1;if(s>bs){bs=s;best=t;}});
    m.th=best;cnt[best]++;
  });
  S.team.forEach(m=>{if(m.rookie){const mt=mentorOf(m);m.th=mt?mt.th:top[0];}});
}

// ---------- 室の 自動実験 ----------
function autoCond(pi,m){
  const p=PROJ[pi],P=S.P[pi],ps=params(p),sk=Math.min(100,m.lv+(fits(m,p)?25:0));
  const L=P.log.filter(e=>!e.fail);
  let base=ps.map(pr=>Math.floor(pr.o.length/2));
  if(L.length){const b=L.reduce((a,e)=>score(p,e.v)>score(p,a.v)?e:a);base=b.c.slice();if(b.ok&&Math.random()<.6)return base;}
  Object.keys(P.lit).forEach(k=>{if(Math.random()<.6)base[k]=P.lit[k];});
  const k=Math.floor(Math.random()*ps.length);
  if(Math.random()<sk/250)base[k]=bestOf(p)[k];
  else base[k]=Math.floor(Math.random()*ps[k].o.length);
  return base;
}
function autoRun(){
  S.lastAuto=[];
  if(S.flags.delay)return;
  normPrio();
  const list=isPrepWeek()?S.prio.slice(0,1):S.prio;
  for(const pi of list){
    if(pi===S.flags.directed||S.P[pi].done||!runnable(pi))continue;
    const p=PROJ[pi],P=S.P[pi];let mem=themeMembers(pi).filter(m=>output(m));
    if(isPrepWeek())mem=mem.slice(0,1);
    if(S.slowUntil>S.w)mem=mem.slice(0,Math.ceil(mem.length/2));
    if(!mem.length)continue;
    const a={pi,n:0,ok:0,fail:0,skip:0};
    let bestS=P.log.length?Math.max(...P.log.map(e=>score(p,e.v))):0;
    for(const m of mem){
      if(S.budget<costOf(p)){a.skip=1;break;}
      S.budget-=costOf(p);
      const sk=Math.min(100,m.lv+(fits(m,p)?25:0));
      const r=measure(pi,autoCond(pi,m),{s:sk,mot:m.mot});r.who=m.n;
      P.log.push(r);a.n++;if(r.ok){P.hits++;a.ok++;}if(r.fail)a.fail++;
      const s=score(p,r.v);if(s>bestS*1.02){bestS=s;S.mon.up++;}
      if(Math.random()<.15&&m.lv<90)m.lv++;
    }
    if(a.n){P.acts++;S.mon.samples+=a.n;S.lastAuto.push(a);}
    if(P.hits>=2&&!P.done)completeProj(pi);
    if(S.clear)return;
  }
}

function chartCard(pi){
  const p=PROJ[pi],L=S.P[pi].log; if(L.length<2)return"";
  const W=560,H=140,pad=24;
  const xs=i=>pad+(W-pad-8)*(i/(L.length-1));
  let svg=`<svg viewBox="0 0 ${W} ${H*p.metrics.length}" width="100%" role="img" aria-label="けっかの すいい" shape-rendering="crispEdges">`;
  p.metrics.forEach((m,j)=>{
    const vals=L.map(e=>e.v[j]),mx=Math.max(m.t*1.3,...vals),oy=j*H,ys=v=>oy+H-16-(H-32)*v/mx,col=j?"#3cbcfc":"#58d854";
    svg+=`<text x="${pad}" y="${oy+12}" font-size="13" fill="#bcbcbc">${m.l}（${m.u}）</text>`;
    svg+=`<line x1="${pad}" x2="${W-8}" y1="${ys(m.t)}" y2="${ys(m.t)}" stroke="#f8b800" stroke-dasharray="6 4" stroke-width="2"/><text x="${W-10}" y="${ys(m.t)-4}" font-size="12" text-anchor="end" fill="#f8b800">もくひょう ${m.t}</text>`;
    svg+=`<line x1="${pad}" x2="${W-8}" y1="${oy+H-16}" y2="${oy+H-16}" stroke="#555" stroke-width="2"/>`;
    vals.forEach((v,i)=>{const x=xs(i),y=ys(v);svg+=v>=m.t?`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${col}"/>`:`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="none" stroke="${col}" stroke-width="2"/>`;});
  });
  return`<div class="win"><div class="wt">けっかの すいい</div>${svg}</svg></div>`;
}

function openExp(){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi],ps=params(p),cost=costOf(p);
  const n=Math.min(slots(),Math.floor(S.budget/cost));
  const last=P.log.length?P.log[P.log.length-1].c:ps.map(pr=>Math.floor(pr.o.length/2));
  const sel=Array.from({length:n},(_,i)=>{const c=last.slice();if(i>0){const k=(i-1)%ps.length;c[k]=(c[k]+(i%2?1:ps[k].o.length-1))%ps[k].o.length;}return c;});
  let use=n;
  const draw=sh=>{
    sh.innerHTML=`<div class="wt">じっけん けいかく</div>
    <div class="small dim" style="margin-bottom:8px">O西が 条件を 指示する（このテーマの メンバーは 今週 O西の 計画で 動く）。1 試料 ${cost} 万円。水準数＝O西＋このテーマの メンバー。モチベが ひくいと ミスが ふえる（いまの しっぱい率 ${Math.round(failProb()*100)}%）。${isPrepWeek()?'<br><span class="o">資料作成週：こんしゅうは 1 水準のみ</span>':""}${S.flags.wet?'<br><span class="o">露点 悪化中：しっぱいしやすい</span>':""}</div>
    ${sel.map((c,si)=>`<div class="sample" style="${si>=use?"opacity:.35":""}"><div class="hd"><b>水準 ${si+1}</b>${si>0&&themeMembers(pi).filter(m=>output(m))[si-1]?`<span class="small dim"> 担当 ${themeMembers(pi).filter(m=>output(m))[si-1].n}</span>`:""}<span style="flex:1"></span>${si>0?`<button class="small" data-tog="${si}">${si<use?"つくらない":"つくる"}</button>`:""}</div>
     ${ps.map((pr,k)=>`<div class="prm"><div class="small dim">${pr.l}</div><div class="seg">${pr.o.map((o,oi)=>`<button data-s="${si}" data-k="${k}" data-o="${oi}" class="${c[k]===oi?"on":""}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    </div>`).join("")}
    <div class="btnrow"><button id="cx">▶ やめる</button><button class="pri" id="go">▶ ${use}水準 つくる（${use*cost}万）</button></div>`;
    sh.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel[+b.dataset.s][+b.dataset.k]=+b.dataset.o;draw(sh);});
    sh.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const si=+b.dataset.tog;use=si<use?si:si+1;draw(sh);});
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelector("#go").onclick=()=>runExp(sel.slice(0,use));
  };
  modal("",draw);
}
function runExp(list){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi];
  S.budget-=list.length*costOf(p); S.soc-=20; P.acts++; S.flags.directed=pi;
  let bestS=P.log.length?Math.max(...P.log.map(e=>score(p,e.v))):0;
  const res=list.map(c=>measure(pi,c));
  S.flags.wet=0;S.flags.extra=0;
  res.forEach(r=>{P.log.push(r);if(r.ok)P.hits++;const s=score(p,r.v);if(s>bestS*1.02){bestS=s;S.mon.up++;}});
  S.mon.samples+=res.length;
  const fails=res.filter(r=>r.fail).length,hit=res.filter(r=>r.ok).length;
  addStress(3+fails*2-(hit?3:0));
  p.skills.forEach(k=>gain(k,.5));gain("hyoka",.3);
  log(`じっけん ${res.length}水準（${p.short}）${hit?`もくひょう達成 ${hit}`:""}${fails?` ミス ${fails}`:""}`);
  const done=P.hits>=2&&!P.done;
  (hit?SFX.ok:fails?SFX.bad:()=>{})();
  pushQ(okModal(`<div class="wt">そくてい けっか</div>${res.map((r,i)=>`<div class="res"><div class="small dim">水準 ${i+1}：${esc(shortCond(p,r.c))}</div>
   ${r.v.map((v,j)=>`<div><span class="small dim">${p.metrics[j].l}</span> <span class="big ${v>=p.metrics[j].t?"g":""}">${fmt(v,p.metrics[j].d)}</span> <span class="small dim">${p.metrics[j].u}</span></div>`).join("")}
   ${r.notes.map(n=>`<span class="pill ${r.fail?"r":""}">${esc(n)}</span>`).join("")}
   ${r.ok?`<div class="g small">★ もくひょう クリア！</div>`:""}</div>`).join("")}`,done?"テーマ達成へ":"つぎの しゅうへ"));
  if(done)completeProj(pi);
  if(S.clear){render();runQ();return;}
  endWeek();
}
function completeProj(pi){
  const p=PROJ[pi],P=S.P[pi];P.done=true;P.doneW=S.w;
  const bonus=Math.max(0,Math.round((22-P.acts)*1.2));
  const r=22+bonus; S.rep+=r; p.skills.forEach(k=>gain(k,3)); S.budget+=100; S.mon.done++; addStress(-15); addMot(10);
  if(p.kind==="se")S.cellSE.push(p.id);
  log(`★「${p.name}」達成！ ひょうか +${r}`);
  pushQ(next=>{SFX.fan();next();});
  let msg=`<b>「${p.name}」達成！</b><br>${P.acts}週ぶんの検討で 再現性まで 確認できたな。ひょうか +${r}、報奨予算 +100 万円。`;
  if(pi===S.kTheme){S.kTheme=null;S.kDone++;addFavor(12);S.rep+=5;msg+=`<br><b class="p">わしが 言うた テーマや。ようやった！</b>（こうかんど +12・ひょうか +5）`;}
  if(P.pat===0&&p.kind!=="proto")msg+=`<br>発表の前に 特許出願も 忘れずにな。`;
  const was=themeMembers(pi).length;
  // 目標達成時の 担当メンバーの 得意分野ごとに 特許の 種が できる
  const inv={};themeMembers(pi).filter(m=>!m.rookie).forEach(m=>{(inv[m.sp]=inv[m.sp]||[]).push(m.n);});
  P.inv=Object.keys(inv).map(sp=>({sp,n:inv[sp].join("・")}));
  if(P.inv.length)msg+=`<br>担当の ${P.inv.map(v=>`${v.n}（${SK[v.sp].n}）`).join("・")}の 知見で、<b>分野別の 特許</b>も 出せるぞ。`;
  if(p.kind!=="equip"&&p.kind!=="cell"&&p.kind!=="proto")msg+=`<br>この 材料は 電極プロト用設備での 検証にも 使えるで。`;
  if(p.kind==="cell")msg+=`<br>次は <b>セルプロト用 設備</b>の 検証や。`;
  if(p.kind==="equip")msg+=`<br><br>設備での 特性検証に 合格や！ あとは <b>${EQ[p.id].n}の 導入（${EQ[p.id].cost} 万円）</b>や。予算を 確保しとけよ。`;
  if(p.kind==="proto"&&!protoDone())msg+=`<br><br>あとは <b>${p.id==="proto"?"セル":"電極"}プロト量産</b>や。両方 そろったら ゴールやで！`;
  normPrio();
  if(S.cur===pi)S.cur=S.prio.length?S.prio[0]:null;
  if(was)msg+=`<br><span class="o">${was} 人の メンバーが 待機に なった。はいちを 見直そう。</span>`;
  if(p.kind==="proto"&&protoDone()){
    S.clear=true;
    pushQ(say("kawaguchi","オウイ！ O西！！<br>電極と セルの プロト量産ライン、見てきたぞ。<br>……ようやった。ほんまに ようやった。"));
    pushQ(say("onishi","ありがとうございます！<br>チームのみんなの おかげです！"));
    pushQ(()=>finishGame(true));
    return;
  }
  pushQ(say("kawaguchi",msg));
  announceUnlocks();
}

function openComp(){
  const p=PROJ[S.cur],ps=params(p);
  const opts=ps.map((pr,k)=>({pr,k})).filter(x=>x.pr.comp);
  modal(`<div class="wt">けいさん スクリーニング</div><div class="small dim" style="margin-bottom:10px">DFT・機械学習ポテンシャルで 候補を くらべる。計算科学スキルが 高いほど 正確（いまの精度 ±${Math.round(18*(1-S.sk.keisan/120))}%）。かさねると 平均されて 精度UP。</div>
   ${opts.map(x=>`<button class="qopt" data-k="${x.k}"><b>${x.pr.comp}</b><br><span class="small dim">${x.pr.l}：${x.pr.o.join(" / ")}</span></button>`).join("")}
   <div class="btnrow"><button id="cx">▶ やめる</button></div>`,sh=>{
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>runComp(+b.dataset.k));
  });
}
function runComp(k){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi],pr=params(p)[k];
  const sd=.18*(1-S.sk.keisan/120), best=bestOf(p);
  const truth=pr.o.map((_,i)=>{const c=best.slice();c[k]=i;return score(p,p.calc(c).v);});
  const mx=Math.max(...truth);
  const pred=truth.map(t=>Math.max(.02,t/mx*(1+gauss()*sd)));
  const prev=P.comp[k];
  P.comp[k]=prev?prev.map((v,i)=>(v+pred[i])/2):pred;
  S.soc-=12; P.acts++; S.mon.comp++; gain("keisan",2); addStress(1);
  log(`けいさん：${pr.comp}`);
  const arr=P.comp[k],m2=Math.max(...arr);
  // 量産・設備・セルは 歩留まりなどの 予測値も 出す（知見が たまるほど 実機に 近づく）
  const fc=["proto","equip","cell"].includes(p.kind)?pr.o.map((_,i)=>{const c=best.slice();c[k]=i;const kn=know(pi);return p.calc(c).v.map((x,j)=>{let y=x*(j===0?.7+.3*kn:.85+.15*kn)*(1+gauss()*sd*.6);const mx=p.metrics[j].max;return Math.max(0,mx?Math.min(mx,y):y);});}):null;
  pushQ(okModal(`<div class="wt">${pr.comp}</div><div class="small dim">${prev?"前回と 平均した。":""}相対スコア（高いほど 有望）</div>
   ${arr.map((v,i)=>`<div class="hbar"><span class="hn">${esc(pr.o[i])}</span><span class="ht"><i style="width:${Math.max(3,v/m2*100)}%"></i></span><span class="hv">${(v*100).toFixed(0)}</span></div>`).join("")}
   ${fc?`<div class="small" style="margin-top:6px"><b>よそく値</b>（ほかの 条件は 最適と 仮定）</div>${fc.map((f,i)=>`<div class="small dim">${esc(pr.o[i])}：${f.map((x,j)=>`${p.metrics[j].l} <b class="${x>=p.metrics[j].t?"g":""}">${fmt(x,p.metrics[j].d)}</b>${p.metrics[j].u}`).join(" ・ ")}</div>`).join("")}`:""}
   <div class="expl">${compComment(p.id,k)}</div>`,"つぎの しゅうへ"));
  endWeek();
}

function pickQ(f){
  const out=[];
  for(let n=0;n<3;n++){
    const fld=f==="mix"||f==="calc"?rnd(SKK):f;
    const gens=GEN.filter(g=>f==="calc"||g.f===fld);
    if(gens.length&&(f==="calc"||Math.random()<.3)){const g=rnd(gens);out.push({...g.g(),f:g.f});continue;}
    const pool=QZ.map((q,i)=>({q,i})).filter(x=>x.q.f===fld&&!out.includes(x.q));
    let fresh=pool.filter(x=>!S.seen[x.i]);
    if(!fresh.length){pool.forEach(x=>delete S.seen[x.i]);fresh=pool;}
    const x=rnd(fresh);S.seen[x.i]=1;out.push(x.q);
  }
  return out;
}
function startQuiz(f){
  S.soc-=10;S.mon.study++;addStress(-2);
  const qs=pickQ(f);let qi=0,correct=0;

  const show=sh=>{
    const q=qs[qi],tf=q.t==="tf";
    const opts=tf?[{k:"t",l:"○ ただしい"},{k:"f",l:"× まちがい"}]:[0,1,2,3].slice(0,q.c.length).sort(()=>Math.random()-.5).map(o=>({k:String(o),l:q.c[o]}));
    const right=tf?(q.a?"t":"f"):String(q.a);
    sh.innerHTML=`<div class="wt">${title} ${qi+1}/3 <span class="badge b">${tf?"○×":q.q.startsWith("計算問題")?"けいさん":"4たく"}</span> <span class="small" style="color:${SK[q.f].c}">${SK[q.f].n}</span></div><div style="line-height:1.8;margin-bottom:6px">${q.q.replace(/^計算問題：/,"")}</div>
     <div class="${tf?"tfrow":""}">${opts.map(o=>`<button class="qopt" data-o="${o.k}">${o.l}</button>`).join("")}</div><div id="ex"></div>`;
    sh.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===right;if(ok)correct++;(ok?SFX.ok:SFX.bad)();
      gain(q.f,ok?3:1);
      sh.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;x.style.opacity=1;if(x.dataset.o===right)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      sh.querySelector("#ex").innerHTML=`<div class="expl"><b class="${ok?"g":"r"}">${ok?"せいかい！":"ざんねん…"}</b> ${q.e}</div><div class="btnrow"><button class="pri" id="nx">▶ ${qi<2?"つぎの もんだい":"けっかへ"}</button></div>`;
      sh.querySelector("#nx").onclick=()=>{qi++;if(qi<3)show(sh);else quizEnd(title,qs,correct);};
    });
  };
  modal("",show);
}
function quizEnd(title,qs,correct){

function claimOf(p,s){
  const base=p.kind==="se"?`${p.sub.split(" ")[0]}を含む固体電解質`:p.kind==="cat"?"全固体電池用正極活物質":p.kind==="an"?"全固体電池用負極":p.kind==="sheet"?"固体電解質シート":p.kind==="cell"?"全固体電池":p.kind==="equip"?"全固体電池用材料の製造装置":"全固体電池の連続製造ライン";
  if(s==="main")return p.kind==="se"?`${base}およびその製造方法`:p.kind==="cat"?"被覆層を有する"+base:p.kind==="an"?`${base}およびその製造方法`:p.kind==="cell"?`${base}およびその製造方法`:p.kind==="proto"?"全固体電池用電極の連続製造方法":base;
  return {gosei:`${base}の製造方法`,keisan:`${base}の設計方法および計算スクリーニング方法`,hyoka:`${base}の評価方法および検査装置`,denki:`${base}を備えた全固体電池およびその充放電制御方法`}[s];

    const ok=Math.random()<e.p;e.st=ok?2:-1;
    if(ok){S.rep+=4;S.budget+=50;log(`とっきょ登録：${PROJ[i].short}（${SK[s].n}）`);}else log(`とっきょ拒絶：${PROJ[i].short}（${SK[s].n}）`);
    pushQ(next=>{(ok?SFX.fan:SFX.bad)();okModal(`<div class="wt">とっきょ 審査けっか</div><div class="res"><span class="sq" style="background:${PROJ[i].col}"></span> ${PROJ[i].short}：${esc(claimOf(PROJ[i],s))}<div class="big ${ok?"g":"r"}" style="margin-top:6px">${ok?"とうろく さてい！":"きょぜつ さてい…"}</div><div class="small dim">${ok?"ひょうか +4・発明報奨金 +50 万円":P.disclosed?"先に学会発表していたことが響いた。":"先行文献との差が認められなかった。"}</div></div>`)(next);});
  }}));
  S.P.forEach((P,i)=>{if(P.pat===1&&S.w-P.patW>=PATENT_WAIT){
    const ok=Math.random()<P.patP;P.pat=ok?2:-1;
    if(ok){S.rep+=10;S.budget+=150;log(`とっきょ登録：${PROJ[i].short}`);}else log(`とっきょ拒絶：${PROJ[i].short}`);
    pushQ(next=>{(ok?SFX.fan:SFX.bad)();okModal(`<div class="wt">とっきょ 審査けっか</div><div class="res"><span class="sq" style="background:${PROJ[i].col}"></span> ${PROJ[i].name}<div class="big ${ok?"g":"r"}" style="margin-top:6px">${ok?"とうろく さてい！":"きょぜつ さてい…"}</div><div class="small dim">${ok?"ひょうか +10・発明報奨金 +150 万円":P.disclosed?"先に学会発表していたことが響いた。":"先行文献との差が認められなかった。"}</div></div>`)(next);});
  }});
  if(S.w>S.TW){pushQ(()=>finishGame(false));render();runQ();return;}
  // 雑務・量産課題・モチベ急降下
  if(S.w>=S.taskNext&&S.tasks.filter(t=>t.kind==="chore").length<3){S.taskNext=S.w+2+Math.floor(Math.random()*3);pushQ(newChore());}
  if((S.equipIn||S.cEquipIn)&&S.w>=S.issueNext&&S.tasks.filter(t=>t.kind==="issue").length<2){S.issueNext=S.w+3+Math.floor(Math.random()*3);pushQ(newIssue());}
  if(S.w>8&&Math.random()<.05){const mc=motCrash();if(mc)pushQ(mc);}
  // 人事
  const hx=hakenExpire();if(hx)pushQ(hx);
  const gr=rookieGrad();if(gr)pushQ(gr);
  announceUnlocks();
  if(S.w>1&&(S.w-1)%48===0)pushQ(rookieJoin());
  else if(S.w>1&&(S.w-1)%24===0)pushQ(careerHire());
  if(wkOf(S.w)===1&&S.w>4){const qc=quitCheck();if(qc)pushQ(qc);const kc=kCheck();if(kc)pushQ(kc);}
  // ストレス爆発
  if(S.stress>=85&&Math.random()<.2)pushQ(tantrum());
  // 部署・社外とのやりとり
  let busy=false;
  if(S.w>=S.egNext){S.egNext=S.w+4+Math.floor(Math.random()*4);if(S.team.length){pushQ(egEvent());busy=true;}}
  if(!busy&&S.w>=S.kNext){S.kNext=S.w+16+Math.floor(Math.random()*12);const ko=kOrder();if(ko){pushQ(ko);busy=true;}}
  if(!busy&&S.w>=S.deptNext){S.deptNext=S.w+5+Math.floor(Math.random()*4);pushQ(deptEvent());busy=true;}
  // K口役員
  if(!busy&&S.w>2&&Math.random()<.17){pushQ(ouiEvent());busy=true;}
  // ランダムイベント
  if(!busy&&Math.random()<.1){
    const pool=EVENTS.filter(e=>!e.cond||e.cond());let x=Math.random()*pool.reduce((a,e)=>a+e.w,0),ev=pool[0];
    for(const e of pool){x-=e.w;if(x<=0){ev=e;break;}}
    if(ev.choice){
      pushQ(next=>modal(`<div class="wt">できごと</div><div class="res">${ev.t}</div>${ev.choice.map((c,i)=>`<button class="qopt" data-i="${i}">▶ ${c.l}</button>`).join("")}`,sh=>sh.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const t=ev.choice[+b.dataset.i].f();log(`${ev.t} → ${t}`);toast(t);next();})));
    }else{
      pushQ(next=>{const t=ev.f();log(`${ev.t}（${t}）`);okModal(`<div class="wt">できごと</div><div class="res">${ev.t}<div class="small dim" style="margin-top:4px">${t}</div></div>`)(next);});
    }
  }
  pushQ(next=>{const r1=rankIdx(),r0=S.lastRank||0;S.lastRank=r1;
    if(r1>r0){SFX.fan();say("kawaguchi",`しょうかく おめでとう！ 今日から <b>${RANKS[r1][1]}</b>だ。毎月の研究予算も 増える。`)(next);}else next();});
  if(wkOf(S.w)===3){addStress(20);pushQ(next=>{toast("資料作成週：実験は 1 水準まで・ストレス +20");next();});}
  if(S.w===S.TW)pushQ(next=>{toast("さいごの 1 しゅう！");next();});
  save();
  render();
  runQ();
}

// ---------- エンディング ----------
function finishGame(clear){
  if(clear){const rem=S.TW-S.w+1;const b=Math.round(rem*.5);S.rep+=b;log(`★ プロト量産 達成！（のこり ${rem} 週ボーナス ひょうか +${b}）`);}
  S.over=true;S.clear=!!clear;save();endScreen();
}
function endScreen(){
  closeModal();
  bgmApply("opening");
  const done=S.P.filter(x=>x.done).length, r=rankIdx();
  const pats=patCount();
  const skillSum=SKK.reduce((a,k)=>a+S.sk[k],0);
  const score=Math.round(S.rep*10+skillSum*2+done*120+pats*80+(S.clear?2000:0)+S.favor*5+S.eg*3+S.kDone*100-S.tantrum*30-S.quits*40);
  let ending;
  if(S.clear)ending=S.tantrum===0&&S.quits===0?"O西は 部下に 一度も 声を 荒げず、ひとりの 転職者も 出さずに プロト量産を なしとげた。チームは 伝説と なった。":S.favor>=80?"K口役員の 後ろ盾を 得て、O西は 量産工場の 立ち上げ責任者に 抜擢された。":"プロト量産 達成！ O西の 名は 全固体電池の 歴史に 刻まれた。";
  else if(S.P[PB.cell.idx].done)ending="セルは 完成したが、量産の 壁は 厚かった。O西の 挑戦は 次の 5 年へ 続く。";
  else if(S.P[PB.ncm.idx].done||S.P[PB.si.idx].done)ending="電解質と 正極の 成果は 高く 評価された。セル化は 次の 世代へ 託される。";
  else if(done>=1)ending="電解質の 開発で 手応えを つかんだ。研究者人生は まだ 始まったばかりだ。";
  else ending="思うような 成果は 出なかったが、多くを 学んだ 5 年間だった。";
  if(S.clear)SFX.fan();
  app.innerHTML=statusWin()+`<main><div class="win" style="text-align:center">
   <div class="logo" style="font-size:24px">${S.clear?"PROTO MASS PRODUCTION!":"GAME OVER"}</div>
   <div class="duo">${face("onishi","big")}${face("kawaguchi","big")}</div>
   <div class="endrank">${RANKS[r][1]} O西</div>
   <div style="line-height:1.9">${ending}</div>
   <div class="targets" style="margin-top:12px">
    <div class="tbox"><div class="small dim">達成テーマ</div><div class="v">${done} / ${PROJ.length}</div></div>
    <div class="tbox"><div class="small dim">登録特許</div><div class="v">${pats} 件</div></div>
    <div class="tbox"><div class="small dim">K口こうかんど</div><div class="v p">${S.favor}</div></div>
    <div class="tbox"><div class="small dim">オウイに応じた</div><div class="v">${S.oui.talk} 回</div></div>
    <div class="tbox"><div class="small dim">部下に あたった</div><div class="v ${S.tantrum?"r":""}">${S.tantrum} 回</div></div>
    <div class="tbox"><div class="small dim">E口かんけい</div><div class="v">${S.eg}</div></div>
    <div class="tbox"><div class="small dim">K口指示 達成</div><div class="v p">${S.kDone} 件</div></div>
    <div class="tbox"><div class="small dim">雑務 期限切れ</div><div class="v ${S.choreMiss?"r":""}">${S.choreMiss} 件</div></div>
    <div class="tbox"><div class="small dim">量産課題 解決</div><div class="v">${S.issueOK} / ${S.issueOK+S.issueNG}</div></div>
    <div class="tbox"><div class="small dim">転職した 部下</div><div class="v ${S.quits?"r":""}">${S.quits} 人</div></div>
    <div class="tbox"><div class="small dim">そうごう スコア</div><div class="v y">${score}</div></div>
   </div></div>
   <div class="win"><div class="wt">テーマべつ</div>${PROJ.map((p,i)=>{const P=S.P[i];return`<div class="hint"><span class="sq" style="background:${p.col}"></span> <b>${p.name}</b> ${P.done?`<span class="badge g">達成 ${cal(P.doneW)}</span>`:P.log.length?`<span class="badge r">未達</span>`:`<span class="badge r">未着手</span>`}${P.pat===2?' <span class="badge y">特許</span>':""}<div class="small dim">試料 ${P.log.length}・発表 ${P.pubs}${P.log.length?`・最高 ${p.metrics.map((m,j)=>fmt(Math.max(...P.log.map(e=>e.v[j])),m.d)+" "+m.u).join(" / ")}`:""}</div></div>`;}).join("")}</div>
   ${histCard()}
   <button class="pri wide" id="again">▶ もういちど あそぶ</button>
  </main>`;
  app.querySelector("#again").onclick=()=>{clearSave();titleScreen();};
  const mu=app.querySelector("#mute");if(mu)mu.onclick=()=>{MUTE=!MUTE;bgmApply();mu.textContent=MUTE?"♪OFF":"♪ON";};
}

titleScreen();
</script></body></html>
