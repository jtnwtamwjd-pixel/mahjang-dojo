<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>全固体への道 〜O西 5ねん戦記〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#000;--fg:#fcfcfc;--dim:#a0a0a0;--y:#f8b800;--r:#f85858;--g:#58d854;--b:#3cbcfc;--p:#f878f8;--o:#fca044;
 --font:"DotGothic16","Hiragino Kaku Gothic StdN","Yu Gothic",monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;image-rendering:pixelated}
body{min-height:100vh;background:#000}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.win{background:#000;border:3px solid #fcfcfc;border-radius:8px;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #000;padding:10px 12px;margin:0 0 12px;position:relative}
.wt{display:inline-block;background:#000;color:var(--fg);padding:0 6px;margin:-22px 0 6px -4px;position:relative;top:-2px;font-size:15px}
button{font-family:var(--font);font-size:15px;cursor:pointer;background:#000;color:var(--fg);border:2px solid #fcfcfc;border-radius:6px;padding:8px 10px;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:#fcfcfc;color:#000;border-color:#fcfcfc}
button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
button.wide{width:100%;margin:6px 0}
.small{font-size:12.5px}.dim{color:var(--dim)}.y{color:var(--y)}.r{color:var(--r)}.g{color:var(--g)}.b{color:var(--b)}.p{color:var(--p)}.o{color:var(--o)}
main{display:block}
.face{width:64px;height:64px;image-rendering:pixelated;border:2px solid #fcfcfc;border-radius:4px;flex:none;background:#203878}
.face.big{width:120px;height:120px}
.status .srow{display:flex;gap:10px;align-items:flex-start}
.nmrow{display:flex;align-items:center;gap:6px}
.nmrow button{padding:0 4px}
.wkrow{display:flex;gap:3px;margin-top:4px}
.wkrow span{flex:1;text-align:center;font-size:11px;border:1px solid #555;padding:1px 0;color:var(--dim)}
.wkrow span.past{opacity:.35}
.wkrow span.now{background:var(--fg);color:#000;border-color:var(--fg)}
.bars{margin-top:8px;font-size:12.5px;line-height:1.9;white-space:nowrap}
.pbar{display:inline-flex;gap:2px;vertical-align:middle;margin:0 4px}
.pbar i{display:inline-block;width:9px;height:10px}
.kv{display:flex;gap:16px;margin-top:4px}
.team{margin-top:4px;line-height:1.6}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;font-size:11px;color:var(--dim)}
.skills b{color:var(--fg)}
.mini{height:5px;background:#222;margin-top:2px}.mini i{display:block;height:100%}
.badge{display:inline-block;font-size:11px;padding:0 5px;border:1px solid currentColor;border-radius:3px;vertical-align:middle}
.badge.o{color:var(--o)}.badge.b{color:var(--b)}.badge.y{color:var(--y)}.badge.r{color:var(--r)}.badge.g{color:var(--g)}
.thead{display:flex;gap:8px;align-items:center}
.sq{display:inline-block;width:12px;height:12px;flex:none;vertical-align:middle}
.thead .sq{width:20px;height:20px}
.targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tbox{flex:1;min-width:120px;border:2px solid #555;border-radius:4px;padding:6px 8px}
.tbox .v{font-size:19px}
.prog{display:flex;gap:4px;margin:8px 0 3px}
.prog span{flex:1;height:8px;background:#333}
.prog span.c{background:var(--fg)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmds .cmd:last-child:nth-child(odd){grid-column:span 2}
.cmd{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:7px 10px 7px 22px;position:relative;border-width:2px}
.cmd:before{content:"▶";position:absolute;left:6px;top:8px;font-size:11px;opacity:0}
.cmd:not(:disabled):hover:before,.cmd:not(:disabled):active:before{opacity:1}
.cmd .ct{font-size:16px}.cmd .cc{font-size:11px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 3px;border-bottom:1px dashed #444;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400}
.num{text-align:right;white-space:nowrap}
.logwrap{max-height:260px;overflow:auto}
.hint{font-size:13px;line-height:1.6;padding:5px 0;border-bottom:1px dashed #444}
.hint:last-child{border-bottom:none}
.hbar{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.hbar .hn{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ht{flex:1;height:9px;background:#222}.hbar .ht i{display:block;height:100%;background:var(--b)}
.hbar .hv{width:34px;text-align:right;color:var(--dim)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:620px;max-height:90vh;max-height:90dvh;overflow:auto;margin:0;padding-top:16px}
.btnrow{display:flex;gap:8px;margin-top:12px}.btnrow button{flex:1}
.sample{border:2px solid #555;border-radius:4px;padding:8px;margin-bottom:8px}
.sample .hd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.prm{margin:5px 0}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.seg button{padding:5px 8px;font-size:13px;border-color:#777}
.seg button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;line-height:1.6}
.qopt.right{border-color:var(--g);color:var(--g)}
.qopt.wrong{border-color:var(--r);color:var(--r)}
.tfrow{display:flex;gap:8px}.tfrow .qopt{text-align:center;font-size:17px}
.expl{border:2px dashed #555;border-radius:4px;padding:8px 10px;margin-top:8px;line-height:1.75;font-size:13px}
.res{border:2px solid #555;border-radius:4px;padding:8px 10px;margin-bottom:8px;line-height:1.7}
.big{font-size:22px}
.pill{display:inline-block;padding:0 5px;margin:2px 2px 0 0;border:1px solid #666;font-size:11px}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk .tb{flex:1;min-width:0}
.talk .nm{display:inline-block;border:2px solid var(--fg);padding:0 6px;margin-bottom:4px;font-size:13px}
.talk .tx{line-height:1.9;min-height:3.8em}
.cur{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.oui{font-size:40px;text-align:center;color:var(--y);letter-spacing:4px;animation:shake .4s steps(4) 2;text-shadow:3px 3px 0 #a81000}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;font-size:13px;max-width:92vw;text-align:center}
.title{text-align:center;padding:14px 4px}
.logo{font-size:34px;color:var(--y);text-shadow:4px 4px 0 #a81000;letter-spacing:2px;margin-top:6px}
.sublogo{color:var(--b);margin:4px 0 12px}
.duo{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0 14px}
.vs{color:var(--dim)}
.lead{line-height:1.9;text-align:center}
.bgsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.bgsel button{text-align:left;font-size:13px;line-height:1.5}
.bgsel button.on{background:var(--fg);color:#000}
.bgsel button.on .dim{color:#333}
.endrank{font-size:22px;color:var(--y);margin:6px 0}
svg text{font-family:var(--font)}
@media (max-width:380px){.bars{font-size:11px}.pbar i{width:7px}}
</style>

}

}

function chartCard(pi){
  const p=PROJ[pi],L=S.P[pi].log; if(L.length<2)return"";

  p.metrics.forEach((m,j)=>{
    const vals=L.map(e=>e.v[j]),mx=Math.max(m.t*1.3,...vals),oy=j*H,ys=v=>oy+H-16-(H-32)*v/mx,col=j?"#3cbcfc":"#58d854";

    svg+=`<line x1="${pad}" x2="${W-8}" y1="${ys(m.t)}" y2="${ys(m.t)}" stroke="#f8b800" stroke-dasharray="6 4" stroke-width="2"/><text x="${W-10}" y="${ys(m.t)-4}" font-size="12" text-anchor="end" fill="#f8b800">もくひょう ${m.t}</text>`;
    svg+=`<line x1="${pad}" x2="${W-8}" y1="${oy+H-16}" y2="${oy+H-16}" stroke="#555" stroke-width="2"/>`;
    vals.forEach((v,i)=>{const x=xs(i),y=ys(v);svg+=v>=m.t?`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${col}"/>`:`<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="none" stroke="${col}" stroke-width="2"/>`;});

  return`<div class="win"><div class="wt">けっかの すいい</div>${svg}</svg></div>`;

function openExp(){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi],ps=params(p),cost=costOf(p);
  const n=Math.min(slots(),Math.floor(S.budget/cost));
  const last=P.log.length?P.log[P.log.length-1].c:ps.map(pr=>Math.floor(pr.o.length/2));
  const sel=Array.from({length:n},(_,i)=>{const c=last.slice();if(i>0){const k=(i-1)%ps.length;c[k]=(c[k]+(i%2?1:ps[k].o.length-1))%ps[k].o.length;}return c;});
  let use=n;
  const draw=sh=>{
    sh.innerHTML=`<div class="wt">じっけん けいかく</div>
    <div class="small dim" style="margin-bottom:8px">1 試料 ${cost} 万円。部下の人数で 1 週の水準数が きまる（新人🔰の 指導役は 半分）。モチベが ひくいと ミスが ふえる（いまの しっぱい率 ${Math.round(failProb()*100)}%）。${isPrepWeek()?'<br><span class="o">資料作成週：こんしゅうは 1 水準のみ</span>':""}${S.flags.wet?'<br><span class="o">露点 悪化中：しっぱいしやすい</span>':""}${S.lendUntil>S.w?'<br><span class="o">部下を 1 人 応援に 出している</span>':""}</div>
    ${sel.map((c,si)=>`<div class="sample" style="${si>=use?"opacity:.35":""}"><div class="hd"><b>水準 ${si+1}</b>${si>0&&workers()[si-1]?`<span class="small dim"> 担当 ${workers()[si-1].n}</span>`:""}<span style="flex:1"></span>${si>0?`<button class="small" data-tog="${si}">${si<use?"つくらない":"つくる"}</button>`:""}</div>
     ${ps.map((pr,k)=>`<div class="prm"><div class="small dim">${pr.l}</div><div class="seg">${pr.o.map((o,oi)=>`<button data-s="${si}" data-k="${k}" data-o="${oi}" class="${c[k]===oi?"on":""}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    </div>`).join("")}
    <div class="btnrow"><button id="cx">▶ やめる</button><button class="pri" id="go">▶ ${use}水準 つくる（${use*cost}万）</button></div>`;
    sh.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel[+b.dataset.s][+b.dataset.k]=+b.dataset.o;draw(sh);});
    sh.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const si=+b.dataset.tog;use=si<use?si:si+1;draw(sh);});
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelector("#go").onclick=()=>runExp(sel.slice(0,use));
  };
  modal("",draw);
}
function runExp(list){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi];
  S.budget-=list.length*costOf(p); S.soc-=20; P.acts++;
  let bestS=P.log.length?Math.max(...P.log.map(e=>score(p,e.v))):0;
  const res=list.map(c=>measure(pi,c));
  S.flags.wet=0;S.flags.extra=0;
  res.forEach(r=>{P.log.push(r);if(r.ok)P.hits++;const s=score(p,r.v);if(s>bestS*1.02){bestS=s;S.mon.up++;}});
  S.mon.samples+=res.length;
  const fails=res.filter(r=>r.fail).length,hit=res.filter(r=>r.ok).length;
  addStress(3+fails*2-(hit?3:0));
  p.skills.forEach(k=>gain(k,.5));gain("hyoka",.3);
  log(`じっけん ${res.length}水準（${p.short}）${hit?`もくひょう達成 ${hit}`:""}${fails?` ミス ${fails}`:""}`);
  const done=P.hits>=2&&!P.done;
  (hit?SFX.ok:fails?SFX.bad:()=>{})();
  pushQ(okModal(`<div class="wt">そくてい けっか</div>${res.map((r,i)=>`<div class="res"><div class="small dim">水準 ${i+1}：${esc(shortCond(p,r.c))}</div>
   ${r.v.map((v,j)=>`<div><span class="small dim">${p.metrics[j].l}</span> <span class="big ${v>=p.metrics[j].t?"g":""}">${fmt(v,p.metrics[j].d)}</span> <span class="small dim">${p.metrics[j].u}</span></div>`).join("")}
   ${r.notes.map(n=>`<span class="pill ${r.fail?"r":""}">${esc(n)}</span>`).join("")}
   ${r.ok?`<div class="g small">★ もくひょう クリア！</div>`:""}</div>`).join("")}`,done?"テーマ達成へ":"つぎの しゅうへ"));
  if(done)completeProj(pi);
  endWeek();
}
function completeProj(pi){
  const p=PROJ[pi],P=S.P[pi];P.done=true;P.doneW=S.w;
  const bonus=Math.max(0,Math.round((22-P.acts)*1.2));
  const r=22+bonus; S.rep+=r; p.skills.forEach(k=>gain(k,3)); S.budget+=100; S.mon.done++; addStress(-15); addMot(10);
  if(p.kind==="se")S.cellSE.push(p.id);
  log(`★「${p.name}」達成！ ひょうか +${r}`);
  pushQ(next=>{SFX.fan();next();});
  let msg=`<b>「${p.name}」達成！</b><br>${P.acts}週ぶんの検討で 再現性まで確認できたな。ひょうか +${r}、報奨予算 +100 万円。`;
  if(P.pat===0&&p.kind!=="proto")msg+=`<br>発表の前に 特許出願も 忘れずにな。`;
  if(p.kind==="se"&&seDone()===NEED_SE)msg+=`<br><br>電解質が ${NEED_SE} つ そろった。<b>正極テーマ</b>と <b>Si 負極テーマ</b>が 解放されたぞ。`;

function openComp(){
  const p=PROJ[S.cur],ps=params(p);
  const opts=ps.map((pr,k)=>({pr,k})).filter(x=>x.pr.comp);
  modal(`<div class="wt">けいさん スクリーニング</div><div class="small dim" style="margin-bottom:10px">DFT・機械学習ポテンシャルで 候補を くらべる。計算科学スキルが 高いほど 正確（いまの精度 ±${Math.round(18*(1-S.sk.keisan/120))}%）。かさねると 平均されて 精度UP。</div>
   ${opts.map(x=>`<button class="qopt" data-k="${x.k}"><b>${x.pr.comp}</b><br><span class="small dim">${x.pr.l}：${x.pr.o.join(" / ")}</span></button>`).join("")}
   <div class="btnrow"><button id="cx">▶ やめる</button></div>`,sh=>{
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>runComp(+b.dataset.k));
  });
}
function runComp(k){
  const pi=S.cur,p=PROJ[pi],P=S.P[pi],pr=params(p)[k];
  const sd=.18*(1-S.sk.keisan/120), best=bestOf(p);
  const truth=pr.o.map((_,i)=>{const c=best.slice();c[k]=i;return score(p,p.calc(c).v);});
  const mx=Math.max(...truth);
  const pred=truth.map(t=>Math.max(.02,t/mx*(1+gauss()*sd)));
  const prev=P.comp[k];
  P.comp[k]=prev?prev.map((v,i)=>(v+pred[i])/2):pred;
  S.soc-=12; P.acts++; S.mon.comp++; gain("keisan",2); addStress(1);
  log(`けいさん：${pr.comp}`);
  const arr=P.comp[k],m2=Math.max(...arr);
  pushQ(okModal(`<div class="wt">${pr.comp}</div><div class="small dim">${prev?"前回と 平均した。":""}相対スコア（高いほど 有望）</div>
   ${arr.map((v,i)=>`<div class="hbar"><span class="hn">${esc(pr.o[i])}</span><span class="ht"><i style="width:${Math.max(3,v/m2*100)}%"></i></span><span class="hv">${(v*100).toFixed(0)}</span></div>`).join("")}
   <div class="expl">${compComment(p.id,k)}</div>`,"つぎの しゅうへ"));
  endWeek();
}

function pickQ(f){
  const out=[];
  for(let n=0;n<3;n++){
    const fld=f==="mix"||f==="calc"?rnd(SKK):f;
    const gens=GEN.filter(g=>f==="calc"||g.f===fld);
    if(gens.length&&(f==="calc"||Math.random()<.3)){const g=rnd(gens);out.push({...g.g(),f:g.f});continue;}
    const pool=QZ.map((q,i)=>({q,i})).filter(x=>x.q.f===fld&&!out.includes(x.q));
    let fresh=pool.filter(x=>!S.seen[x.i]);
    if(!fresh.length){pool.forEach(x=>delete S.seen[x.i]);fresh=pool;}
    const x=rnd(fresh);S.seen[x.i]=1;out.push(x.q);
  }
  return out;
}

     <div class="${tf?"tfrow":""}">${opts.map(o=>`<button class="qopt" data-o="${o.k}">${o.l}</button>`).join("")}</div><div id="ex"></div>`;

  ng:()=>{S.rep=Math.max(0,S.rep-4);addStress(8);return"打ち合わせが こじれた…ひょうか −4";}}
];
const OUTSIDE=["顧客（自動車メーカー）との 技術打ち合わせ","大学との 共同研究 打ち合わせ","装置メーカーとの 仕様打ち合わせ","材料メーカーとの サンプル評価会"];
function deptEvent(){
  const d=DEPTS[S.deptI%DEPTS.length];S.deptI++;
  const topic=d.n==="社外"?rnd(OUTSIDE):`${d.n}と ${d.topic}`;
  const p=clamp(.95-S.stress/100+(S.sk.denki+S.sk.hyoka)/600,.08,.95),ok=Math.random()<p;
  const t=(ok?d.ok:d.ng)();
  const mood=S.stress>=75?"ストレスで つい 口調が きつく なってしまった…":S.stress>=50?"少し イライラが 顔に 出てしまった。":"おちついて 話が できた。";
  log(`${d.n}：${ok?"○":"×"} ${t}`);
  return next=>{(ok?SFX.ok:SFX.bad)();okModal(`<div class="wt">${d.n==="社外"?"社外との やりとり":d.n+"との やりとり"}</div><div class="res">${esc(topic)}<div class="small dim" style="margin-top:4px">ストレス ${S.stress} → ${mood}（成功率 ${Math.round(p*100)}%）</div><div class="${ok?"g":"r"}" style="margin-top:6px">${ok?"○ ":"× "}${t}</div></div>`)(next);};
}
function tantrum(){
  const who=rnd(S.team);
  addMot(-15);addStress(-10);addEg(-8);S.tantrum++;
  log(`ストレスで ${who?who.n:"部下"}に あたってしまった（チームのモチベ −15）`);
  return next=>{SFX.hit();modal(talkHTML("onishi",`なんで こんな ミスするんだ！！<br><span class="small dim">……${who?who.n:"部下"}に きつく あたってしまった。</span><br><span class="r">チームの モチベ −15</span><br><span class="small dim">E口室長の 耳にも 入った…（E口かんけい −8）</span>`)+`<div class="btnrow"><button class="pri" id="ok">▶ つぎへ</button></div>`,sh=>{typeIn(sh);sh.querySelector("#ok").onclick=next;});};
}

// ---------- E口室長・人事 ----------
const EG_EVENTS=[
 {t:who=>`${who}を 2 週間、別プロジェクトの 応援に 出したいんだが…`,
  a:{l:"了承する",d:"E口かんけい UP ／ 2 週間 1 水準 へる",f:()=>{addEg(10);S.lendUntil=S.w+2;return"E口かんけい +10・2 週間 部下が 1 人 応援へ";}},
  b:{l:"ことわる",d:"E口かんけい DOWN",f:()=>{addEg(-12);return"E口かんけい −12";}}},
 {t:()=>"最近 プロジェクトの 進捗が 室に 共有されていないぞ。定例に 顔を 出してくれ。",
  a:{l:"出席して 説明する",d:"E口かんけい UP ／ たいりょく・ストレス",f:()=>{addEg(8);addStress(4);S.soc=Math.max(0,S.soc-10);return"E口かんけい +8・たいりょく −10・ストレス +4";}},
  b:{l:"いそがしいと ことわる",d:"E口かんけい DOWN",f:()=>{addEg(-10);return"E口かんけい −10";}}},
 {t:()=>"部下の 残業が 多すぎる。実験計画を 見直してくれないか。",
  a:{l:"計画を 見直す",d:"E口かんけい・モチベ UP ／ こんしゅう 1 水準 へる",f:()=>{addEg(8);addMot(8);S.lendUntil=Math.max(S.lendUntil||0,S.w+1);return"E口かんけい +8・モチベ +8・こんしゅう 1 水準 へる";}},
  b:{l:"このまま 押しきる",d:"E口かんけい・モチベ DOWN",f:()=>{addEg(-10);addMot(-5);return"E口かんけい −10・モチベ −5";}}},
 {t:who=>`人事評価の 面談だ。${who}について O西の 意見も 聞かせてくれ。`,
  a:{l:"しっかり 推す",d:"E口かんけい・モチベ UP ／ ストレス",f:()=>{addEg(6);addMot(10);addStress(3);return"E口かんけい +6・モチベ +10・ストレス +3";}},
  b:{l:"おまかせ します",d:"E口かんけい 少し DOWN",f:()=>{addEg(-3);return"E口かんけい −3";}}}
];
function egEvent(){
  const ev=rnd(EG_EVENTS),who=(rnd(workers())||{n:"だれか"}).n;
  return next=>{
    modal(talkHTML("boss",`O西、ちょっと いいか。<br>${ev.t(who)}`)+["a","b"].map(k=>`<button class="qopt" data-e="${k}">▶ ${ev[k].l}<br><span class="small dim">${ev[k].d}</span></button>`).join(""),sh=>{
      typeIn(sh);
      sh.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
        let t=ev[b.dataset.e].f();
        if(S.stress>=75){addEg(-5);t+="<br><span class=\"r\">ストレスで 口調が きつくなり E口かんけい −5</span>";}
        log(`E口室長：${ev[b.dataset.e].l}（${t.replace(/<[^>]+>/g,"")}）`);
        okModal(`<div class="wt">E口室長と</div><div class="res">${t}</div>`)(next);
      });
    });
  };
}
function quitProb(m){return Math.min(.35,Math.max(0,(45-S.eg)/150)+Math.max(0,(50-m.mot)/200));}
function quitCheck(){
  const q=S.team.filter(m=>Math.random()<quitProb(m));
  if(!q.length)return null;
  q.forEach(m=>{
    S.team=S.team.filter(x=>x!==m);S.gone.push(m.n);S.quits++;
    if(m.mentee){const r=S.team.find(x=>x.n===m.mentee);m.mentee=null;if(r)assignMentor(r);}
    const mt=S.team.find(x=>x.mentee===m.n);if(mt)mt.mentee=null;
  });
  addStress(8);addEg(-5);
  const names=q.map(m=>m.n).join("・");
  log(`${names}が 転職した…`);
  return next=>{SFX.bad();say("boss",`O西……${names}が 転職すると 言ってきた。<br>${S.eg<45?"私も 正直、君の プロジェクトの 進め方には 思うところが あった。":"モチベーションが 下がっていたようだ。"}<br><span class="r">部下が ${q.length} 人 へった</span>・ストレス +8`)(next);};
}
function assignMentor(r){
  const c=S.team.filter(m=>!m.rookie&&!m.mentee).sort((a,b)=>b.mot-a.mot)[0];
  if(c)c.mentee=r.n;
  return c;
}
function careerHire(){
  const m={n:pickName(),mot:70,career:1};S.team.push(m);S.hires++;
  log(`キャリア入社：${m.n}`);
  return next=>{SFX.fan();say("boss",`今日から うちの室に キャリア入社の <b>${m.n}</b>が 入る。<br>前職でも 電池を やっていた 即戦力だ。<br><span class="g">部下 +1</span>`)(next);};
}
function rookieJoin(){
  const m={n:pickName(),mot:85,rookie:1,until:S.w+48};S.team.push(m);S.rookies++;
  const mt=assignMentor(m);
  log(`新人🔰 ${m.n} 配属（指導役 ${mt?mt.n:"O西"}）`);
  return next=>{SFX.fan();say("boss",`4 月だ。新人の <b>${m.n}</b>🔰が 配属された。<br>まだ ほとんど 何も できないから、${mt?`<b>${mt.n}</b>に 指導役を たのんだ。${mt.n}の 工数は 半分に なるぞ`:"指導役が いないから O西、君が みてくれ。君の 工数が 半分に なる"}。`)(next);};
}
function rookieGrad(){
  const g=S.team.filter(m=>m.rookie&&S.w>=m.until);
  if(!g.length)return null;
  g.forEach(m=>{m.rookie=0;const mt=mentorOf(m);if(mt)mt.mentee=null;});
  const names=g.map(m=>m.n).join("・");
  log(`${names}が 一人前に なった`);
  return next=>{SFX.ok();say("boss",`${names}も 1 年で ずいぶん 成長したな。<br>今日から 一人前の 戦力だ。指導役も おつかれさま。`)(next);};
}

// ---------- 社内報告会 ----------
function monScore(){const m=S.mon;return m.samples*.8+m.up*3+m.done*8+m.pat*4+m.pub*2+m.comp*1+m.study*.5;}
function grade(sc){return sc>=14?{g:"S",r:6,b:60,s:-8}:sc>=8?{g:"A",r:4,b:30,s:-3}:sc>=3.5?{g:"B",r:1,b:0,s:2}:{g:"C",r:-3,b:0,s:10};}
function meeting(){
  const m=S.mon,G=grade(monScore());
  S.rep=Math.max(0,S.rep+G.r);S.budget+=G.b;S.soc=Math.max(5,S.soc-5);addStress(G.s);addEg({S:4,A:2,B:0,C:-4}[G.g]);
  const lines={S:["素晴らしい月だった。事業部長も メモを 取っていたぞ。","この調子だ。"],A:["着実に 進んでいるな。","いい報告だった。次は 再現性を もう一押し。"],B:["まあまあだな。もう少し 水準を 振っても いいんじゃないか。","方向性は 悪くない。来月は 数字で 語ってくれ。"],C:["今月は 何を していたんだ？","正直、厳しい。来月は 巻き返そう。"]}[G.g];
  const q=rnd(["K口役員「それ、量産でも 同じ性能 出るんか？」","品証「原料コストは どれくらい？」","事業部「いつ頃 サンプル出荷 できそう？」","企画部「競合と 比べて 何が 勝ってる？」"]);
  let hint="";
  if((G.g==="S"||G.g==="A")&&S.cur!==null&&!S.P[S.cur].done&&Math.random()<.4){
    const p=PROJ[S.cur],P=S.P[S.cur],ps=params(p),cand=ps.map((_,k)=>k).filter(k=>P.lit[k]===undefined);
    if(cand.length){const k=rnd(cand),b=bestOf(p);P.lit[k]=b[k];hint=`<div class="expl">E口室長「${esc(ps[k].l)}は ${esc(ps[k].o[b[k]])} あたりを 試してみたら どうだ」（ヒントに きろく）</div>`;}
  }
  log(`社内報告会 ${G.g}（ひょうか ${G.r>=0?"+":""}${G.r}）`);
  S.mon=freshMon();
  return next=>{(G.g==="C"?SFX.bad:SFX.ok)();modal(`<div class="wt">げつれい 社内報告会</div>
   <div class="res"><div class="small" style="line-height:1.8">試料 ${m.samples}・最高値更新 ${m.up}・テーマ達成 ${m.done}・特許 ${m.pat}・発表 ${m.pub}・計算 ${m.comp}・勉強 ${m.study}</div>
    <div style="margin-top:6px">ひょうか <span class="big ${G.g==="C"?"r":"y"}">${G.g}</span> <span class="small">ひょうか ${G.r>=0?"+":""}${G.r}${G.b?` ・ よさん +${G.b}万`:""} ・ ストレス ${G.s>=0?"+":""}${G.s}</span></div></div>
   <div class="small dim" style="margin:6px 0">しつぎ：${q}</div>
   ${talkHTML("boss",rnd(lines))}${hint}<div class="btnrow"><button class="pri" id="ok">▶ つぎの つきへ</button></div>`,sh=>{typeIn(sh);sh.querySelector("#ok").onclick=next;});};
}

// ---------- 週送り ----------
function endWeek(){
  if(isMeetWeek())pushQ(meeting());
  S.flags.delay=0;
  S.w++;S.soc=Math.min(100,S.soc+6);addStress(-2);if(S.grantCd>0)S.grantCd--;
  if(S.stress<50)addMot(2);else if(S.stress>=80)addMot(-2);
  if(S.stress>=90){S.soc=Math.max(0,S.soc-8);}
  if(wkOf(S.w)===1){S.budget+=monthlyBudget();addFavor(-1);addEg(-1);if(S.favor<15){S.budget=Math.max(0,S.budget-20);log("K口役員の 機嫌が わるい（予算 −20 万）");}}
  S.P.forEach((P,i)=>{if(P.pat===1&&S.w-P.patW>=PATENT_WAIT){
    const ok=Math.random()<P.patP;P.pat=ok?2:-1;
    if(ok){S.rep+=10;S.budget+=50;log(`とっきょ登録：${PROJ[i].short}`);}else log(`とっきょ拒絶：${PROJ[i].short}`);
    pushQ(next=>{(ok?SFX.fan:SFX.bad)();okModal(`<div class="wt">とっきょ 審査けっか</div><div class="res"><span class="sq" style="background:${PROJ[i].col}"></span> ${PROJ[i].name}<div class="big ${ok?"g":"r"}" style="margin-top:6px">${ok?"とうろく さてい！":"きょぜつ さてい…"}</div><div class="small dim">${ok?"ひょうか +10・発明報奨金 +50 万円":P.disclosed?"先に学会発表していたことが響いた。":"先行文献との差が認められなかった。"}</div></div>`)(next);});
  }});
  if(S.w>S.TW){pushQ(()=>finishGame(false));render();runQ();return;}
  // 人事
  const gr=rookieGrad();if(gr)pushQ(gr);
  if(S.w>1&&(S.w-1)%48===0)pushQ(rookieJoin());
  else if(S.w>1&&(S.w-1)%24===0)pushQ(careerHire());
  if(wkOf(S.w)===1&&S.w>4){const qc=quitCheck();if(qc)pushQ(qc);}
  // ストレス爆発
  if(S.stress>=75&&Math.random()<.3)pushQ(tantrum());
  // 部署・社外とのやりとり
  let busy=false;
  if(S.w>=S.egNext){S.egNext=S.w+6+Math.floor(Math.random()*5);if(S.team.length){pushQ(egEvent());busy=true;}}
  if(!busy&&S.w>=S.deptNext){S.deptNext=S.w+5+Math.floor(Math.random()*4);pushQ(deptEvent());busy=true;}
  // K口役員
  if(!busy&&S.w>2&&Math.random()<.17){pushQ(ouiEvent());busy=true;}
  // ランダムイベント
  if(!busy&&Math.random()<.1){
    const pool=EVENTS.filter(e=>!e.cond||e.cond());let x=Math.random()*pool.reduce((a,e)=>a+e.w,0),ev=pool[0];
    for(const e of pool){x-=e.w;if(x<=0){ev=e;break;}}
    if(ev.choice){
      pushQ(next=>modal(`<div class="wt">できごと</div><div class="res">${ev.t}</div>${ev.choice.map((c,i)=>`<button class="qopt" data-i="${i}">▶ ${c.l}</button>`).join("")}`,sh=>sh.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const t=ev.choice[+b.dataset.i].f();log(`${ev.t} → ${t}`);toast(t);next();})));
    }else{
      pushQ(next=>{const t=ev.f();log(`${ev.t}（${t}）`);okModal(`<div class="wt">できごと</div><div class="res">${ev.t}<div class="small dim" style="margin-top:4px">${t}</div></div>`)(next);});
    }
  }
  pushQ(next=>{const r1=rankIdx(),r0=S.lastRank||0;S.lastRank=r1;
    if(r1>r0){SFX.fan();say("boss",`しょうかく おめでとう！ 今日から <b>${RANKS[r1][1]}</b>だ。毎月の研究予算も 増える。`)(next);}else next();});
  if(wkOf(S.w)===3)pushQ(next=>{toast("こんしゅうは 報告会の 資料作成週（実験は 1 水準まで）");next();});
  if(S.w===S.TW)pushQ(next=>{toast("さいごの 1 しゅう！");next();});
  save();
  render();
  runQ();
}

// ---------- エンディング ----------
function finishGame(clear){
  if(clear){const rem=S.TW-S.w+1;const b=Math.round(rem*.5);S.rep+=b;log(`★ プロト量産 達成！（のこり ${rem} 週ボーナス ひょうか +${b}）`);}
  S.over=true;S.clear=!!clear;save();endScreen();
}
function endScreen(){
  closeModal();
  const done=S.P.filter(x=>x.done).length, r=rankIdx();
  const pats=S.P.filter(x=>x.pat===2).length;
  const skillSum=SKK.reduce((a,k)=>a+S.sk[k],0);
  const score=Math.round(S.rep*10+skillSum*2+done*120+pats*80+(S.clear?2000:0)+S.favor*5+S.eg*3-S.tantrum*30-S.quits*40);
  let ending;
  if(S.clear)ending=S.tantrum===0&&S.quits===0?"O西は 部下に 一度も 声を 荒げず、ひとりの 転職者も 出さずに プロト量産を なしとげた。チームは 伝説と なった。":S.favor>=80?"K口役員の 後ろ盾を 得て、O西は 量産工場の 立ち上げ責任者に 抜擢された。":"プロト量産 達成！ O西の 名は 全固体電池の 歴史に 刻まれた。";
  else if(S.P[PB.cell.idx].done)ending="セルは 完成したが、量産の 壁は 厚かった。O西の 挑戦は 次の 5 年へ 続く。";
  else if(S.P[PB.ncm.idx].done||S.P[PB.si.idx].done)ending="電解質と 正極の 成果は 高く 評価された。セル化は 次の 世代へ 託される。";
  else if(done>=1)ending="電解質の 開発で 手応えを つかんだ。研究者人生は まだ 始まったばかりだ。";
  else ending="思うような 成果は 出なかったが、多くを 学んだ 5 年間だった。";
  if(S.clear)SFX.fan();
  app.innerHTML=statusWin()+`<main><div class="win" style="text-align:center">
   <div class="logo" style="font-size:24px">${S.clear?"PROTO MASS PRODUCTION!":"GAME OVER"}</div>
   <div class="duo">${face("onishi","big")}${face("kawaguchi","big")}</div>
   <div class="endrank">${RANKS[r][1]} O西</div>
   <div style="line-height:1.9">${ending}</div>
   <div class="targets" style="margin-top:12px">
    <div class="tbox"><div class="small dim">達成テーマ</div><div class="v">${done} / ${PROJ.length}</div></div>
    <div class="tbox"><div class="small dim">登録特許</div><div class="v">${pats} 件</div></div>
    <div class="tbox"><div class="small dim">K口こうかんど</div><div class="v p">${S.favor}</div></div>
    <div class="tbox"><div class="small dim">オウイに応じた</div><div class="v">${S.oui.talk} 回</div></div>
    <div class="tbox"><div class="small dim">部下に あたった</div><div class="v ${S.tantrum?"r":""}">${S.tantrum} 回</div></div>
    <div class="tbox"><div class="small dim">E口かんけい</div><div class="v">${S.eg}</div></div>
    <div class="tbox"><div class="small dim">転職した 部下</div><div class="v ${S.quits?"r":""}">${S.quits} 人</div></div>
    <div class="tbox"><div class="small dim">そうごう スコア</div><div class="v y">${score}</div></div>
   </div></div>
   <div class="win"><div class="wt">テーマべつ</div>${PROJ.map((p,i)=>{const P=S.P[i];return`<div class="hint"><span class="sq" style="background:${p.col}"></span> <b>${p.name}</b> ${P.done?`<span class="badge g">達成 ${cal(P.doneW)}</span>`:P.log.length?`<span class="badge r">未達</span>`:`<span class="badge r">未着手</span>`}${P.pat===2?' <span class="badge y">特許</span>':""}<div class="small dim">試料 ${P.log.length}・発表 ${P.pubs}${P.log.length?`・最高 ${p.metrics.map((m,j)=>fmt(Math.max(...P.log.map(e=>e.v[j])),m.d)+" "+m.u).join(" / ")}`:""}</div></div>`;}).join("")}</div>
   ${histCard()}
   <button class="pri wide" id="again">▶ もういちど あそぶ</button>
  </main>`;
  app.querySelector("#again").onclick=()=>{clearSave();titleScreen();};
  const mu=app.querySelector("#mute");if(mu)mu.onclick=()=>{MUTE=!MUTE;mu.textContent=MUTE?"♪OFF":"♪ON";};
}

titleScreen();
</script></body></html>
