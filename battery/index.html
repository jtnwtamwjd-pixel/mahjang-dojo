<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>電池ラボ物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0a1214;--panel:#13201f;--panel2:#1b2c2b;--line:rgba(255,255,255,.11);
  --text:#eef8f5;--muted:#93aba6;--acc:#3ee6b0;--acc2:#29b6f6;--gold:#f7c948;--red:#ff6b6b;--warn:#ffb648;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#123a33 0%,#0a1214 60%) fixed}
button{font-family:var(--body);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:default;transform:none}
button.pri{background:linear-gradient(180deg,#5ff5c4,#1fb98a);color:#03241a;border:none}
button.ghost{background:transparent}
button.sm{padding:6px 9px;font-size:12px;border-radius:8px}
input,select{font-family:var(--body);font-size:15px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
#app{max-width:620px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.ok{color:var(--acc)}.ng{color:var(--red)}.wn{color:var(--warn)}
.top{position:sticky;top:0;z-index:20;background:rgba(10,18,20,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px))}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toprow .sp{flex:1}
.cal{font-family:var(--display);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap;font-size:13px}
.bat{display:inline-block;width:34px;height:15px;border:2px solid #cfe;border-radius:3px;position:relative;vertical-align:middle;margin-right:2px}
.bat:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:#cfe;border-radius:0 2px 2px 0}
.bat i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px;background:var(--acc)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.sk{font-size:11px;color:var(--muted)}
.sk .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:2px}
.sk .bar i{display:block;height:100%;border-radius:3px}
main{flex:1;padding:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px}
.ptitle{display:flex;gap:10px;align-items:center}
.ptitle .ic{font-size:30px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(62,230,176,.14);color:var(--acc);font-weight:800}
.tag.g{background:rgba(247,201,72,.15);color:var(--gold)}
.tag.r{background:rgba(255,107,107,.15);color:var(--red)}
.targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tbox{flex:1;min-width:130px;background:var(--panel2);border-radius:10px;padding:8px}
.tbox .lb{font-size:11px;color:var(--muted)}
.tbox .v{font-family:var(--display);font-size:18px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;border-radius:12px}
.act .e{font-size:24px}.act .t{font-size:13px}.act .c{font-size:10.5px;color:var(--muted);font-weight:500}
.boss{display:flex;gap:10px;align-items:flex-start}
.boss .av{font-size:30px;line-height:1;flex:none}
.boss .bub{background:var(--panel2);border-radius:4px 12px 12px 12px;padding:9px 11px;line-height:1.6;flex:1}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.logwrap{max-height:280px;overflow:auto}
.hint{font-size:12.5px;line-height:1.6;padding:6px 0;border-bottom:1px dashed var(--line)}
.hint:last-child{border-bottom:none}
.hbar{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.hbar .nm{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--acc2);border-radius:4px}
.hbar .vv{width:58px;text-align:right;color:var(--muted);flex:none}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#101b1b;border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:18px;margin-bottom:10px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow button{flex:1}
.sample{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.sample .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prm{margin:6px 0}
.prm .pl{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:6px 9px;font-size:12.5px;border-radius:8px;font-weight:700}
.seg button.on{background:var(--acc);color:#03241a;border-color:var(--acc)}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;line-height:1.5}
.qopt.right{background:rgba(62,230,176,.2);border-color:var(--acc)}
.qopt.wrong{background:rgba(255,107,107,.2);border-color:var(--red)}
.expl{background:var(--panel2);border-radius:10px;padding:10px;margin-top:8px;line-height:1.65;font-size:13px}
.res{background:var(--panel);border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.res .big{font-family:var(--display);font-size:20px}
.pill{display:inline-block;padding:1px 6px;margin:1px;border-radius:6px;background:rgba(255,255,255,.07);font-size:11px}
.title{padding:28px 18px;text-align:center}
.title h1{font-size:34px;line-height:1.2;background:linear-gradient(90deg,#5ff5c4,#29b6f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .lead{line-height:1.8;color:var(--muted);margin:14px 0 20px}
.bgsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.bgsel button{text-align:left;padding:10px;line-height:1.45}
.bgsel button.on{border-color:var(--acc);background:rgba(62,230,176,.12)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;background:#1f3b35;border:1px solid var(--acc);color:var(--text);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:up .2s;max-width:90vw;text-align:center}
.prog{display:flex;gap:6px;margin:8px 0 2px}
.prog span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.prog span.d{background:var(--acc)}.prog span.c{background:var(--gold)}
svg text{font-family:var(--body)}
.endrank{font-family:var(--display);font-size:28px;text-align:center;margin:8px 0;color:var(--gold)}
</style></head><body><div id="app"></div>
<script>
"use strict";
// ===================== データ =====================
const SK = {
  denki:{n:"電気化学",c:"#ffb648"},
  gosei:{n:"材料合成",c:"#3ee6b0"},
  keisan:{n:"計算科学",c:"#29b6f6"},
  hyoka:{n:"評価解析",c:"#c792ea"}
};
const SKK = Object.keys(SK);
const RANKS = [[0,"新人研究員"],[25,"研究員"],[60,"主任研究員"],[110,"チームリーダー"],[170,"グループ長"],[240,"フェロー"]];
const MAXM = 36;
const BG = [
  {id:"chem",n:"化学系（無機合成）",d:"材料合成 +18",sk:{gosei:28}},
  {id:"phys",n:"物理系（計算物性）",d:"計算科学 +18",sk:{keisan:28}},
  {id:"elec",n:"電気系（電気化学）",d:"電気化学 +18",sk:{denki:28}},
  {id:"anal",n:"分析系（構造解析）",d:"評価解析 +18",sk:{hyoka:28}}
];
const prod = a => a.reduce((x,y)=>x*y,1);

// 各プロジェクト: calc(c) はスキル・ノイズなしの「真の」性能
const PROJ = [
 {id:"sulf",icon:"🟡",name:"硫化物固体電解質の高伝導化",sub:"アルジロダイト型 Li₇₋ₓPS₆₋ₓClₓ",
  skills:["gosei","hyoka"],cost:20,
  intro:"最初のテーマは硫化物電解質だ。Li₆PS₅Cl を出発点に Cl 量を増やすと伝導度が上がるという話がある。ミリング時間とアニール温度も効くぞ。大気に出すと H₂S が出るから、グローブボックスの露点には気をつけて。",
  params:[
   {k:"x",l:"Cl 量 x",o:["1.0","1.25","1.5","1.75","2.0"],comp:"AIMD 伝導度予測"},
   {k:"mill",l:"ボールミル時間",o:["2 h","5 h","10 h","20 h","40 h"]},
   {k:"ann",l:"アニール温度",o:["なし","300℃","430℃","550℃","600℃"]}
  ],
  metrics:[{l:"イオン伝導度 (25℃)",u:"mS/cm",t:6,d:2}],
  best:[2,3,3],
  calc(c){
   const fx=[.55,.8,1,.9,.6][c[0]], fm=[.35,.7,.95,1,.85][c[1]], fa=[.25,.5,.8,1,.72][c[2]];
   const n=[];
   if(c[0]===4)n.push("XRD: LiCl の不純物ピーク");
   if(c[1]===0)n.push("XRD: 未反応 Li₂S が残存");
   if(c[1]===4)n.push("ZrO₂ ボール由来のコンタミ");
   if(c[2]===0)n.push("XRD: 非晶質ハロー（ガラス）");
   if(c[2]===4)n.push("組成ずれ（S・P の揮発）");
   if(c[0]===2&&c[2]===3)n.push("Raman: PS₄³⁻ 420 cm⁻¹ が鋭い");
   return {v:[10.5*fx*fm*fa],n};
  }},
 {id:"oxcl",icon:"🟣",name:"酸塩化物電解質の開発",sub:"UCl₃ 型 LaCl₃ への Li・ドーパント・O の固溶",
  skills:["gosei","keisan"],cost:20,
  intro:"次は君の得意分野かもしれない。LaCl₃ の 1 次元チャネルを Li が走る酸塩化物系だ。La サイトに何を入れるか、O をどれだけ入れるか。O を入れすぎると LaOCl が出る。DFT で固溶エネルギーを見てから合成すると近道だぞ。",
  params:[
   {k:"dop",l:"La サイト ドーパント",o:["なし（Li のみ）","Sr","Zr","Hf","Ta"],comp:"DFT 固溶エネルギー"},
   {k:"o",l:"O / ドーパント比",o:["0","0.4","0.8","1.6","2.4"],comp:"DFT O 配置エネルギー"},
   {k:"syn",l:"合成法",o:["固相焼成 500℃","遊星ボールミル","ミル＋アニール 250℃","溶融急冷"]}
  ],
  metrics:[{l:"イオン伝導度 (25℃)",u:"mS/cm",t:2.0,d:2}],
  best:[4,2,2],
  calc(c){
   const fd=[.35,.4,.62,.66,.68][c[0]];
   let fo; const n=[];
   if(c[0]===4){ fo=[.92,1.25,1.47,1.38,.62][c[1]]; if(c[1]===4)n.push("XRD: LaOCl が析出（O/Ta > 2）"); if(c[1]===2||c[1]===3)n.push("O が Ta に結合し格子内に保持"); }
   else { fo=[1,.82,.62,.45,.32][c[1]]; if(c[1]>=2)n.push("XRD: LaOCl が析出"); }
   const fs=[.45,.8,1,.65][c[2]];
   if(c[2]===0)n.push("粗大粒・粒界抵抗大");
   if(c[2]===3)n.push("急冷でガラス相が混在");
   if(c[0]===1)n.push("Sr 固溶で Li 空孔が減少");
   return {v:[2.9*fd*fo*fs],n};
  }},
 {id:"ncm",icon:"🔵",name:"全固体用 高 Ni 正極",sub:"LiNi₀.₈Co₀.₁Mn₀.₁O₂（NCM811）の合成と被覆",
  skills:["gosei","denki"],cost:30,
  intro:"電解質ができたら次は正極だ。NCM811 は容量が大きいが、焼成条件を外すと Li/Ni ミキシングが起きる。硫化物と接すると界面で副反応も起きるから、表面コートが鍵になる。容量と寿命の両方を満たしてくれ。",
  params:[
   {k:"temp",l:"焼成温度（O₂ 気流）",o:["700℃","750℃","775℃","800℃","850℃"]},
   {k:"li",l:"Li 過剰量",o:["0 %","2 %","5 %","8 %","12 %"]},
   {k:"coat",l:"表面コート",o:["なし","Al₂O₃","Li₃PO₄","LiNbO₃（薄）","LiNbO₃（厚）"],comp:"DFT 界面反応エネルギー"}
  ],
  metrics:[{l:"放電容量 (0.1C)",u:"mAh/g",t:190,d:0},{l:"100 サイクル維持率",u:"%",t:90,d:1,max:100}],
  best:[2,2,3],
  calc(c){
   const t=c[0],li=c[1],co=c[2],n=[];
   const cap=210*[.82,.95,1,.97,.85][t]*[.9,.96,1,.98,.92][li]*[1,.95,.97,.99,.9][co];
   const ret=97*[.9,.97,1,.98,.9][t]*[.93,.98,1,.97,.92][li]*[.72,.88,.92,1,.98][co];
   if(t===0)n.push("層状構造の結晶性が低い");
   if(t===4)n.push("I(003)/I(104) 低下: Li/Ni ミキシング");
   if(li===0)n.push("Li 欠損");
   if(li===4)n.push("残留 Li₂CO₃/LiOH が界面を劣化");
   if(co===0)n.push("界面抵抗が増大（硫化物と副反応）");
   if(co===4)n.push("被膜が厚く Li 輸送を阻害");
   return {v:[cap,ret],n};
  }},
 {id:"cell",icon:"🔋",name:"全固体電池セル試作",sub:"エネルギー密度と寿命の両立",
  skills:["denki","hyoka"],cost:40,
  intro:"いよいよセル試作だ。これまでの電解質と正極を組み合わせて、事業部が求める 350 Wh/kg・300 サイクル 85 % を達成してほしい。Li 金属負極はエネルギーでは最強だが、拘束圧をかけすぎるとクリープで短絡するぞ。",
  params:[
   {k:"neg",l:"負極",o:["In–Li 合金","黒鉛","Si","Li 金属"]},
   {k:"ratio",l:"正極合材比（活物質:SE）",o:["60:40","70:30","75:25","80:20","85:15"]},
   {k:"pres",l:"拘束圧",o:["1 MPa","5 MPa","10 MPa","50 MPa","100 MPa"]},
   {k:"se",l:"固体電解質",o:["アルジロダイト","酸塩化物","LLZO（酸化物）"]}
  ],
  metrics:[{l:"エネルギー密度",u:"Wh/kg",t:350,d:0},{l:"300 サイクル維持率",u:"%",t:85,d:1,max:100}],
  best:[3,2,2,1],
  calc(c){
   const [ng,ra,pr,se]=c,n=[];
   let E=420*[.55,.72,.9,1][ng]*[.8,.9,.96,1,.9][ra]*[.85,.95,1,1,.98][pr]*[1,.95,.8][se];
   let R=100*[1,.98,.88,.92][ng]*[1,1,.98,.94,.8][ra]*[.7,.9,1,.97,.75][pr]*[.95,1,.85][se];
   if(ng===3&&pr===4){R=0;n.push("Li クリープで内部短絡！");}
   else if(ng===3&&pr===3){R*=.93;n.push("Li の侵入で微小短絡の兆候");}
   if(ng===2&&pr<=1){R*=.85;n.push("Si の体積膨張で接触喪失");}
   if(ra===4)n.push("合材中のイオンパス不足");
   if(pr===0)n.push("界面接触が不十分");
   if(se===2)n.push("LLZO と正極の界面抵抗大");
   if(se===0&&ng===3)n.push("Li/硫化物界面で還元分解");
   if(ng===0)n.push("In–Li は安定だが電圧が下がる");
   return {v:[E,R],n};
  }}
];

// ===================== クイズ =====================
const QZ = [
 // 電気化学
 {f:"denki",q:"黒鉛負極（LiC₆）の理論容量に最も近いのは？",c:["372 mAh/g","3860 mAh/g","170 mAh/g","4200 mAh/g"],a:0,e:"LiC₆ は C₆ あたり Li 1 個。Q = nF/(3.6M) = 96485/(3.6×72.06) ≈ 372 mAh/g。3860 は Li 金属、約 4200 は Si（Li₂₂Si₅ 換算）。"},
 {f:"denki",q:"Li 金属負極の理論容量はおよそ？",c:["3860 mAh/g","372 mAh/g","1000 mAh/g","2000 mAh/g"],a:0,e:"Li のモル質量 6.94 g/mol より 96485/(3.6×6.94) ≈ 3860 mAh/g。"},
 {f:"denki",q:"LiFePO₄ の平均作動電位（vs Li/Li⁺）に最も近いのは？",c:["3.4 V","4.7 V","1.5 V","2.5 V"],a:0,e:"Fe²⁺/Fe³⁺ 酸化還元で約 3.4–3.45 V の平坦な電位。オリビン構造で 2 相反応のため平坦になる。"},
 {f:"denki",q:"LiCoO₂ を 4.2 V まで充電したときの実用容量は？",c:["約 140 mAh/g","約 274 mAh/g","約 372 mAh/g","約 60 mAh/g"],a:0,e:"理論容量は全 Li 脱離で 274 mAh/g だが、構造安定性のため Li₀.₅CoO₂ 付近（約 140 mAh/g）までしか使わない。"},
 {f:"denki",q:"0.5C で満充電するのにかかる時間は（理想的に）？",c:["2 時間","30 分","1 時間","5 時間"],a:0,e:"1C は公称容量を 1 時間で充放電する電流。0.5C はその半分なので 2 時間。"},
 {f:"denki",q:"25℃ で n=1 の反応種の活量が 10 倍になると Nernst 電位はどれだけ変わる？",c:["約 59 mV","約 26 mV","約 118 mV","約 0.5 V"],a:0,e:"ΔE = (RT/nF) ln10 = 0.0257×2.303 ≈ 59 mV。"},

// ===================== 状態 =====================
let S=null;
const SAVEKEY="battery_lab_save_v1";
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVEKEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVEKEY);}catch(e){}}

function newGame(name,bgi){
  const sk={denki:10,gosei:10,keisan:10,hyoka:10};
  Object.assign(sk,BG[bgi].sk);
  S={name:name||"あなた",bg:bgi,month:1,soc:100,budget:300,rep:0,sk,proj:0,
     P:PROJ.map(()=>({log:[],hits:0,done:false,doneM:0,pubs:0,comp:{},lit:{},startM:0})),
     flags:{},seen:{},grantCd:0,hist:[],over:false,lastStudy:"denki"};
  S.P[0].startM=1;
  save();
}
function gain(k,v){S.sk[k]=Math.min(100,Math.round((S.sk[k]+v)*10)/10);}
function rankIdx(){let r=0;RANKS.forEach((x,i)=>{if(S.rep>=x[0])r=i;});return r;}
function rankName(){return RANKS[rankIdx()][1];}
function monthlyBudget(){return 40+15*rankIdx();}
function slots(){return Math.min(5,2+Math.floor(S.sk.gosei/35)+(S.flags.extra?1:0));}
function skillAvg(p){return p.skills.reduce((a,k)=>a+S.sk[k],0)/p.skills.length;}
function ymd(m){const y=Math.floor((m-1)/12)+1, mo=((m-1+3)%12)+1;return `${y}年目 ${mo}月`;}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(v,d){return v.toFixed(d);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function measure(pi,c){
  const p=PROJ[pi], r=p.calc(c), s=skillAvg(p);
  const mA=.9+.12*s/100, mB=.95+.06*s/100;
  const sd=.12*(1-S.sk.hyoka/130);
  let pf=.28*(1-S.sk.gosei/110); if(S.flags.wet)pf+=.25;
  const fail=Math.random()<pf;
  const notes=r.n.slice();
  const v=r.v.map((x,i)=>{
    let y=x*(i===0?mA:mB)*(1+gauss()*(i===0?sd:sd/3));
    if(fail)y*=i===0?.5:.85;
    const mx=p.metrics[i].max; if(mx)y=Math.min(mx,y);
    return Math.max(0,y);
  });
  if(fail)notes.unshift(rnd(["合成失敗: 未知の不純物相","秤量ミスの疑い","ペレットに割れ","雰囲気リークで劣化"]));
  const ok=v.every((x,i)=>x>=p.metrics[i].t);
  return {c:c.slice(),v,notes,ok,fail,m:S.month};
}
function ratio(pi){ // 目標に対する最高到達度
  const p=PROJ[pi], L=S.P[pi].log; if(!L.length)return 0;
  return Math.max(...L.map(e=>Math.min(...e.v.map((x,i)=>x/p.metrics[i].t))));
}

function titleScreen(){
  const sv=load();
  let bgi=0;
  app.innerHTML=`<div class="title">
   <div style="font-size:54px">🔋⚗️</div>
   <h1>電池ラボ物語</h1>
   <div class="lead">電池メーカーの研究所に配属された新人研究員。<br>3 年間で知識を磨き、実験と計算を重ねて<br>次世代の全固体電池を完成させよう。</div>
   ${sv&&!sv.over?`<button class="pri" id="cont" style="width:100%;margin-bottom:10px">つづきから（${ymd(sv.month)}）</button>`:""}
   <div class="card" style="text-align:left">
    <div class="small muted">名前</div>
    <input id="nm" maxlength="10" placeholder="あなた" style="width:100%;margin:4px 0 10px">
    <div class="small muted">出身研究室</div>
    <div class="bgsel">${BG.map((b,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><b>${b.n}</b><br><span class="small muted">${b.d}</span></button>`).join("")}</div>
    <button class="pri" id="start" style="width:100%">はじめから</button>
   </div>
   <div class="small muted" style="line-height:1.7;text-align:left">
   遊び方：毎月 1 つ行動を選びます。<b>勉強</b>でクイズに答えて知識を上げ、<b>計算</b>で有望な条件を予測し、<b>実験</b>で条件を振って目標性能を 2 回出す（再現性確認）とテーマ達成。<b>学会発表</b>や<b>予算申請</b>で評価と予算を稼ぎ、SOC（体力）が減ったら休みましょう。
   </div></div>`;
  app.querySelectorAll(".bgsel button").forEach(b=>b.onclick=()=>{bgi=+b.dataset.i;app.querySelectorAll(".bgsel button").forEach(x=>x.classList.toggle("on",x===b));});
  app.querySelector("#start").onclick=()=>{
    if(sv&&!sv.over&&!confirm("現在のセーブを消して新しく始めますか？"))return;
    newGame(app.querySelector("#nm").value.trim(),bgi);render();
    bossSay(`ようこそ、${esc(S.name)}さん。室長の電井だ。<br>${PROJ[0].intro}`);
  };
  const ct=app.querySelector("#cont"); if(ct)ct.onclick=()=>{S=sv;render();};
}

function topBar(){
  const socC=S.soc>50?"var(--acc)":S.soc>25?"var(--warn)":"var(--red)";
  return `<div class="top"><div class="toprow">
   <span class="cal">${ymd(S.month)}</span><span class="small muted">残り ${MAXM-S.month+1} ヶ月</span><span class="sp"></span>
   <span class="chip" title="SOC（体力）"><span class="bat"><i style="width:${Math.max(0,S.soc)*0.28}px;background:${socC}"></i></span>${Math.round(S.soc)}%</span>
   <span class="chip" style="color:var(--gold)">💴${S.budget}万</span>
   <span class="chip">⭐${S.rep}</span>
  </div>
  <div class="skills">${SKK.map(k=>`<div class="sk">${SK[k].n} <b style="color:#fff">${Math.round(S.sk[k])}</b><div class="bar"><i style="width:${S.sk[k]}%;background:${SK[k].c}"></i></div></div>`).join("")}</div>
  </div>`;
}

function render(){
  closeModal();
  if(S.over){endScreen();return;}
  const pi=S.proj, p=PROJ[pi], P=S.P[pi];
  const allDone=S.P.every(x=>x.done);
  const n=slots(), cost=p.cost;
  const can={
    exp:!allDone&&S.soc>=25&&S.budget>=cost,
    comp:!allDone&&S.soc>=15&&p.params.some(x=>x.comp),
    study:S.soc>=12,
    pub:S.soc>=20&&S.P.some(x=>x.log.length),
    grant:S.soc>=15&&S.grantCd<=0,
    rest:true
  };
  app.innerHTML=topBar()+`<main>
   <div class="card">
    <div class="ptitle"><span class="ic">${allDone?"🏆":p.icon}</span><div style="flex:1">
     <div class="small muted">${rankName()}・テーマ ${allDone?"完了":`${pi+1}/4`}</div>
     <h3 style="margin:2px 0">${allDone?"全テーマ達成！":p.name}</h3>
     ${allDone?"":`<div class="small muted">${p.sub}</div>`}
    </div></div>
    <div class="prog">${PROJ.map((_,i)=>`<span class="${S.P[i].done?"d":i===pi?"c":""}"></span>`).join("")}</div>
    ${allDone?`<div class="small" style="margin-top:8px;line-height:1.6">残りの期間は勉強・発表で評価を上げるか、すぐに最終報告して残り月数ボーナスを受け取れます。</div><button class="pri" id="finish" style="width:100%;margin-top:8px">最終報告へ</button>`:
    `<div class="targets">${p.metrics.map((m,i)=>{const b=P.log.length?Math.max(...P.log.map(e=>e.v[i])):null;return`<div class="tbox"><div class="lb">${m.l}</div><div class="v">${b===null?"—":fmt(b,m.d)} <span class="small muted">/ ${m.t} ${m.u}</span></div><div class="small ${b!==null&&b>=m.t?"ok":"muted"}">最高値 ${b!==null&&b>=m.t?"✓ 目標クリア":""}</div></div>`}).join("")}</div>
    <div class="small" style="margin-top:8px">再現性確認: ${"●".repeat(P.hits)}${"○".repeat(Math.max(0,2-P.hits))} <span class="muted">（同時に全目標を満たした試料 2 つで達成）</span></div>`}
   </div>
   <div class="actions">
    ${actBtn("exp","🧪","実験",`試料${n}つ・${cost}万/個`,can.exp)}
    ${actBtn("comp","💻","計算","SOC −15",can.comp)}
    ${actBtn("study","📚","勉強","SOC −12",can.study)}
    ${actBtn("pub","🎤","学会発表","SOC −20",can.pub)}
    ${actBtn("grant","📝","予算申請",S.grantCd>0?`あと${S.grantCd}ヶ月`:"SOC −15",can.grant)}
    ${actBtn("rest","☕","休養","SOC +45",can.rest)}
   </div>
   <div style="height:12px"></div>
   ${allDone?"":chartCard(pi)+hintCard(pi)+logCard(pi)}
   ${histCard()}
   <div style="text-align:center;margin-top:10px"><button class="ghost sm" id="totitle">タイトルへ</button></div>
  </main>`;
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>({exp:openExp,comp:openComp,study:openStudy,pub:openPub,grant:doGrant,rest:doRest})[b.dataset.act]());
  const f=app.querySelector("#finish"); if(f)f.onclick=()=>{if(confirm("最終報告して 3 年間を締めくくりますか？"))finishGame(true);};
  app.querySelector("#totitle").onclick=()=>{save();titleScreen();};
  save();
}
function actBtn(k,e,t,c,en){return`<button class="act" data-act="${k}" ${en?"":"disabled"}><span class="e">${e}</span><span class="t">${t}</span><span class="c">${c}</span></button>`;}

function shortCond(p,c){return c.map((o,i)=>p.params[i].o[o]).join(" / ");}
function logCard(pi){
  const p=PROJ[pi],L=S.P[pi].log;
  if(!L.length)return`<div class="card"><h3>実験ノート</h3><div class="small muted">まだ実験していません。勉強や計算で当たりをつけてから始めても OK。</div></div>`;
  return`<div class="card"><h3>実験ノート（${L.length} 試料）</h3><div class="logwrap"><table>
   <tr><th>#</th><th>条件</th>${p.metrics.map(m=>`<th style="text-align:right">${m.u}</th>`).join("")}</tr>
   ${L.map((e,i)=>({e,i})).reverse().map(({e,i})=>`<tr><td class="muted">${i+1}</td><td>${esc(shortCond(p,e.c))}${e.notes.length?`<div class="small ${e.fail?"ng":"muted"}">${esc(e.notes[0])}</div>`:""}</td>${e.v.map((v,j)=>`<td class="num ${v>=p.metrics[j].t?"ok":""}">${fmt(v,p.metrics[j].d)}</td>`).join("")}</tr>`).join("")}
  </table></div></div>`;
}
function chartCard(pi){
  const p=PROJ[pi],L=S.P[pi].log; if(L.length<2)return"";
  const W=560,H=150,pad=28;
  const sets=p.metrics.map((m,j)=>{
    const vals=L.map(e=>e.v[j]); const mx=Math.max(m.t*1.3,...vals);
    return {m,vals,mx};
  });
  const xs=i=>pad+(W-pad-8)*(L.length===1?0.5:i/(L.length-1));
  let svg=`<svg viewBox="0 0 ${W} ${H*sets.length}" width="100%" role="img" aria-label="実験結果の推移">`;
  sets.forEach((s,j)=>{
    const oy=j*H, ys=v=>oy+H-18-(H-34)*v/s.mx, col=j?"#29b6f6":"#3ee6b0";
    svg+=`<text x="${pad}" y="${oy+12}" font-size="12" fill="#93aba6">${s.m.l}（${s.m.u}）</text>`;
    svg+=`<line x1="${pad}" x2="${W-8}" y1="${ys(s.m.t)}" y2="${ys(s.m.t)}" stroke="#f7c948" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-10}" y="${ys(s.m.t)-4}" font-size="11" text-anchor="end" fill="#f7c948">目標 ${s.m.t}</text>`;
    svg+=`<line x1="${pad}" x2="${W-8}" y1="${oy+H-18}" y2="${oy+H-18}" stroke="rgba(255,255,255,.15)"/>`;
    let best=-1;svg+=`<polyline fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="1.5" points="${s.vals.map((v,i)=>{best=Math.max(best,v);return xs(i)+","+ys(best);}).join(" ")}"/>`;
    s.vals.forEach((v,i)=>{svg+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="4.5" fill="${v>=s.m.t?col:"none"}" stroke="${col}" stroke-width="2"/>`;});
  });
  svg+=`</svg>`;
  return`<div class="card"><h3>結果の推移</h3>${svg}<div class="small muted">● 目標達成 ○ 未達・薄線は最高値の更新</div></div>`;
}
function hintCard(pi){
  const p=PROJ[pi],P=S.P[pi]; const items=[];
  Object.keys(P.comp).forEach(k=>{const pr=p.params[k],arr=P.comp[k];const mx=Math.max(...arr);
    items.push(`<div class="hint"><b>💻 ${pr.comp}</b>（${pr.l}）<span class="small muted">相対スコア・高いほど有望</span>${arr.map((v,i)=>`<div class="hbar"><span class="nm">${esc(pr.o[i])}</span><span class="tr"><i style="width:${Math.max(3,v/mx*100)}%"></i></span><span class="vv">${(v*100).toFixed(0)}</span></div>`).join("")}</div>`);});
  Object.keys(P.lit).forEach(k=>{items.push(`<div class="hint">📚 文献メモ：${esc(p.params[k].l)}は「${esc(p.params[k].o[P.lit[k]])}」付近が良いらしい</div>`);});
  if(!items.length)return"";
  return`<div class="card"><h3>ヒント</h3>${items.join("")}</div>`;
}
function histCard(){
  if(!S.hist.length)return"";
  return`<div class="card"><h3>できごと</h3>${S.hist.slice(-6).reverse().map(h=>`<div class="hint"><span class="muted small">${h.m}</span> ${h.t}</div>`).join("")}</div>`;
}
function bossSay(html,after){
  modal(`<div class="boss"><div class="av">👨‍🔬</div><div class="bub">${html}</div></div><div class="btnrow"><button class="pri" id="ok">はい</button></div>`,sh=>{sh.querySelector("#ok").onclick=()=>{closeModal();if(after)after();};});
}
function log(t){S.hist.push({m:ymd(S.month),t});if(S.hist.length>40)S.hist.shift();}

// ---------- 実験 ----------
function openExp(){
  const pi=S.proj,p=PROJ[pi],P=S.P[pi];
  const n=Math.min(slots(),Math.floor(S.budget/p.cost));
  const last=P.log.length?P.log[P.log.length-1].c:p.params.map(()=>0);
  let sel=Array.from({length:n},(_,i)=>{
    const c=last.slice();
    if(P.log.length&&i>0){const k=i%p.params.length;c[k]=Math.min(p.params[k].o.length-1,Math.max(0,c[k]+(i%2?1:-1)));}
    else if(!P.log.length){p.params.forEach((pr,k)=>c[k]=Math.floor(pr.o.length/2));if(i>0){const k=(i-1)%p.params.length;c[k]=(c[k]+i)%p.params[k].o.length;}}
    return c;
  });
  let use=n;
  const draw=sh=>{
    sh.innerHTML=`<h2>🧪 実験計画</h2>
    <div class="small muted" style="margin-bottom:8px">1 試料 ${p.cost} 万円。材料合成スキルで同時に作れる試料数が増え、評価解析スキルで測定ばらつきが減ります。${S.flags.wet?'<span class="wn">露点悪化中：失敗しやすい</span>':""}</div>
    ${sel.map((c,si)=>`<div class="sample" style="${si>=use?"opacity:.35":""}"><div class="hd"><b>試料 ${si+1}</b><span class="sp" style="flex:1"></span>${si>0?`<button class="sm" data-tog="${si}">${si<use?"作らない":"作る"}</button>`:""}</div>
     ${p.params.map((pr,k)=>`<div class="prm"><div class="pl">${pr.l}</div><div class="seg">${pr.o.map((o,oi)=>`<button data-s="${si}" data-k="${k}" data-o="${oi}" class="${c[k]===oi?"on":""}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    </div>`).join("")}
    <div class="btnrow"><button id="cx">やめる</button><button class="pri" id="go">${use} 試料を作製（${use*p.cost} 万円）</button></div>`;
    sh.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel[+b.dataset.s][+b.dataset.k]=+b.dataset.o;draw(sh);});
    sh.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const si=+b.dataset.tog;use=si<use?si:si+1;draw(sh);});
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelector("#go").onclick=()=>runExp(sel.slice(0,use));
  };
  modal("",draw);
}
function runExp(list){
  const pi=S.proj,p=PROJ[pi],P=S.P[pi];
  S.budget-=list.length*p.cost; S.soc-=25;
  const res=list.map(c=>measure(pi,c));
  S.flags.wet=0;S.flags.extra=0;
  res.forEach(r=>{P.log.push(r);if(r.ok)P.hits++;});
  p.skills.forEach(k=>gain(k,1.5));
  gain("hyoka",.8);
  const hit=res.filter(r=>r.ok).length;
  log(`${p.icon} 実験 ${res.length} 試料${hit?`（目標達成 ${hit}）`:""}`);
  const done=P.hits>=2&&!P.done;
  const html=`<h2>📊 測定結果</h2>${res.map((r,i)=>`<div class="res"><div class="small muted">試料 ${i+1}：${esc(shortCond(p,r.c))}</div>
   ${r.v.map((v,j)=>`<div><span class="small muted">${p.metrics[j].l}</span> <span class="big ${v>=p.metrics[j].t?"ok":""}">${fmt(v,p.metrics[j].d)}</span> <span class="small muted">${p.metrics[j].u}</span></div>`).join("")}
   ${r.notes.map(n=>`<span class="pill ${r.fail?"ng":""}">${esc(n)}</span>`).join("")}
   ${r.ok?`<div class="ok small" style="margin-top:4px">✓ 目標性能をクリア！</div>`:""}</div>`).join("")}
   <div class="btnrow"><button class="pri" id="ok">${done?"テーマ達成へ":"次の月へ"}</button></div>`;
  modal(html,sh=>sh.querySelector("#ok").onclick=()=>{if(done)completeProj(pi);else endMonth();});
}
function completeProj(pi){
  const p=PROJ[pi],P=S.P[pi];P.done=true;P.doneM=S.month;
  const used=S.month-P.startM+1, bonus=Math.max(0,9-used)*2;
  const r=25+bonus; S.rep+=r; p.skills.forEach(k=>gain(k,4)); S.budget+=100;
  log(`🏆 「${p.name}」達成！ 評価 +${r}`);
  const next=pi+1<PROJ.length?pi+1:pi;
  const msg=`<b>「${p.name}」達成！</b><br>${used} ヶ月で再現性まで確認できたな。評価 +${r}、報奨予算 +100 万円。<br><br>`+
   (pi+1<PROJ.length?PROJ[pi+1].intro:"……全テーマ完遂だ。全固体電池の量産化検討が正式に始まるぞ。本当によくやった。");
  if(pi+1<PROJ.length){S.proj=next;S.P[next].startM=S.month+1;}
  bossSay(msg,endMonth);
}

// ---------- 計算 ----------
function openComp(){
  const pi=S.proj,p=PROJ[pi];
  const opts=p.params.map((pr,k)=>({pr,k})).filter(x=>x.pr.comp);
  modal(`<h2>💻 計算スクリーニング</h2><div class="small muted" style="margin-bottom:10px">DFT・機械学習ポテンシャルで候補を比べます。計算科学スキルが高いほど予測が正確になります（今の精度 ±${Math.round(25*(1-S.sk.keisan/120))} %）。</div>
   ${opts.map(x=>`<button class="qopt" data-k="${x.k}"><b>${x.pr.comp}</b><br><span class="small muted">${x.pr.l}：${x.pr.o.join(" / ")}</span></button>`).join("")}
   <div class="btnrow"><button id="cx">やめる</button></div>`,sh=>{
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>runComp(+b.dataset.k));
  });
}
function runComp(k){
  const pi=S.proj,p=PROJ[pi],pr=p.params[k];
  const sd=.25*(1-S.sk.keisan/120);
  // 他パラメータは計算上の理想条件（＝既知の有望条件）に固定
  const truth=pr.o.map((_,i)=>{const c=p.best.slice();c[k]=i;return p.calc(c).v.reduce((a,b,j)=>a*(b/p.metrics[j].t),1);});
  const mx=Math.max(...truth);
  const pred=truth.map(t=>Math.max(.02,t/mx*(1+gauss()*sd)));
  const prev=S.P[pi].comp[k];
  S.P[pi].comp[k]=prev?prev.map((v,i)=>(v+pred[i])/2):pred;
  S.soc-=15; gain("keisan",3); if(pi===1)gain("keisan",1);
  log(`💻 ${pr.comp}を実行`);
  const arr=S.P[pi].comp[k],m2=Math.max(...arr);
  modal(`<h2>💻 ${pr.comp}</h2><div class="small muted">${prev?"前回の計算と平均しました。":""}相対スコア（高いほど有望）</div>
   ${arr.map((v,i)=>`<div class="hbar"><span class="nm">${esc(pr.o[i])}</span><span class="tr"><i style="width:${Math.max(3,v/m2*100)}%"></i></span><span class="vv">${(v*100).toFixed(0)}</span></div>`).join("")}
   <div class="expl">${compComment(pi,k)}</div>
   <div class="btnrow"><button class="pri" id="ok">次の月へ</button></div>`,sh=>sh.querySelector("#ok").onclick=endMonth);
}
function compComment(pi,k){
  const id=PROJ[pi].id+":"+k;
  return ({
   "sulf:0":"AIMD（600–900 K）の MSD から外挿。Cl 量を増やすと S²⁻/Cl⁻ のサイト乱れが増えて Li の拡散障壁が下がるが、上げすぎると LiCl が分離する、という傾向が出た。",
   "oxcl:0":"固溶エネルギーの比較。Ta⁵⁺ は単独だと固溶しにくい（+2.9 eV）が、O と組ませると +1.4 eV まで下がる。O を入れる前提で評価すると Ta が最有望。",
   "oxcl:1":"Ta に O を結合させた配置が LaOCl を作るより安定。1 個目 −1.08 eV、2 個目 −0.43 eV で、O/Ta ≈ 2 を超えると LaOCl 析出が優勢になる見込み。",
   "ncm:2":"硫化物と被覆材の界面反応エネルギー。LiNbO₃ は硫化物と反応しにくく Li 伝導もあるが、厚すぎると抵抗になる。"
  })[id]||"計算結果を実験計画に活かそう。";
}

// ---------- 勉強 ----------
function openStudy(){
  modal(`<h2>📚 勉強する分野</h2><div class="small muted" style="margin-bottom:8px">3 問出題。正解で +5、不正解でも解説を読んで +1.5。文献メモが見つかることも。</div>
   ${SKK.map(k=>`<button class="qopt" data-k="${k}"><b style="color:${SK[k].c}">${SK[k].n}</b> <span class="small muted">現在 ${Math.round(S.sk[k])}</span></button>`).join("")}
   <div class="btnrow"><button id="cx">やめる</button></div>`,sh=>{
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.k));
  });
}
function pickQ(f){
  const pool=QZ.map((q,i)=>({q,i})).filter(x=>x.q.f===f);
  let fresh=pool.filter(x=>!S.seen[x.i]);
  if(fresh.length<3){pool.forEach(x=>delete S.seen[x.i]);fresh=pool;}
  const out=[];while(out.length<3&&fresh.length){const j=Math.floor(Math.random()*fresh.length);out.push(fresh.splice(j,1)[0]);}
  out.forEach(x=>S.seen[x.i]=1);return out.map(x=>x.q);
}
function startQuiz(f){
  S.soc-=12;S.lastStudy=f;
  const qs=pickQ(f);let qi=0,correct=0;
  const show=sh=>{
    const q=qs[qi];const order=[0,1,2,3].sort(()=>Math.random()-.5);
    sh.innerHTML=`<h2>📚 ${SK[f].n} クイズ ${qi+1}/3</h2><div style="line-height:1.7;margin-bottom:6px">${q.q}</div>
     ${order.map(o=>`<button class="qopt" data-o="${o}">${q.c[o]}</button>`).join("")}<div id="ex"></div>`;
    sh.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const o=+b.dataset.o,ok=o===q.a;if(ok)correct++;
      gain(f,ok?5:1.5);
      sh.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;x.style.opacity=1;if(+x.dataset.o===q.a)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
      sh.querySelector("#ex").innerHTML=`<div class="expl"><b class="${ok?"ok":"ng"}">${ok?"正解！":"残念…"}</b> ${q.e}</div><div class="btnrow"><button class="pri" id="nx">${qi<2?"次の問題":"結果へ"}</button></div>`;
      sh.querySelector("#nx").onclick=()=>{qi++;if(qi<3)show(sh);else quizEnd(f,correct);};
    });
  };
  modal("",show);
}
function quizEnd(f,correct){
  let lit="";
  const pi=S.proj,p=PROJ[pi],P=S.P[pi];
  if(!P.done&&Math.random()<.35+correct*.15){
    const cand=p.params.map((_,k)=>k).filter(k=>P.lit[k]===undefined);
    if(cand.length){const k=rnd(cand);const acc=.55+S.sk[f]/250;let o=p.best[k];
      if(Math.random()>acc)o=Math.min(p.params[k].o.length-1,Math.max(0,o+(Math.random()<.5?-1:1)));
      P.lit[k]=o;lit=`<div class="expl">📄 関連論文を見つけた：<b>${esc(p.params[k].l)}</b>は「${esc(p.params[k].o[o])}」付近が良いという報告がある（ヒントに記録）。</div>`;}
  }
  if(correct===3){gain(f,3);}
  log(`📚 ${SK[f].n}を勉強（${correct}/3 正解）`);
  modal(`<h2>📚 勉強おわり</h2><div class="res"><span class="big">${correct} / 3</span> 正解 ${correct===3?'<span class="tag g">全問正解ボーナス +3</span>':""}<div class="small muted" style="margin-top:4px">${SK[f].n} → ${Math.round(S.sk[f])}</div></div>${lit}<div class="btnrow"><button class="pri" id="ok">次の月へ</button></div>`,sh=>sh.querySelector("#ok").onclick=endMonth);
}

// ---------- 学会 ----------
function openPub(){
  const list=S.P.map((x,i)=>({x,i})).filter(o=>o.x.log.length);
  modal(`<h2>🎤 学会発表</h2><div class="small muted" style="margin-bottom:8px">成果が目標に近いほど評価が上がります。同じテーマで何度も発表すると反響は小さくなります。</div>
   ${list.map(o=>{const r=ratio(o.i),g=pubGain(o.i);return`<button class="qopt" data-i="${o.i}"><b>${PROJ[o.i].icon} ${PROJ[o.i].name}</b>${o.x.done?' <span class="tag">達成済</span>':""}<br><span class="small muted">到達度 ${(r*100).toFixed(0)} %・発表 ${o.x.pubs} 回・見込み 評価 +${g}</span></button>`;}).join("")}
   <div class="btnrow"><button id="cx">やめる</button></div>`,sh=>{
    sh.querySelector("#cx").onclick=closeModal;
    sh.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>doPub(+b.dataset.i));
  });
}
function pubGain(i){const r=Math.min(1.3,ratio(i));return Math.max(1,Math.round((3+14*r*r)*Math.pow(.55,S.P[i].pubs)*(S.P[i].done?1.2:1)));}
function doPub(i){
  const g=pubGain(i);S.rep+=g;S.P[i].pubs++;S.soc-=20;gain("denki",1.5);gain("hyoka",1);
  const q=rnd(["「その伝導度、粒界の寄与は分離していますか？」","「電子伝導度は測りましたか？」","「再現性は何回確認しましたか？」","「計算と実験のずれはどう解釈していますか？」","「大気安定性はどうですか？」","「スケールアップの見通しは？」"]);
  log(`🎤 ${PROJ[i].name}を発表 評価 +${g}`);
  modal(`<h2>🎤 発表しました</h2><div class="res">質疑応答：${q}<div class="big" style="margin-top:6px">評価 +${g}</div></div><div class="btnrow"><button class="pri" id="ok">次の月へ</button></div>`,sh=>sh.querySelector("#ok").onclick=endMonth);
}
// ---------- 予算・休養 ----------
function doGrant(){
  S.soc-=15;S.grantCd=4;
  const p=Math.min(.9,.35+S.rep/300),ok=Math.random()<p;
  const amt=150+S.rep*2;
  if(ok)S.budget+=amt;
  log(ok?`📝 予算申請が通った +${amt}万`:"📝 予算申請は不採択");
  modal(`<h2>📝 予算申請</h2><div class="res">${ok?`<span class="big ok">採択！</span><br>予算 +${amt} 万円`:`<span class="big ng">不採択…</span><br><span class="small muted">評価を上げると通りやすくなります（採択率 ${Math.round(p*100)} %）</span>`}</div><div class="btnrow"><button class="pri" id="ok">次の月へ</button></div>`,sh=>sh.querySelector("#ok").onclick=endMonth);
}
function doRest(){S.soc=Math.min(100,S.soc+45);log("☕ 休養した");toast("☕ リフレッシュ！ SOC +45 %");endMonth();}

// ---------- 月送り ----------
function endMonth(){
  closeModal();
  S.month++;S.soc=Math.min(100,S.soc+8);S.budget+=monthlyBudget();if(S.grantCd>0)S.grantCd--;
  if(S.month>MAXM){finishGame(false);return;}
  save();render();
  const after=()=>{
    const r1=rankIdx(),r0=S.lastRank||0;S.lastRank=r1;save();
    if(r1>r0)bossSay(`昇格おめでとう！今日から<b>${RANKS[r1][1]}</b>だ。毎月の研究予算も増える（${monthlyBudget()} 万円/月）。`);
    else if(S.month===MAXM)toast("⏳ 最後の 1 ヶ月！");
  };
  if(Math.random()<.33){
    const pool=EVENTS.filter(e=>!e.cond||e.cond(S));let tot=pool.reduce((a,e)=>a+e.w,0),x=Math.random()*tot,ev=pool[0];
    for(const e of pool){x-=e.w;if(x<=0){ev=e;break;}}
    if(ev.choice){
      modal(`<h2>${ev.e} できごと</h2><div class="res">${ev.t}</div>${ev.choice.map((c,i)=>`<button class="qopt" data-i="${i}">${c.l}</button>`).join("")}`,sh=>sh.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const t=ev.choice[+b.dataset.i].f(S);log(`${ev.e} ${ev.t} → ${t}`);render();toast(t);after();}));
    }else{
      const t=ev.f(S);log(`${ev.e} ${ev.t}（${t}）`);render();
      modal(`<h2>${ev.e} できごと</h2><div class="res">${ev.t}<div class="small muted" style="margin-top:4px">${t}</div></div><div class="btnrow"><button class="pri" id="ok">OK</button></div>`,sh=>sh.querySelector("#ok").onclick=()=>{closeModal();render();after();});
    }
  } else after();
}

// ---------- エンディング ----------
function finishGame(early){
  if(early){const rem=MAXM-S.month+1;const b=rem*2;S.rep+=b;log(`📘 最終報告（残り ${rem} ヶ月ボーナス 評価 +${b}）`);}
  S.over=true;save();endScreen();
}
function endScreen(){
  closeModal();
  const done=S.P.filter(x=>x.done).length, r=rankIdx();
  const skillSum=SKK.reduce((a,k)=>a+S.sk[k],0);
  const score=Math.round(S.rep*10+skillSum*2+done*150);
  const ending = done===4?(r>=5?"全固体電池の父／母と呼ばれ、量産ラインの立ち上げを任された。":r>=3?"全固体電池プロジェクトの中核として、次世代電池部門を率いることになった。":"全テーマを完遂。地道な成果が認められ、次の大型プロジェクトに抜擢された。")
    : done>=2?"電解質の成果が高く評価された。セル化は次の世代へ託される。":done===1?"最初のテーマで確かな手応えをつかんだ。研究者人生はまだ始まったばかり。":"思うような成果は出なかったが、多くを学んだ 3 年間だった。";
  const top=SKK.slice().sort((a,b)=>S.sk[b]-S.sk[a])[0];
  app.innerHTML=topBar()+`<main><div class="card" style="text-align:center">
   <div style="font-size:48px">${done===4?"🏆":done>=2?"🎖️":"📘"}</div>
   <div class="small muted">${esc(S.name)} の 3 年間</div>
   <div class="endrank">${RANKS[r][1]}</div>
   <div style="line-height:1.8">${ending}</div>
   <div class="targets" style="margin-top:12px">
    <div class="tbox"><div class="lb">達成テーマ</div><div class="v">${done} / 4</div></div>
    <div class="tbox"><div class="lb">評価</div><div class="v">⭐ ${S.rep}</div></div>
    <div class="tbox"><div class="lb">得意分野</div><div class="v" style="font-size:15px;color:${SK[top].c}">${SK[top].n}</div></div>
    <div class="tbox"><div class="lb">総合スコア</div><div class="v" style="color:var(--gold)">${score}</div></div>
   </div></div>
   <div class="card"><h3>テーマ別</h3>${PROJ.map((p,i)=>{const P=S.P[i];return`<div class="hint">${p.icon} <b>${p.name}</b> ${P.done?`<span class="tag">達成（${ymd(P.doneM)}）</span>`:`<span class="tag r">未達</span>`}<div class="small muted">試料 ${P.log.length} 個・発表 ${P.pubs} 回${P.log.length?`・最高 ${p.metrics.map((m,j)=>fmt(Math.max(...P.log.map(e=>e.v[j])),m.d)+" "+m.u).join(" / ")}`:""}</div></div>`;}).join("")}</div>
   ${histCard()}
   <button class="pri" id="again" style="width:100%">もう一度あそぶ</button>
  </main>`;
  app.querySelector("#again").onclick=()=>{clearSave();titleScreen();};
}

titleScreen();
</script></body></html>
